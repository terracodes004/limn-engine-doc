<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade — Limn</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a14; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; }
  header { padding: 20px 32px; display: flex;
           justify-content: space-between; align-items: center;
           border-bottom: 1px solid rgba(255,255,255,0.1);
           gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
  .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-links a { color: #4af; text-decoration: none; font-weight: 600;
                 padding: 8px 16px; border-radius: 8px;
                 background: rgba(68,170,255,0.1);
                 border: 1px solid rgba(68,170,255,0.25);
                 font-size: 14px; }
  .nav-links a:hover { background: rgba(68,170,255,0.2); }
  .search-bar { padding: 16px 32px 0;
                max-width: 1400px; margin: 0 auto; }
  .search-bar input { width: 100%; padding: 14px 18px;
                      background: #15152a;
                      border: 1px solid rgba(255,255,255,0.12);
                      border-radius: 10px; color: #fff;
                      font-size: 15px; font-family: inherit; }
  .search-bar input:focus { outline: none;
                            border-color: rgba(68,170,255,0.6);
                            box-shadow: 0 0 0 3px rgba(68,170,255,0.15); }
  .featured-wrap { padding: 20px 32px 0;
                   max-width: 1400px; margin: 0 auto; }
  main { padding: 24px 32px 32px; display: grid;
         grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
         gap: 20px; max-width: 1400px; margin: 0 auto; }
  .card { background: linear-gradient(180deg,#15152a,#10101e);
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 14px; overflow: hidden;
          transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
          text-decoration: none; color: inherit; display: block; }
  .card:hover { transform: translateY(-2px);
                border-color: rgba(68,170,255,0.6);
                box-shadow: 0 8px 24px rgba(68,170,255,0.15); }
  .thumb { width: 100%; aspect-ratio: 4/3; display: block; }
  .info { padding: 14px 16px; }
  .info h3 { margin: 0 0 4px; font-size: 16px;
             white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }
  .info p { margin: 0; font-size: 13px; opacity: 0.7;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; }
  .info a { color: #fbbf24; text-decoration: none; font-weight: 600; }
  .info a:hover { color: #fde68a; text-decoration: underline; }
  .empty { grid-column: 1/-1; text-align: center;
           padding: 80px 20px; opacity: 0.5; }
  .empty a { color: #4af; text-decoration: none; font-weight: 600; }

  .featured {
    border-radius: 18px;
    padding: 32px;
    display: flex; align-items: center; gap: 24px;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(135deg,
        #ec4899 0%,
        #f97316 25%,
        #facc15 50%,
        #22d3ee 75%,
        #6366f1 100%);
    box-shadow: 0 12px 40px rgba(236,72,153,0.3),
                0 4px 16px rgba(34,211,238,0.2);
  }
  .featured::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.35) 100%);
    pointer-events: none;
  }
  .featured > * { position: relative; z-index: 1; }
  .featured-tag {
    font-size: 12px; font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .featured-title {
    margin: 0 0 8px; font-size: 30px;
    letter-spacing: -0.7px;
    color: #ffffff;
    font-weight: 900;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    line-height: 1.1;
  }
  .featured-sub {
    margin: 0; font-size: 15px;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .featured-sub a {
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    border-bottom: 2px solid rgba(255,255,255,0.6);
    padding-bottom: 1px;
  }
  .featured-sub a:hover {
    border-bottom-color: #ffffff;
  }
  .featured-hearts {
    display: inline-flex; align-items: center; gap: 4px;
    color: #ffffff;
    font-weight: 800;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .featured-play {
    padding: 16px 32px;
    background: #0a0a14;
    color: #ffffff;
    border-radius: 12px;
    font-weight: 800;
    text-decoration: none;
    font-size: 16px;
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.15s, background 0.15s;
  }
  .featured-play:hover {
    transform: scale(1.05);
    background: #1a1a2e;
  }
</style>
</head>
<body>

<header>
  <h1>Arcade</h1>
  <div class="nav-links">
    <a href="/my-games.html">📁 My Games</a>
    <a href="/arcade/leaderboard.html">🏆 Leaderboard</a>
    <a href="/editor/">+ Make a game</a>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search games or creators...">
</div>

<div class="featured-wrap" id="featuredWrap" style="display:none"></div>

<main id="grid"><div class="empty"><h2>Loading...</h2></div></main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const { data, error } = await supabase
  .from('games')
  .select('id, slug, title, author_id, author_name, config')
  .order('created_at', { ascending: false })
  .limit(200);

const games = data || [];

const userIds = [...new Set(games.map(g => g.author_id).filter(Boolean))];

const profileMap = {};
if (userIds.length > 0) {
  const { data: profiles } = await supabase
    .from('profiles')
    .select('user_id, username, display_name')
    .in('user_id', userIds);

  for (const p of profiles || []) profileMap[p.user_id] = p;
}

function creatorLabel(game) {
  const profile = profileMap[game.author_id];
  if (profile && profile.username) return '@' + profile.username;
  if (profile && profile.display_name) return profile.display_name;
  if (game.author_name) return game.author_name.split('@')[0];
  return 'anonymous';
}

function creatorLink(game) {
  const profile = profileMap[game.author_id];
  if (profile && profile.username) {
    return '<a href="/u/?u=' + encodeURIComponent(profile.username) + '">@' + esc(profile.username) + '</a>';
  }
  return esc(creatorLabel(game));
}

function creatorLinkFeatured(game) {
  const profile = profileMap[game.author_id];
  if (profile && profile.username) {
    return '<a href="/u/?u=' + encodeURIComponent(profile.username) + '">@' + esc(profile.username) + '</a>';
  }
  return esc(creatorLabel(game));
}

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const allGames = games;

function render(list) {
  if (error) {
    grid.innerHTML = '<div class="empty"><h2>Failed to load games.</h2></div>';
    return;
  }
  if (!list || list.length === 0) {
    const msg = searchInput.value.trim()
      ? 'No games match your search.'
      : 'No games yet.';
    grid.innerHTML = `<div class="empty">
      <h2>${msg}</h2>
      ${searchInput.value.trim() ? '' : '<p><a href="/editor/">Make the first one →</a></p>'}
    </div>`;
    return;
  }
  grid.innerHTML = '';
  for (const g of list) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '/arcade/game.html?slug=' + encodeURIComponent(g.slug);
    a.innerHTML = `
      ${thumbSVG(g.config)}
      <div class="info">
        <h3>${esc(g.title)}</h3>
        <p>by ${creatorLink(g)}</p>
      </div>`;
    grid.appendChild(a);
  }
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { render(allGames); return; }
  const filtered = allGames.filter(g => {
    const label = creatorLabel(g).toLowerCase();
    return (g.title || '').toLowerCase().includes(q) ||
           label.includes(q);
  });
  render(filtered);
});

render(allGames);

async function loadFeatured() {
  const now = new Date();
  const d = (now.getUTCDay() + 6) % 7;
  const weekStart = new Date(Date.UTC(now.getUTCFullYear(),
    now.getUTCMonth(), now.getUTCDate() - d, 0, 0, 0)).toISOString();

  const { data: weekLikes } = await supabase
    .from('likes')
    .select('game_id')
    .gte('created_at', weekStart);

  if (!weekLikes || weekLikes.length === 0) return;

  const counts = {};
  for (const l of weekLikes) counts[l.game_id] = (counts[l.game_id] || 0) + 1;

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (sorted.length === 0) return;

  const topId = sorted[0][0];
  const top = games.find(g => g.id === topId);
  if (!top) return;

  const wrap = document.getElementById('featuredWrap');
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div class="featured">
      <div style="flex: 1; min-width: 200px;">
        <div class="featured-tag">
          <span>🏆</span>
          <span>Game of the Week</span>
        </div>
        <h2 class="featured-title">${esc(top.title)}</h2>
        <p class="featured-sub">
          by ${creatorLinkFeatured(top)}
          &nbsp;·&nbsp;
          <span class="featured-hearts">♥ ${counts[topId]}</span>
        </p>
      </div>
      <a href="/arcade/game.html?slug=${encodeURIComponent(top.slug)}"
         class="featured-play">
        ▶ Play Now
      </a>
    </div>`;
}

loadFeatured();

function thumbSVG(config) {
  const w = 300, h = 225;
  const world = (config && config.world) || { w: 800, h: 600, bg: '#0d0d2a' };
  const slots = (config && config.slots) || [];
  const sx = w / world.w, sy = h / world.h;
  let rects = '';
  for (const s of slots) {
    rects += `<rect x="${s.x*sx}" y="${s.y*sy}"
                    width="${s.w*sx}" height="${s.h*sy}"
                    fill="${s.color||'#4af'}" />`;
  }
  if (!rects) rects = `<text x="${w/2}" y="${h/2}" text-anchor="middle"
                             fill="#4af" font-size="40">▶</text>`;
  return `<svg class="thumb" viewBox="0 0 ${w} ${h}"
               preserveAspectRatio="xMidYMid slice"
               style="background:${world.bg||'#0d0d2a'}">${rects}</svg>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
</script>

</body>
 </html>
