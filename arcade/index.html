<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade — Limn</title>
<style>
  :root {
    --bg: #05060c;
    --bg-1: #0a0c16;
    --panel: rgba(18,20,32,0.65);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --text: #f0f3f8;
    --text-1: #a3aac0;
    --text-2: #6e7589;
    --accent: #6ea8fe;
    --accent-2: #a371f7;
    --accent-3: #ec4899;
    --success: #4ade80;
    --warning: #fbbf24;
    --radius: 12px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    top: -40vh; left: -20vw;
    width: 80vw; height: 80vh;
    background: radial-gradient(circle, rgba(110,168,254,0.12), transparent 60%);
    pointer-events: none;
    z-index: 0;
    animation: float1 22s ease-in-out infinite alternate;
  }
  body::after {
    content: "";
    position: fixed;
    bottom: -40vh; right: -20vw;
    width: 80vw; height: 80vh;
    background: radial-gradient(circle, rgba(163,113,247,0.1), transparent 60%);
    pointer-events: none;
    z-index: 0;
    animation: float2 26s ease-in-out infinite alternate;
  }
  @keyframes float1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(6vw, 6vh) scale(1.12); }
  }
  @keyframes float2 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-6vw, -6vh) scale(1.15); }
  }

  @keyframes sweep {
    0%   { background-position: -200% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  @keyframes logoBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .app { position: relative; z-index: 1; }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: rgba(5,6,12,0.72);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(110,168,254,0.5) 20%,
      rgba(163,113,247,0.6) 50%,
      rgba(236,72,153,0.5) 80%,
      transparent 100%);
    background-size: 200% 100%;
    animation: sweep 8s linear infinite;
    opacity: 0.7;
    pointer-events: none;
  }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand-logo {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: logoBob 5s ease-in-out infinite;
    position: relative;
  }
  .brand-logo img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    border-radius: 10px;
    background: var(--bg);
    padding: 3px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 0 18px rgba(110,168,254,0.35),
      0 0 36px rgba(163,113,247,0.2);
    transition: box-shadow 0.3s;
  }
  .brand-logo:hover img {
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.1),
      0 0 26px rgba(110,168,254,0.6),
      0 0 52px rgba(163,113,247,0.4);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.05;
    min-width: 0;
  }
  .brand-name {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.6px;
    color: var(--text);
    background: linear-gradient(120deg,
      #f0f3f8 0%,
      #f0f3f8 40%,
      #6ea8fe 50%,
      #a371f7 60%,
      #f0f3f8 70%,
      #f0f3f8 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sweep 9s linear infinite;
  }
  .brand-sub {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 2.4px;
    color: var(--text-2);
    margin-top: 3px;
  }

  .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-links a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    font-size: 13px;
    white-space: nowrap;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .nav-links a::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(110,168,254,0.15), rgba(163,113,247,0.15));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-links a:hover {
    border-color: var(--border-2);
    transform: translateY(-1px);
  }
  .nav-links a:hover::before { opacity: 1; }
  .nav-links a > * { position: relative; z-index: 1; }

  .hero {
    position: relative;
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero-card {
    position: relative;
    width: 100%;
    border-radius: 20px;
    padding: 26px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(20,22,36,0.9), rgba(12,14,24,0.9));
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(14px);
    isolation: isolate;
  }
  .hero-card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 21px;
    padding: 1px;
    background: linear-gradient(120deg,
      rgba(110,168,254,0.5),
      rgba(163,113,247,0.5),
      rgba(236,72,153,0.5),
      rgba(251,191,36,0.4),
      rgba(74,222,128,0.4),
      rgba(110,168,254,0.5));
    background-size: 300% 100%;
    animation: sweep 12s linear infinite;
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 2;
  }
  .hero-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(110,168,254,0.18), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(236,72,153,0.14), transparent 55%);
    pointer-events: none;
    z-index: 0;
    animation: glowPulse 6s ease-in-out infinite;
  }

  .hero-logo {
    position: relative;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    z-index: 3;
    animation: logoBob 6s ease-in-out infinite;
  }
  .hero-logo::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #6ea8fe, #a371f7, #ec4899, #fbbf24, #4ade80, #6ea8fe);
    filter: blur(16px);
    opacity: 0.6;
    animation: spin 10s linear infinite;
    z-index: 0;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .hero-logo img {
    position: relative;
    z-index: 1;
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 18px;
    background: var(--bg);
    padding: 5px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 0 24px rgba(110,168,254,0.45),
      0 0 48px rgba(163,113,247,0.3);
  }

  .hero-text {
    flex: 1;
    min-width: 200px;
    z-index: 3;
  }
  .hero-text h2 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.15;
    color: var(--text);
    background: linear-gradient(120deg,
      #f0f3f8 0%,
      #f0f3f8 35%,
      #6ea8fe 45%,
      #a371f7 55%,
      #ec4899 62%,
      #f0f3f8 72%,
      #f0f3f8 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sweep 11s linear infinite;
  }
  .hero-text p {
    margin: 0;
    color: var(--text-1);
    font-size: 13.5px;
    line-height: 1.55;
    max-width: 520px;
  }

  .search-bar {
    padding: 16px 20px 0;
    max-width: 900px;
    margin: 0 auto;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    padding: 13px 16px 13px 44px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  .search-bar::before {
    content: "🔍";
    position: absolute;
    left: 34px;
    top: 50%;
    transform: translateY(-30%);
    font-size: 15px;
    opacity: 0.5;
    pointer-events: none;
  }
  .search-bar input:focus {
    outline: none;
    border-color: rgba(110,168,254,0.6);
    box-shadow: 0 0 0 4px rgba(110,168,254,0.15);
    background: rgba(18,20,32,0.9);
  }
  .search-bar input::placeholder { color: var(--text-2); }

  .view-toggle {
    display: flex;
    gap: 6px;
    padding: 12px 20px 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .view-toggle button {
    flex: 1;
    padding: 11px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }
  .view-toggle button:hover { color: var(--text-1); border-color: var(--border-2); }
  .view-toggle button.active {
    background: linear-gradient(135deg, rgba(110,168,254,0.18), rgba(163,113,247,0.18));
    border-color: rgba(110,168,254,0.55);
    color: #fff;
    box-shadow: 0 0 20px rgba(110,168,254,0.25);
  }
  .view-toggle button.active::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 2px;
  }

  .featured-wrap { padding: 16px 20px 0; max-width: 900px; margin: 0 auto; }

  main { padding: 18px 20px 40px; max-width: 900px; margin: 0 auto; }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.5;
    margin: 22px 0 12px;
    font-weight: 800;
  }
  .section-title:first-child { margin-top: 0; }

  .creator-card {
    background: linear-gradient(180deg, rgba(21,21,42,0.8), rgba(16,16,30,0.8));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    backdrop-filter: blur(10px);
    animation: cardIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .creator-card:hover {
    border-color: rgba(110,168,254,0.35);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 40px rgba(110,168,254,0.08);
  }
  .creator-card.expanded { border-color: rgba(110,168,254,0.55); }

  .creator-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    position: relative;
    z-index: 1;
  }

  .creator-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    background: #202040;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(110,168,254,0.35),
                0 0 20px rgba(110,168,254,0.25);
    transition: box-shadow 0.3s;
    cursor: pointer;
  }
  .creator-avatar.fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    color: #fff;
    background: linear-gradient(135deg, #6ea8fe, #a371f7);
  }
  .creator-head:hover .creator-avatar {
    box-shadow: 0 0 0 2px rgba(163,113,247,0.55),
                0 0 30px rgba(163,113,247,0.45);
  }

  .creator-info { flex: 1; min-width: 0; cursor: pointer; }
  .creator-info h3 {
    margin: 0 0 3px;
    font-size: 15px;
    font-weight: 700;
    color: var(--warning);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .creator-info p {
    margin: 0;
    font-size: 11.5px;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .see-more-btn {
    padding: 7px 14px;
    border: 1px solid rgba(110,168,254,0.4);
    background: rgba(110,168,254,0.08);
    color: var(--accent);
    border-radius: 9px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .see-more-btn:hover {
    background: rgba(110,168,254,0.2);
    transform: scale(1.04);
  }

  .creator-games {
    display: none;
    padding: 12px 16px 16px;
    border-top: 1px solid rgba(255,255,255,0.05);
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .creator-card.expanded .creator-games {
    display: grid;
    animation: expandIn 0.3s ease;
  }
  @keyframes expandIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .creator-games.always-open { display: grid; }

  .game-tile {
    background: #0a0a18;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .game-tile:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: rgba(110,168,254,0.6);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 30px rgba(110,168,254,0.2);
  }
  .game-tile .tile-thumb {
    width: 100%;
    aspect-ratio: 16/10;
    display: block;
  }
  .game-tile .tile-name {
    padding: 8px 10px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.9;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 12px;
  }
  .project-card {
    background: linear-gradient(180deg, rgba(21,21,42,0.8), rgba(16,16,30,0.8));
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    backdrop-filter: blur(10px);
    animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  .project-card:hover {
    transform: translateY(-5px);
    border-color: rgba(110,168,254,0.65);
    box-shadow: 0 16px 44px rgba(0,0,0,0.5), 0 0 40px rgba(110,168,254,0.15);
  }
  .project-card .thumb {
    width: 100%;
    aspect-ratio: 4/3;
    display: block;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .project-card:hover .thumb {
    transform: scale(1.06);
  }
  .project-card .thumb-wrap {
    overflow: hidden;
    position: relative;
  }
  .project-card .p-info { padding: 10px 12px; }
  .project-card .p-info h3 {
    margin: 0 0 3px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .project-card .p-info p {
    margin: 0;
    font-size: 11px;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .load-more-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 0 12px;
  }
  .load-more-btn {
    padding: 13px 28px;
    background: linear-gradient(135deg, #6ea8fe, #a371f7);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 24px rgba(110,168,254,0.35);
    transition: all 0.22s;
    position: relative;
    overflow: hidden;
  }
  .load-more-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #a371f7, #ec4899);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .load-more-btn > * { position: relative; z-index: 1; }
  .load-more-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 36px rgba(163,113,247,0.5);
  }
  .load-more-btn:hover::before { opacity: 1; }
  .load-more-btn.secondary {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-2);
    box-shadow: none;
    font-weight: 700;
    color: var(--text-1);
  }
  .load-more-btn.secondary:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    transform: translateY(-2px);
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    opacity: 0.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .empty h2 {
    font-weight: 700;
    font-size: 18px;
    margin: 0;
  }
  .empty::before {
    content: "🎮";
    font-size: 56px;
    opacity: 0.6;
    animation: logoBob 3s ease-in-out infinite;
  }
  .empty a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    padding: 10px 20px;
    background: rgba(110,168,254,0.1);
    border: 1px solid rgba(110,168,254,0.3);
    border-radius: 10px;
    transition: all 0.2s;
  }
  .empty a:hover {
    background: rgba(110,168,254,0.2);
    transform: translateY(-1px);
  }

  .featured {
    border-radius: 18px;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg,
      #ec4899 0%, #a371f7 25%, #6ea8fe 50%, #22d3ee 75%, #4ade80 100%);
    background-size: 200% 200%;
    animation: gradShift 12s ease-in-out infinite;
    box-shadow: 0 20px 60px rgba(236,72,153,0.3),
                0 8px 24px rgba(34,211,238,0.2);
  }
  @keyframes gradShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .featured::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.4) 100%);
    pointer-events: none;
  }
  .featured::after {
    content: "";
    position: absolute;
    top: -50%; right: -20%;
    width: 60%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 60%);
    animation: shimmer 6s linear infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%) rotate(15deg); }
    100% { transform: translateX(300%) rotate(15deg); }
  }
  .featured > * { position: relative; z-index: 1; }
  .featured-tag {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    margin-bottom: 6px;

  .featured-title {

  @media (max-width: 750px) {
    header { padding: 12px 16px; gap: 12px; }

    .brand-logo img { width: 32px; height: 32px; }
    .brand-name { font-size: 14px; letter-spacing: 1.4px; }
    .brand-sub { font-size: 8.5px; letter-spacing: 2px; }
    .nav-links a { padding: 7px 10px; font-size: 12px; }

    .hero { margin-top: 18px; padding: 0 16px; }
    .hero-card { padding: 20px 18px; gap: 16px; border-radius: 16px; }
    .hero-logo { width: 60px; height: 60px; }
    .hero-logo img { width: 52px; height: 52px; border-radius: 14px; }
    .hero-text { min-width: 100%; text-align: left; }
    .hero-text h2 { font-size: 22px; }
    .hero-text p { font-size: 13px; }

    .search-bar { padding: 14px 16px 0; }
    .search-bar::before { left: 28px; }
    .search-bar input { padding: 12px 14px 12px 42px; font-size: 13px; }

    .view-toggle button { padding: 10px 10px; font-size: 12px; }

    .creator-avatar { width: 40px; height: 40px; }

</style>
</head>
<body>
<div class="app">

<header>
  <div class="brand-block">
    <div class="brand-logo">
      <img src="/editor/logo.png" alt="Limn" />
    </div>
    <div class="brand-text">
      <div class="brand-name">LIMN ARCADE</div>
      <div class="brand-sub">PLAY · CREATE · SHARE</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="https://limn-engine-doc.vercel.app/"><span>🏠 Home</span></a>
    <a href="/my-games.html"><span>📁 My Games</span></a>
    <a href="/arcade/leaderboard.html"><span>🏆 Leaderboard</span></a>
    <a href="/editor/"><span>+ New</span></a>
  </div>
</header>

<section class="hero">
  <div class="hero-card">
    <div class="hero-logo">
      <img src="/editor/logo.png" alt="Limn" />
    </div>
    <div class="hero-text">
      <h2>Play. Create. Share.</h2>
      <p>Discover games made by the Limn community — or build your own in minutes.</p>
    </div>
  </div>
</section>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search creators...">
</div>

<div class="view-toggle">
  <button id="viewCreators" data-view="creators">👥 Creators</button>
  <button id="viewProjects" data-view="projects">🎮 Projects</button>
</div>

<div class="featured-wrap" id="featuredWrap" style="display:none"></div>

<main id="grid"><div class="empty"><h2>Loading...</h2></div></main>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const CREATORS_PER_PAGE = 24;

let creators = [];
let allGames = [];
let visibleCreatorCount = CREATORS_PER_PAGE;
let currentFilter = '';
let profileMapGlobal = {};
let viewMode = localStorage.getItem('arcade_view') || 'creators';

async function boot() {
  const { data, error } = await supabase
    .from('games')
    .select('id, slug, title, author_id, author_name, config, created_at')
    .order('created_at', { ascending: false })
    .limit(500);

  if (error) {
    document.getElementById('grid').innerHTML =
      '<div class="empty"><h2>Failed to load.</h2></div>';
    return;
  }

  allGames = data || [];

  const userIds = [...new Set(allGames.map(g => g.author_id).filter(Boolean))];

  const profileMap = {};
  if (userIds.length > 0) {
    const { data: profiles } = await supabase
      .from('profiles')
      .select('user_id, username, display_name, avatar_url')
      .in('user_id', userIds);
    for (const p of profiles || []) profileMap[p.user_id] = p;
  }

  profileMapGlobal = profileMap;

  const likeCountMap = {};
  const gameIds = allGames.map(g => g.id);
  if (gameIds.length > 0) {
    const { data: likes } = await supabase
      .from('likes')
      .select('game_id')
      .in('game_id', gameIds);
    for (const l of likes || []) {
      likeCountMap[l.game_id] = (likeCountMap[l.game_id] || 0) + 1;
    }
  }

  const creatorMap = {};
  for (const g of allGames) {
    let key, profile;
    if (g.author_id && profileMap[g.author_id]) {
      key = g.author_id;
      profile = profileMap[g.author_id];
    } else {
      const nameKey = (g.author_name || 'anonymous').split('@')[0];
      key = 'anon:' + nameKey;
      profile = {
        username: nameKey,
        display_name: nameKey,
        avatar_url: null
      };
    }
    if (!creatorMap[key]) {
      creatorMap[key] = {
        user_id: g.author_id || null,
        username: profile.username || null,
        display_name: profile.display_name || null,
        avatar_url: profile.avatar_url || null,
        games: [],
        totalLikes: 0
      };
    }
    creatorMap[key].games.push(g);
    creatorMap[key].totalLikes += likeCountMap[g.id] || 0;
  }

  creators = Object.values(creatorMap)
    .filter(c => c.games.length > 0)
    .sort((a, b) => b.games.length - a.games.length);

  updateViewButtons();
  updateSearchPlaceholder();
  render();
  loadFeatured();
}

function matchesFilter(c) {
  if (!currentFilter) return true;
  const q = currentFilter.toLowerCase();
  const name = (c.username || '').toLowerCase();
  const display = (c.display_name || '').toLowerCase();
  return name.includes(q) || display.includes(q);
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (viewMode === 'projects') {
    renderProjects(grid);
  } else {
    renderCreators(grid);
  }
}

function renderProjects(grid) {
  const q = currentFilter.toLowerCase();

  const list = allGames.filter(g => {
    if (!q) return true;
    const profile = g.author_id ? profileMapGlobal[g.author_id] : null;
    const creatorName = profile && profile.username
      ? profile.username.toLowerCase()
      : (g.author_name || '').toLowerCase();
    return (g.title || '').toLowerCase().includes(q) || creatorName.includes(q);
  });

  if (list.length === 0) {
    const msg = currentFilter ? 'No projects match your search.' : 'No games yet.';
    grid.innerHTML = '<div class="empty"><h2>' + msg + '</h2>' +
      (currentFilter ? '' : '<a href="/editor/">Make the first one →</a>') +
      '</div>';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'projects-grid';

  list.forEach((g, i) => {
    const profile = g.author_id ? profileMapGlobal[g.author_id] : null;
    let creatorHtml;
    if (profile && profile.username) {
      creatorHtml = '@' + escapeHtml(profile.username);
    } else {
      creatorHtml = escapeHtml((g.author_name || 'anonymous').split('@')[0]);
    }

    const card = document.createElement('a');
    card.className = 'project-card';
    card.href = '/arcade/game.html?slug=' + encodeURIComponent(g.slug);
    card.style.animationDelay = (i * 0.03) + 's';
    card.innerHTML =
      '<div class="thumb-wrap">' + thumbSVG(g, false) + '</div>' +
      '<div class="p-info">' +
        '<h3>' + escapeHtml(g.title || 'Untitled') + '</h3>' +
        '<p>' + creatorHtml + '</p>' +
      '</div>';
    wrap.appendChild(card);
  });

  grid.appendChild(wrap);
}

function renderCreators(grid) {
  const filtered = creators.filter(matchesFilter);

  if (filtered.length === 0) {
    const msg = currentFilter ? 'No creators match your search.' : 'No games yet.';
    grid.innerHTML = '<div class="empty"><h2>' + msg + '</h2>' +
      (currentFilter ? '' : '<a href="/editor/">Make the first one →</a>') +
      '</div>';
    return;
  }

  const visible = filtered.slice(0, visibleCreatorCount);
  let html = '<div class="section-title">Creators</div>';

  visible.forEach((c, i) => {
    html += renderCreatorCard(c, i);
  });

  if (visibleCreatorCount < filtered.length) {
    const remaining = filtered.length - visibleCreatorCount;
    html += '<div class="load-more-wrap">' +
      '<button class="load-more-btn" id="loadMoreBtn"><span>See More (' + remaining + ')</span></button>' +
    '</div>';
  } else if (filtered.length > CREATORS_PER_PAGE) {
    html += '<div class="load-more-wrap">' +
      '<button class="load-more-btn secondary" id="loadLessBtn"><span>↑ See Less</span></button>' +
    '</div>';
  }

  grid.innerHTML = html;
  bindCardEvents();
}

function renderCreatorCard(c, idx) {
  const displayName = c.display_name || (c.username ? '@' + c.username : 'Creator');
  const username = c.username ? '@' + c.username : 'anonymous';
  const gameCount = c.games.length;
  const stat = gameCount + ' game' + (gameCount === 1 ? '' : 's') +
               ' · ♥ ' + c.totalLikes;

  const profileUrl = c.username ? '/u/?u=' + encodeURIComponent(c.username) : '#';

  let avatarHtml;
  if (c.avatar_url) {
    avatarHtml = '<img class="creator-avatar" src="' + escapeHtml(c.avatar_url) +
      '" alt="" onclick="window.location.href=\'' + profileUrl + '\'">';
  } else {
    const initial = (displayName || '?').trim().charAt(0).toUpperCase() || '?';
    avatarHtml = '<div class="creator-avatar fallback" onclick="window.location.href=\'' +
      profileUrl + '\'">' + escapeHtml(initial) + '</div>';
  }

  let html = '<div class="creator-card" data-user="' + (c.user_id || '') +
    '" style="animation-delay:' + (idx * 0.04) + 's">';

  html += '<div class="creator-head">';
  html += avatarHtml;
  html += '<div class="creator-info" onclick="window.location.href=\'' + profileUrl + '\'">';
  html += '<h3>' + escapeHtml(displayName) + '</h3>';
  html += '<p>' + escapeHtml(username) + ' · ' + stat + '</p>';
  html += '</div>';

  if (gameCount > 1) {
    html += '<button class="see-more-btn" data-action="toggle">See More ▾</button>';
  }

  html += '</div>';

  const openClass = gameCount > 1 ? 'creator-games' : 'creator-games always-open';
  let gamesHtml = '';
  for (const g of c.games) {
    gamesHtml += '<a class="game-tile" href="/arcade/game.html?slug=' +
      encodeURIComponent(g.slug) + '">' +
      thumbSVG(g, true) +
      '<div class="tile-name">' + escapeHtml(g.title) + '</div>' +
      '</a>';
  }
  html += '<div class="' + openClass + '">' + gamesHtml + '</div>';

  html += '</div>';
  return html;
}

function bindCardEvents() {
  document.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const card = btn.closest('.creator-card');
      if (!card) return;
      const isExpanded = card.classList.contains('expanded');
      if (isExpanded) {
        card.classList.remove('expanded');
        btn.textContent = 'See More ▾';
      } else {
        card.classList.add('expanded');
        btn.textContent = 'See Less ▴';
      }
    });
  });

  const moreBtn = document.getElementById('loadMoreBtn');
  if (moreBtn) {
    moreBtn.addEventListener('click', () => {
      visibleCreatorCount += CREATORS_PER_PAGE;
      render();
    });
  }

  const lessBtn = document.getElementById('loadLessBtn');
  if (lessBtn) {
    lessBtn.addEventListener('click', () => {
      visibleCreatorCount = CREATORS_PER_PAGE;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
}

function updateViewButtons() {
  document.querySelectorAll('.view-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === viewMode);
  });
}

function updateSearchPlaceholder() {
  document.getElementById('search').placeholder =
    viewMode === 'creators' ? 'Search creators...' : 'Search games or creators...';
}

document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.view;
    localStorage.setItem('arcade_view', viewMode);
    visibleCreatorCount = CREATORS_PER_PAGE;
    updateViewButtons();
    updateSearchPlaceholder();
    render();
  });
});

document.getElementById('search').addEventListener('input', (e) => {
  currentFilter = e.target.value.trim();
  if (viewMode === 'creators') {
    visibleCreatorCount = CREATORS_PER_PAGE;
  }
  render();
});

async function loadFeatured() {
  const now = new Date();
  const d = (now.getUTCDay() + 6) % 7;
  const weekStart = new Date(Date.UTC(now.getUTCFullYear(),
    now.getUTCMonth(), now.getUTCDate() - d, 0, 0, 0)).toISOString();

  const { data: weekLikes } = await supabase
    .from('likes')
    .select('game_id')
    .gte('created_at', weekStart);

  if (!weekLikes || weekLikes.length === 0) return;

  const counts = {};
  for (const l of weekLikes) counts[l.game_id] = (counts[l.game_id] || 0) + 1;

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (sorted.length === 0) return;

  const topId = sorted[0][0];
  const top = allGames.find(g => g.id === topId);
  if (!top) return;

  const wrap = document.getElementById('featuredWrap');
  wrap.style.display = 'block';
  wrap.innerHTML =
    '<div class="featured">' +
      '<div style="flex: 1; min-width: 160px;">' +
        '<div class="featured-tag"><span>🏆</span><span>Game of the Week</span></div>' +
        '<h2 class="featured-title">' + escapeHtml(top.title) + '</h2>' +
        '<p class="featured-sub">♥ ' + counts[topId] + '</p>' +
      '</div>' +
      '<a href="/arcade/game.html?slug=' + encodeURIComponent(top.slug) +
        '" class="featured-play">▶ Play</a>' +
    '</div>';
}

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function thumbSVG(game, small) {
  const w = 300;
  const h = small ? 187 : 225;
  const config = game.config || {};
  const world = config.world || { w: 800, h: 600, bg: '#0d0d2a' };
  const slots = config.slots || [];

  const h1 = hashString(String(game.id || game.slug || game.title || Math.random()));
  const h2 = hashString(String((game.slug || '') + 'b'));
  const h3 = hashString(String((game.title || '') + 'c'));

  const palettes = [
    ['#6ea8fe', '#a371f7', '#ec4899', '#fbbf24'],
    ['#4ade80', '#22d3ee', '#6ea8fe', '#a371f7'],
    ['#ec4899', '#f97316', '#fbbf24', '#4ade80'],
    ['#a371f7', '#6ea8fe', '#22d3ee', '#4ade80'],
    ['#fbbf24', '#ec4899', '#a371f7', '#6ea8fe'],
    ['#22d3ee', '#4ade80', '#fbbf24', '#ec4899']
  ];
  const picked = palettes[h1 % palettes.length];
  const bg1 = picked[0];
  const bg2 = picked[1];
  const accent1 = picked[2];
  const accent2 = picked[3];

  const uid = 'g' + h1.toString(36) + h2.toString(36).slice(0, 4);

  let art = '';
  const hasSlots = slots && slots.length > 0;

  if (hasSlots) {
    const sx = w / (world.w || 800);
    const sy = h / (world.h || 600);
    for (const s of slots) {
      const x = s.x * sx;
      const y = s.y * sy;
      const sw = Math.max(4, s.w * sx);
      const sh = Math.max(4, s.h * sy);
      const color = s.color || accent1;
      art += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
             '" width="' + sw.toFixed(1) + '" height="' + sh.toFixed(1) +
             '" fill="' + color + '" rx="2" opacity="0.95"/>';
    }
  } else {
    const style = h1 % 6;
    if (style === 0) {
      for (let i = 0; i < 6; i++) {
        const r = 20 + i * 22 + (h2 % 12);
        const op = 0.7 - i * 0.09;
        art += '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="' + r +
               '" fill="none" stroke="' + accent1 + '" stroke-width="2" opacity="' + op.toFixed(2) + '"/>';
      }
      art += '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="18" fill="' + accent2 + '"/>';
    } else if (style === 1) {
      for (let i = 0; i < 5; i++) {
        const y = 30 + i * 40;
        const ww = 60 + ((h2 >> i) % 120);
        art += '<rect x="' + ((w - ww) / 2) + '" y="' + y + '" width="' + ww +
               '" height="18" rx="9" fill="' + (i % 2 ? accent1 : accent2) +
               '" opacity="' + (0.85 - i * 0.1).toFixed(2) + '"/>';
      }
    } else if (style === 2) {
      const grid = 4;
      const cs = w / (grid + 1);
      for (let i = 0; i < grid; i++) {
        for (let j = 0; j < grid; j++) {
          const x = 20 + i * cs;
          const y = 20 + j * cs;
          const sz = cs * 0.6;
          const filled = ((h2 >> (i * grid + j)) & 1) === 1;
          art += '<rect x="' + x + '" y="' + y + '" width="' + sz + '" height="' + sz +
                 '" rx="6" fill="' + (filled ? accent1 : accent2) +
                 '" opacity="' + (filled ? 0.9 : 0.3) + '"/>';
        }
      }
    } else if (style === 3) {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + (h2 % 100) / 100;
        const r1 = 40;
        const r2 = 90 + ((h3 >> i) % 30);
        const x1 = w / 2 + Math.cos(a) * r1;
        const y1 = h / 2 + Math.sin(a) * r1;
        const x2 = w / 2 + Math.cos(a) * r2;
        const y2 = h / 2 + Math.sin(a) * r2;
        art += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
               '" stroke="' + (i % 2 ? accent1 : accent2) + '" stroke-width="6" stroke-linecap="round" opacity="0.85"/>';
      }
      art += '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="22" fill="' + accent2 + '"/>';
    } else if (style === 4) {
      const tri = 3 + (h2 % 4);
      for (let i = 0; i < tri; i++) {
        const cx = 40 + (i * (w - 80)) / Math.max(1, tri - 1);
        const size = 25 + ((h3 >> i) % 20);
        const cy = h / 2 + Math.sin(i * 1.7) * 30;
        art += '<polygon points="' + cx + ',' + (cy - size) + ' ' +
               (cx + size) + ',' + (cy + size) + ' ' +
               (cx - size) + ',' + (cy + size) + '" fill="' +
               (i % 2 ? accent1 : accent2) + '" opacity="0.9"/>';
      }
    } else {
      art += '<circle cx="' + (w * 0.3) + '" cy="' + (h * 0.5) + '" r="55" fill="' + accent1 + '" opacity="0.8"/>';
      art += '<circle cx="' + (w * 0.7) + '" cy="' + (h * 0.5) + '" r="55" fill="' + accent2 + '" opacity="0.8"/>';
      art += '<circle cx="' + (w * 0.5) + '" cy="' + (h * 0.5) + '" r="40" fill="' + bg1 + '" opacity="0.7"/>';
    }
  }

  const cls = small ? 'tile-thumb' : 'thumb';

  return '<svg class="' + cls + '" viewBox="0 0 ' + w + ' ' + h + '" ' +
    'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
      '<linearGradient id="bg' + uid + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="' + (world.bg || '#0d0d2a') + '"/>' +
        '<stop offset="100%" stop-color="' + bg1 + '" stop-opacity="0.35"/>' +
      '</linearGradient>' +
      '<radialGradient id="glow' + uid + '" cx="50%" cy="50%" r="60%">' +
        '<stop offset="0%" stop-color="' + accent1 + '" stop-opacity="0.35"/>' +
        '<stop offset="100%" stop-color="' + accent1 + '" stop-opacity="0"/>' +
      '</radialGradient>' +
    '</defs>' +
    '<rect width="' + w + '" height="' + h + '" fill="url(#bg' + uid + ')"/>' +
    '<rect width="' + w + '" height="' + h + '" fill="url(#glow' + uid + ')"/>' +
    art +
    '</svg>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

boot();
