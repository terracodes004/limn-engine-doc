<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade — Limn</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a14; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; }

  header { padding: 20px 32px; display: flex;
           justify-content: space-between; align-items: center;
           border-bottom: 1px solid rgba(255,255,255,0.12);
           gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
  .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-links a { color: #4af; text-decoration: none; font-weight: 600;
                 padding: 8px 16px; border-radius: 8px;
                 background: rgba(68,170,255,0.1);
                 border: 1px solid rgba(68,170,255,0.25);
                 font-size: 14px; }
  .nav-links a:hover { background: rgba(68,170,255,0.2); }

  .search-bar { padding: 16px 32px 0;
                max-width: 900px; margin: 0 auto; }
  .search-bar input { width: 100%; padding: 14px 18px;
                      background: #15152a;
                      border: 1px solid rgba(255,255,255,0.12);
                      border-radius: 10px; color: #fff;
                      font-size: 15px; font-family: inherit; }
  .search-bar input:focus { outline: none;
                            border-color: rgba(68,170,255,0.6);
                            box-shadow: 0 0 0 3px rgba(68,170,255,0.15); }

  .view-toggle {
    display: flex;
    gap: 6px;
    padding: 12px 32px 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .view-toggle button {
    flex: 1;
    padding: 10px 14px;
    background: #15152a;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: #888;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .view-toggle button:hover {
    background: #1a1a2e;
    color: #bbb;
  }
  .view-toggle button.active {
    background: rgba(68,170,255,0.15);
    border-color: rgba(68,170,255,0.5);
    color: #4af;
  }

  .featured-wrap { padding: 20px 32px 0;
                   max-width: 900px; margin: 0 auto; }

  main { padding: 24px 32px 32px;
         max-width: 900px; margin: 0 auto; }

  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.5;
    margin: 32px 0 12px;
    font-weight: 700;
  }
  .section-title:first-child { margin-top: 0; }

  .creator-card {
    background: linear-gradient(180deg, #15152a, #10101e);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .creator-card:hover { border-color: rgba(68,170,255,0.3); }
  .creator-card.expanded { border-color: rgba(68,170,255,0.5); }

  .creator-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .creator-head:hover { background: rgba(255,255,255,0.02); }

  .creator-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    background: #202040;
    border: 2px solid rgba(68,170,255,0.3);
    flex-shrink: 0;
  }

  .creator-info { flex: 1; min-width: 0; }
  .creator-info h3 {
    margin: 0 0 2px;
    font-size: 16px;
    font-weight: 700;
    color: #fbbf24;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .creator-info p {
    margin: 0;
    font-size: 12px;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .see-more-btn {
    padding: 8px 16px;
    border: 1px solid rgba(68,170,255,0.4);
    background: rgba(68,170,255,0.08);
    color: #4af;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .see-more-btn:hover {
    background: rgba(68,170,255,0.18);
    border-color: rgba(68,170,255,0.7);
  }

  .creator-games {
    display: none;
    padding: 4px 18px 18px;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 0;
  }
  .creator-card.expanded .creator-games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    padding-top: 16px;
  }
  .creator-games.always-open {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    padding-top: 16px;
  }

  .game-tile {
    background: #0a0a18;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s, border-color 0.15s;
  }
  .game-tile:hover {
    transform: translateY(-2px);
    border-color: rgba(68,170,255,0.5);
  }
  .game-tile .tile-thumb {
    width: 100%;
    aspect-ratio: 16/10;
    display: block;
  }
  .game-tile .tile-name {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Flat projects grid */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    margin-top: 12px;
  }
  .project-card {
    background: linear-gradient(180deg,#15152a,#10101e);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .project-card:hover {
    transform: translateY(-2px);
    border-color: rgba(68,170,255,0.6);
    box-shadow: 0 8px 24px rgba(68,170,255,0.15);
  }
  .project-card .thumb {
    width: 100%;
    aspect-ratio: 4/3;
    display: block;
  }
  .project-card .p-info { padding: 10px 12px; }
  .project-card .p-info h3 {
    margin: 0 0 3px;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .project-card .p-info p {
    margin: 0;
    font-size: 12px;
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .project-card .p-info a {
    color: #fbbf24;
    text-decoration: none;
    font-weight: 600;
  }
  .project-card .p-info a:hover {
    text-decoration: underline;
  }

  .load-more-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 0 12px;
  }
  .load-more-btn {
    padding: 12px 28px;
    background: linear-gradient(135deg, #4af, #7c3aed);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(68,170,255,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .load-more-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(68,170,255,0.5);
  }
  .load-more-btn.secondary {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: none;
    font-weight: 600;
  }
  .load-more-btn.secondary:hover {
    background: rgba(255,255,255,0.05);
    box-shadow: none;
  }

  .empty { text-align: center; padding: 60px 20px; opacity: 0.5; }
  .empty a { color: #4af; text-decoration: none; font-weight: 600; }

  .featured {
    border-radius: 14px;
    padding: 22px;
    display: flex; align-items: center; gap: 18px;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg,
      #ec4899 0%, #f97316 25%, #facc15 50%, #22d3ee 75%, #6366f1 100%);
    box-shadow: 0 8px 30px rgba(236,72,153,0.25),
                0 3px 12px rgba(34,211,238,0.15);
  }
  .featured::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.35) 100%);
    pointer-events: none;
  }
  .featured > * { position: relative; z-index: 1; }
  .featured-tag {
    font-size: 11px; font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .featured-title {
    margin: 0 0 6px; font-size: 22px;
    letter-spacing: -0.5px;
    color: #ffffff;
    font-weight: 900;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    line-height: 1.1;
  }
  .featured-sub {
    margin: 0; font-size: 13px;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .featured-sub a {
    color: #ffffff;
    text-decoration: none;
    font-weight: 800;
    border-bottom: 2px solid rgba(255,255,255,0.6);
    padding-bottom: 1px;
  }
  .featured-play {
    padding: 12px 24px;
    background: #0a0a14;
    color: #ffffff;
    border-radius: 10px;
    font-weight: 800;
    text-decoration: none;
    font-size: 14px;
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: transform 0.15s, background 0.15s;
  }
  .featured-play:hover { transform: scale(1.05); background: #1a1a2e; }

  @media (max-width: 750px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 18px; }
    .nav-links a { padding: 6px 12px; font-size: 12px; }
    .search-bar { padding: 12px 16px 0; }
    .search-bar input { padding: 11px 14px; font-size: 14px; }
    .view-toggle { padding: 10px 16px 0; }
    .view-toggle button { padding: 9px 12px; font-size: 13px; }
    .featured-wrap { padding: 12px 16px 0; }
    main { padding: 16px; }

    .creator-head { padding: 12px 14px; gap: 10px; }
    .creator-avatar { width: 44px; height: 44px; }
    .creator-info h3 { font-size: 14px; }
    .creator-info p { font-size: 11px; }
    .see-more-btn { padding: 6px 12px; font-size: 11px; }

    .creator-games {
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
      padding: 12px 14px 14px;
    }
    .creator-games.always-open {
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
      padding: 12px 14px 14px;
    }
    .game-tile .tile-name { font-size: 10px; padding: 6px 8px; }

    .projects-grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .project-card .p-info h3 { font-size: 13px; }
    .project-card .p-info p { font-size: 11px; }

    .featured { padding: 16px; gap: 12px; }
    .featured-title { font-size: 18px; }
    .featured-sub { font-size: 12px; }
    .featured-play { padding: 10px 18px; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <h1>Arcade</h1>
  <div class="nav-links">
    <a href="https://limn-engine-doc.vercel.app/">🏠 Home</a>
    <a href="/my-games.html">📁 My Games</a>
    <a href="/arcade/leaderboard.html">🏆 Leaderboard</a>
    <a href="/editor/">+ Make a game</a>
  </div>
</header>
<div class="search-bar">
  <input type="text" id="search" placeholder="Search creators...">
</div>

<div class="view-toggle">
  <button id="viewCreators" data-view="creators">👥 Creators</button>
  <button id="viewProjects" data-view="projects">🎮 Projects</button>
</div>

<div class="featured-wrap" id="featuredWrap" style="display:none"></div>

<main id="grid"><div class="empty"><h2>Loading...</h2></div></main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const CREATORS_PER_PAGE = 24;

let creators = [];
let anonymousGames = [];
let allGames = [];
let visibleCreatorCount = CREATORS_PER_PAGE;
let currentFilter = '';
let profileMapGlobal = {};
let viewMode = localStorage.getItem('arcade_view') || 'creators';

async function boot() {
  const { data, error } = await supabase
    .from('games')
    .select('id, slug, title, author_id, author_name, config')
    .order('created_at', { ascending: false })
    .limit(500);

  if (error) {
    document.getElementById('grid').innerHTML =
      '<div class="empty"><h2>Failed to load.</h2></div>';
    return;
  }

  allGames = data || [];

  const userIds = [...new Set(allGames.map(g => g.author_id).filter(Boolean))];

  const profileMap = {};
  if (userIds.length > 0) {
    const { data: profiles } = await supabase
      .from('profiles')
      .select('user_id, username, display_name, avatar_url')
      .in('user_id', userIds);
    for (const p of profiles || []) profileMap[p.user_id] = p;
  }

  profileMapGlobal = profileMap;

  const likeCountMap = {};
  const gameIds = allGames.map(g => g.id);
  if (gameIds.length > 0) {
    const { data: likes } = await supabase
      .from('likes')
      .select('game_id')
      .in('game_id', gameIds);
    for (const l of likes || []) {
      likeCountMap[l.game_id] = (likeCountMap[l.game_id] || 0) + 1;
    }
  }

  const creatorMap = {};
  const anonymous = [];

  for (const g of allGames) {
    if (g.author_id && profileMap[g.author_id]) {
      const p = profileMap[g.author_id];
      if (!creatorMap[g.author_id]) {
        creatorMap[g.author_id] = {
          user_id: g.author_id,
          username: p.username || null,
          display_name: p.display_name || null,
          avatar_url: p.avatar_url || null,
          games: [],
          totalLikes: 0
        };
      }
      creatorMap[g.author_id].games.push(g);
      creatorMap[g.author_id].totalLikes += likeCountMap[g.id] || 0;
    } else {
      anonymous.push(g);
    }
  }

  creators = Object.values(creatorMap)
    .filter(c => c.games.length > 0)
    .sort((a, b) => b.games.length - a.games.length);

  anonymousGames = anonymous;

  updateViewButtons();
  updateSearchPlaceholder();
  render();
  loadFeatured();
}

function matchesFilter(c) {
  if (!currentFilter) return true;
  const q = currentFilter.toLowerCase();
  const name = (c.username || '').toLowerCase();
  const display = (c.display_name || '').toLowerCase();
  return name.includes(q) || display.includes(q);
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (viewMode === 'projects') {
    renderProjects(grid);
  } else {
    renderCreators(grid);
  }
}

function renderProjects(grid) {
  const q = currentFilter.toLowerCase();

  const list = allGames.filter(g => {
    if (!q) return true;
    const profile = g.author_id ? profileMapGlobal[g.author_id] : null;
    const creatorName = profile && profile.username
      ? profile.username.toLowerCase()
      : (g.author_name || '').toLowerCase();
    return (g.title || '').toLowerCase().includes(q) || creatorName.includes(q);
  });

  if (list.length === 0) {
    const msg = currentFilter ? 'No projects match your search.' : 'No games yet.';
    grid.innerHTML = '<div class="empty"><h2>' + msg + '</h2>' +
      (currentFilter ? '' : '<p><a href="/editor/">Make the first one →</a></p>') +
      '</div>';
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'projects-grid';
  wrap.style.marginTop = '20px';

  for (const g of list) {
    const profile = g.author_id ? profileMapGlobal[g.author_id] : null;
    let creatorHtml;
    if (profile && profile.username) {
      creatorHtml = '<a href="/u/?u=' + encodeURIComponent(profile.username) + '">@' +
                    escapeHtml(profile.username) + '</a>';
    } else {
      const name = (g.author_name || 'anonymous').split('@')[0];
      creatorHtml = escapeHtml(name);
    }

    wrap.insertAdjacentHTML('beforeend',
      '<a class="project-card" href="/arcade/game.html?slug=' +
        encodeURIComponent(g.slug) + '">' +
        thumbSVG(g.config, true) +
        '<div class="p-info">' +
          '<h3>' + escapeHtml(g.title || 'Untitled') + '</h3>' +
          '<p>by ' + creatorHtml + '</p>' +
        '</div>' +
      '</a>');
  }

  grid.appendChild(wrap);
}

function renderCreators(grid) {
  const filtered = creators.filter(matchesFilter);

  if (filtered.length === 0) {
    const msg = currentFilter ? 'No creators match your search.' : 'No games yet.';
    grid.innerHTML = '<div class="empty"><h2>' + msg + '</h2>' +
      (currentFilter ? '' : '<p><a href="/editor/">Make the first one →</a></p>') +
      '</div>';
    return;
  }

  const visible = filtered.slice(0, visibleCreatorCount);
  let html = '<div class="section-title">Creators</div>';

  for (const c of visible) {
    html += renderCreatorCard(c);
  }

  if (visibleCreatorCount < filtered.length) {
    const remaining = filtered.length - visibleCreatorCount;
    html += '<div class="load-more-wrap">' +
      '<button class="load-more-btn" id="loadMoreBtn">' +
        'See More Creators (' + remaining + ' remaining)' +
      '</button>' +
    '</div>';
  } else if (filtered.length > CREATORS_PER_PAGE) {
    html += '<div class="load-more-wrap">' +
      '<button class="load-more-btn secondary" id="loadLessBtn">' +
        '↑ See Less' +
      '</button>' +
    '</div>';
  }

  grid.innerHTML = html;
  bindCardEvents();
}

function renderCreatorCard(c) {
  const displayName = c.display_name || (c.username ? '@' + c.username : 'Creator');
  const username = c.username ? '@' + c.username : 'anonymous';
  const avatar = c.avatar_url || 'https://via.placeholder.com/60';
  const gameCount = c.games.length;
  const stat = gameCount + ' game' + (gameCount === 1 ? '' : 's') +
               ' · ♥ ' + c.totalLikes;

  const profileUrl = c.username ? '/u/?u=' + encodeURIComponent(c.username) : '#';

  let html = '<div class="creator-card" data-user="' + c.user_id + '">';

  html += '<div class="creator-head">';
  html += '<img class="creator-avatar" src="' + escapeHtml(avatar) + '" alt="" ' +
          'onclick="window.location.href=\'' + profileUrl + '\'" ' +
          'style="cursor:pointer">';
  html += '<div class="creator-info" onclick="window.location.href=\'' + profileUrl + '\'">';
  html += '<h3>' + escapeHtml(displayName) + '</h3>';
  html += '<p>' + escapeHtml(username) + ' · ' + stat + '</p>';
  html += '</div>';

  if (gameCount > 1) {
    html += '<button class="see-more-btn" data-action="toggle">See More ▾</button>';
  }

  html += '</div>';

  const openClass = gameCount > 1 ? 'creator-games' : 'creator-games always-open';
  let gamesHtml = '';
  for (const g of c.games) {
    gamesHtml += '<a class="game-tile" href="/arcade/game.html?slug=' +
      encodeURIComponent(g.slug) + '">' +
      thumbSVG(g.config, true) +
      '<div class="tile-name">' + escapeHtml(g.title) + '</div>' +
      '</a>';
  }
  html += '<div class="' + openClass + '">' + gamesHtml + '</div>';

  html += '</div>';
  return html;
}

function bindCardEvents() {
  document.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const card = btn.closest('.creator-card');
      if (!card) return;
      const isExpanded = card.classList.contains('expanded');
      if (isExpanded) {
        card.classList.remove('expanded');
        btn.textContent = 'See More ▾';
      } else {
        card.classList.add('expanded');
        btn.textContent = 'See Less ▴';
      }
    });
  });

  const moreBtn = document.getElementById('loadMoreBtn');
  if (moreBtn) {
    moreBtn.addEventListener('click', () => {
      visibleCreatorCount += CREATORS_PER_PAGE;
      render();
    });
  }

  const lessBtn = document.getElementById('loadLessBtn');
  if (lessBtn) {
    lessBtn.addEventListener('click', () => {
      visibleCreatorCount = CREATORS_PER_PAGE;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
}

function updateViewButtons() {
  document.querySelectorAll('.view-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === viewMode);
  });
}

function updateSearchPlaceholder() {
  document.getElementById('search').placeholder =
    viewMode === 'creators' ? 'Search creators...' : 'Search games or creators...';
}

document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.view;
    localStorage.setItem('arcade_view', viewMode);
    visibleCreatorCount = CREATORS_PER_PAGE;
    updateViewButtons();
    updateSearchPlaceholder();
    render();
  });
});

document.getElementById('search').addEventListener('input', (e) => {
  currentFilter = e.target.value.trim();
  if (viewMode === 'creators') {
    visibleCreatorCount = CREATORS_PER_PAGE;
  }
  render();
});

async function loadFeatured() {
  const now = new Date();
  const d = (now.getUTCDay() + 6) % 7;
  const weekStart = new Date(Date.UTC(now.getUTCFullYear(),
    now.getUTCMonth(), now.getUTCDate() - d, 0, 0, 0)).toISOString();

  const { data: weekLikes } = await supabase
    .from('likes')
    .select('game_id')
    .gte('created_at', weekStart);

  if (!weekLikes || weekLikes.length === 0) return;

  const counts = {};
  for (const l of weekLikes) counts[l.game_id] = (counts[l.game_id] || 0) + 1;

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (sorted.length === 0) return;

  const topId = sorted[0][0];
  const top = allGames.find(g => g.id === topId);
  if (!top) return;

  const wrap = document.getElementById('featuredWrap');
  wrap.style.display = 'block';
  wrap.innerHTML =
    '<div class="featured">' +
      '<div style="flex: 1; min-width: 180px;">' +
        '<div class="featured-tag"><span>🏆</span><span>Game of the Week</span></div>' +
        '<h2 class="featured-title">' + escapeHtml(top.title) + '</h2>' +
        '<p class="featured-sub">♥ ' + counts[topId] + '</p>' +
      '</div>' +
      '<a href="/arcade/game.html?slug=' + encodeURIComponent(top.slug) +
        '" class="featured-play">▶ Play Now</a>' +
    '</div>';
}

function thumbSVG(config, small) {
  const w = 300, h = small ? 187 : 225;
  const world = (config && config.world) || { w: 800, h: 600, bg: '#0d0d2a' };
  const slots = (config && config.slots) || [];
  const sx = w / world.w, sy = h / world.h;
  let rects = '';
  for (const s of slots) {
    rects += '<rect x="' + (s.x*sx) + '" y="' + (s.y*sy) +
             '" width="' + (s.w*sx) + '" height="' + (s.h*sy) +
             '" fill="' + (s.color||'#4af') + '" />';
  }
  if (!rects) {
    rects = '<text x="' + (w/2) + '" y="' + (h/2) +
            '" text-anchor="middle" fill="#4af" font-size="40">▶</text>';
  }
  const cls = small ? 'tile-thumb' : 'thumb';
  return '<svg class="' + cls + '" viewBox="0 0 ' + w + ' ' + h +
    '" preserveAspectRatio="xMidYMid slice" style="background:' +
    (world.bg||'#0d0d2a') + '">' + rects + '</svg>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

boot();
