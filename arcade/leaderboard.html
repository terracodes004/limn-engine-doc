<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard — Arcade</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a14; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; }
  header { padding: 24px 32px;
           border-bottom: 1px solid rgba(255,255,255,0.06); }
  header h1 { margin: 0 0 4px; font-size: 24px;
              letter-spacing: -0.5px; }
  header p { margin: 0; opacity: 0.55; font-size: 14px; }
  main { padding: 32px; max-width: 800px; margin: 0 auto; }

  h2 { font-size: 13px; text-transform: uppercase;
       letter-spacing: 1.5px; opacity: 0.55;
       margin: 40px 0 16px; font-weight: 700; }
  h2:first-of-type { margin-top: 8px; }

  .banner {
    display: block;
    padding: 22px 26px;
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .banner:hover { transform: translateY(-2px); }

  .banner-1 {
    background: linear-gradient(135deg, #7c2d12 0%, #b45309 45%, #f59e0b 100%);
    box-shadow: 0 8px 32px rgba(245, 158, 11, 0.25);
  }
  .banner-2 {
    background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #64748b 100%);
    box-shadow: 0 6px 24px rgba(148, 163, 184, 0.18);
  }
  .banner-3 {
    background: linear-gradient(135deg, #4a2a1a 0%, #7c4a2c 50%, #c68a5a 100%);
    box-shadow: 0 6px 24px rgba(198, 138, 90, 0.2);
  }
  .banner-4 {
    background: linear-gradient(135deg, #131a2a 0%, #1e2740 50%, #2e3a55 100%);
    box-shadow: 0 4px 18px rgba(46, 58, 85, 0.25);
  }
  .banner-5 {
    background: linear-gradient(135deg, #101625 0%, #1a2235 50%, #28324a 100%);
    box-shadow: 0 4px 16px rgba(40, 50, 74, 0.2);
  }
  .banner-6 {
    background: linear-gradient(135deg, #0d1220 0%, #151c2e 50%, #1f283e 100%);
    box-shadow: 0 3px 14px rgba(31, 40, 62, 0.18);
  }

  .banner-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .banner-tag {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.9;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  .banner-trophy { font-size: 32px; line-height: 1; }
  .banner-4 .banner-trophy,
  .banner-5 .banner-trophy,
  .banner-6 .banner-trophy { font-size: 22px; }

  .banner-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 6px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .banner-4 .banner-title,
  .banner-5 .banner-title,
  .banner-6 .banner-title { font-size: 18px; }

  .banner-sub {
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 12px;
    color: #ffffff;
  }
  .banner-sub a {
    color: inherit;
    text-decoration: none;
    font-weight: 700;
    border-bottom: 1px dashed currentColor;
  }
  .banner-sub a:hover { border-bottom-style: solid; }

  .banner-stats {
    display: flex;
    gap: 16px;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
  }

  .empty { text-align: center; padding: 60px 20px;
           opacity: 0.4; }
</style>
</head>
<body>

<header>
  <h1>Leaderboard</h1>
  <p id="weekLabel">This week</p>
</header>

<main>
  <h2>Top Games</h2>
  <div id="games"><div class="empty">Loading...</div></div>

  <h2>Top Creators</h2>
  <div id="creators"><div class="empty">Loading...</div></div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const now = new Date();
const dayOfWeek = now.getUTCDay();
const diffToMonday = (dayOfWeek + 6) % 7;
const monday = new Date(Date.UTC(now.getUTCFullYear(),
  now.getUTCMonth(), now.getUTCDate() - diffToMonday, 0, 0, 0));
const sunday = new Date(monday);
sunday.setUTCDate(monday.getUTCDate() + 7);

document.getElementById('weekLabel').textContent =
  monday.toLocaleDateString('en', { month: 'short', day: 'numeric' }) +
  ' – ' +
  sunday.toLocaleDateString('en', { month: 'short', day: 'numeric' });

const since = monday.toISOString();

const { data: likes } = await supabase
  .from('likes')
  .select('game_id, created_at')
  .gte('created_at', since);

const { data: games } = await supabase
  .from('games')
  .select('id, slug, title, author_id, author_name');

const gameMap = {};
if (games) for (const g of games) gameMap[g.id] = g;

const authorIds = [...new Set((games || []).map(g => g.author_id).filter(Boolean))];
const profileMap = {};
if (authorIds.length > 0) {
  const { data: profiles } = await supabase
    .from('profiles')
    .select('user_id, username, display_name')
    .in('user_id', authorIds);
  for (const p of profiles || []) profileMap[p.user_id] = p;
}

function creatorLabel(game) {
  if (!game) return 'anonymous';
  const profile = profileMap[game.author_id];
  if (profile && profile.username) return '@' + profile.username;
  if (profile && profile.display_name) return profile.display_name;
  if (game.author_name) return game.author_name.split('@')[0];
  return 'anonymous';
}

function creatorLink(game) {
  if (!game) return 'anonymous';
  const profile = profileMap[game.author_id];
  if (profile && profile.username) {
    return '<a href="/u/?u=' + encodeURIComponent(profile.username) + '">@' +
      esc(profile.username) + '</a>';
  }
  return esc(creatorLabel(game));
}

const gameCounts = {};
if (likes) for (const l of likes) {
  gameCounts[l.game_id] = (gameCounts[l.game_id] || 0) + 1;
}

const rankedGames = Object.entries(gameCounts)
  .map(([id, count]) => ({ game: gameMap[id], count }))
  .filter(x => x.game)
  .sort((a, b) => b.count - a.count);

const creatorCounts = {};
const creatorUsernames = {};
if (likes) for (const l of likes) {
  const g = gameMap[l.game_id];
  if (!g) continue;
  const label = creatorLabel(g);
  creatorCounts[label] = (creatorCounts[label] || 0) + 1;

  const profile = profileMap[g.author_id];
  if (profile && profile.username) {
    creatorUsernames[label] = profile.username;
  }
}

const rankedCreators = Object.entries(creatorCounts)
  .map(([name, count]) => ({ name, count, username: creatorUsernames[name] || null }))
  .sort((a, b) => b.count - a.count);

const rankMeta = [
  { cls: 'banner-1', tag: '🏆 1st Place · Game of the Week', trophy: '🏆' },
  { cls: 'banner-2', tag: '🥈 2nd Place',                     trophy: '🥈' },
  { cls: 'banner-3', tag: '🥉 3rd Place',                     trophy: '🥉' },
  { cls: 'banner-4', tag: '4th Place',                        trophy: '4️⃣' },
  { cls: 'banner-5', tag: '5th Place',                        trophy: '5️⃣' },
  { cls: 'banner-6', tag: '6th Place',                        trophy: '6️⃣' }
];

const gamesEl = document.getElementById('games');

if (rankedGames.length === 0) {
  gamesEl.innerHTML = '<div class="empty">No likes yet this week.</div>';
} else {
  const top = rankedGames.slice(0, 6);

  gamesEl.innerHTML = top.map((x, i) => {
    const meta = rankMeta[i] || { cls: 'banner-6', tag: (i + 1) + 'th Place', trophy: String(i + 1) };
    return `
      <a class="banner ${meta.cls}" href="/arcade/game.html?slug=${encodeURIComponent(x.game.slug)}">
        <div class="banner-head">
          <span class="banner-tag">${meta.tag}</span>
          <span class="banner-trophy">${meta.trophy}</span>
        </div>
        <h3 class="banner-title">${esc(x.game.title)}</h3>
        <div class="banner-sub">by ${creatorLink(x.game)}</div>
        <div class="banner-stats">
          <span>♥ ${x.count}</span>
        </div>
      </a>
    `;
  }).join('');
}

const creatorsEl = document.getElementById('creators');

if (rankedCreators.length === 0) {
  creatorsEl.innerHTML = '<div class="empty">No creators yet this week.</div>';
} else {
  const top = rankedCreators.slice(0, 6);

  creatorsEl.innerHTML = top.map((x, i) => {
    const meta = rankMeta[i] || { cls: 'banner-6', tag: (i + 1) + 'th Place', trophy: String(i + 1) };
    const nameHtml = x.username
      ? '<a href="/u/?u=' + encodeURIComponent(x.username) +
        '" style="color:inherit;text-decoration:none">' + esc(x.name) + '</a>'
      : esc(x.name);
    const tagText = i === 0 ? '🏆 1st Place · Creator of the Week' : meta.tag;
    return `
      <div class="banner ${meta.cls}" style="cursor:default">
        <div class="banner-head">
          <span class="banner-tag">${tagText}</span>
          <span class="banner-trophy">${meta.trophy}</span>
        </div>
        <h3 class="banner-title">${nameHtml}</h3>
        <div class="banner-stats">
          <span>♥ ${x.count}</span>
        </div>
      </div>
    `;
  }).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
</script>

</body>
   </html>
