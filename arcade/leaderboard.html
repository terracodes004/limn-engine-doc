<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard — Arcade</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a14; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; }
  header { padding: 24px 32px;
           border-bottom: 1px solid rgba(255,255,255,0.06); }
  header h1 { margin: 0 0 4px; font-size: 24px;
              letter-spacing: -0.5px; }
  header p { margin: 0; opacity: 0.55; font-size: 14px; }
  main { padding: 32px; max-width: 800px; margin: 0 auto; }

  h2 { font-size: 13px; text-transform: uppercase;
       letter-spacing: 1.5px; opacity: 0.55;
       margin: 40px 0 16px; font-weight: 700; }
  h2:first-of-type { margin-top: 8px; }

  .banner {
    display: block;
    padding: 24px 28px;
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .banner:hover { transform: translateY(-2px); }
  .banner-1 {
    background: linear-gradient(135deg, #7c2d12 0%, #b45309 45%, #f59e0b 100%);
    box-shadow: 0 8px 32px rgba(245, 158, 11, 0.25);
  }
  .banner-2 {
    background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #64748b 100%);
    box-shadow: 0 6px 24px rgba(148, 163, 184, 0.18);
  }

  .banner-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .banner-tag {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .banner-1 .banner-tag { color: #fef3c7; }
  .banner-2 .banner-tag { color: #e2e8f0; }

  .banner-trophy { font-size: 32px; line-height: 1; }

  .banner-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 8px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .banner-sub {
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 14px;
  }
  .banner-sub a {
    color: inherit;
    text-decoration: none;
    font-weight: 700;
    border-bottom: 1px dashed currentColor;
  }
  .banner-sub a:hover { border-bottom-style: solid; }

  .banner-stats {
    display: flex;
    gap: 16px;
    font-size: 14px;
    font-weight: 700;
  }
  .banner-stats span { display: inline-flex; align-items: center; gap: 4px; }
  .banner-1 .banner-stats { color: #fef3c7; }
  .banner-2 .banner-stats { color: #e2e8f0; }

  .row { display: flex; align-items: center; gap: 16px;
         padding: 14px 16px;
         background: linear-gradient(180deg,#15152a,#10101e);
         border: 1px solid rgba(255,255,255,0.06);
         border-radius: 10px; margin-bottom: 8px;
         text-decoration: none; color: inherit;
         transition: border-color 0.15s; }
  .row:hover { border-color: rgba(68,170,255,0.4); }

  .rank { font-size: 20px; font-weight: 800;
          width: 36px; text-align: center; flex-shrink: 0; }
  .rank.num { color: #64748b; font-size: 16px; }

  .info { flex: 1; min-width: 0; }
  .info .name { font-size: 15px; font-weight: 600;
                white-space: nowrap; overflow: hidden;
                text-overflow: ellipsis; }
  .info .name a { color: inherit; text-decoration: none; }
  .info .name a:hover { color: #fbbf24; text-decoration: underline; }
  .info .sub { font-size: 12px; opacity: 0.65;
               margin-top: 2px; }
  .info .sub a {
    color: #fbbf24;
    text-decoration: none;
    font-weight: 600;
  }
  .info .sub a:hover { color: #fde68a; text-decoration: underline; }

  .count { font-size: 16px; font-weight: 700;
           color: #f43f5e; flex-shrink: 0;
           display: inline-flex; align-items: center; gap: 4px; }

  .empty { text-align: center; padding: 60px 20px;
           opacity: 0.4; }
</style>
</head>
<body>

<header>
  <h1>Leaderboard</h1>
  <p id="weekLabel">This week</p>
</header>

<main>
  <h2>Top Games</h2>
  <div id="games"><div class="empty">Loading...</div></div>

  <h2>Top Creators</h2>
  <div id="creators"><div class="empty">Loading...</div></div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const now = new Date();
const dayOfWeek = now.getUTCDay();
const diffToMonday = (dayOfWeek + 6) % 7;
const monday = new Date(Date.UTC(now.getUTCFullYear(),
  now.getUTCMonth(), now.getUTCDate() - diffToMonday, 0, 0, 0));
const sunday = new Date(monday);
sunday.setUTCDate(monday.getUTCDate() + 7);

document.getElementById('weekLabel').textContent =
  monday.toLocaleDateString('en', { month: 'short', day: 'numeric' }) +
  ' – ' +
  sunday.toLocaleDateString('en', { month: 'short', day: 'numeric' });

const since = monday.toISOString();

const { data: likes } = await supabase
  .from('likes')
  .select('game_id, created_at')
  .gte('created_at', since);

const { data: games } = await supabase
  .from('games')
  .select('id, slug, title, author_id, author_name');

const gameMap = {};
if (games) for (const g of games) gameMap[g.id] = g;

const authorIds = [...new Set((games || []).map(g => g.author_id).filter(Boolean))];
const profileMap = {};
if (authorIds.length > 0) {
  const { data: profiles } = await supabase
    .from('profiles')
    .select('user_id, username, display_name')
    .in('user_id', authorIds);
  for (const p of profiles || []) profileMap[p.user_id] = p;
}

function creatorLabel(game) {
  if (!game) return 'anonymous';
  const profile = profileMap[game.author_id];
  if (profile && profile.username) return '@' + profile.username;
  if (profile && profile.display_name) return profile.display_name;
  if (game.author_name) return game.author_name.split('@')[0];
  return 'anonymous';
}

function creatorLink(game) {
  if (!game) return 'anonymous';
  const profile = profileMap[game.author_id];
  if (profile && profile.username) {
    return '<a href="/u/?u=' + encodeURIComponent(profile.username) + '">@' +
      esc(profile.username) + '</a>';
  }
  return esc(creatorLabel(game));
}

const gameCounts = {};
if (likes) for (const l of likes) {
  gameCounts[l.game_id] = (gameCounts[l.game_id] || 0) + 1;
}

const rankedGames = Object.entries(gameCounts)
  .map(([id, count]) => ({ game: gameMap[id], count }))
  .filter(x => x.game)
  .sort((a, b) => b.count - a.count);

const creatorCounts = {};
const creatorUsernames = {};
if (likes) for (const l of likes) {
  const g = gameMap[l.game_id];
  if (!g) continue;
  const label = creatorLabel(g);
  creatorCounts[label] = (creatorCounts[label] || 0) + 1;

  const profile = profileMap[g.author_id];
  if (profile && profile.username) {
    creatorUsernames[label] = profile.username;
  }
}

const rankedCreators = Object.entries(creatorCounts)
  .map(([name, count]) => ({ name, count, username: creatorUsernames[name] || null }))
  .sort((a, b) => b.count - a.count);

const gamesEl = document.getElementById('games');

if (rankedGames.length === 0) {
  gamesEl.innerHTML = '<div class="empty">No likes yet this week.</div>';
} else {
  const top1 = rankedGames[0];
  const top2 = rankedGames[1];
  const rest = rankedGames.slice(2, 10);

  let html = '';

  html += `
    <a class="banner banner-1" href="/arcade/game.html?slug=${encodeURIComponent(top1.game.slug)}">
      <div class="banner-head">
        <span class="banner-tag">🏆 1st Place · Game of the Week</span>
        <span class="banner-trophy">🏆</span>
      </div>
      <h3 class="banner-title">${esc(top1.game.title)}</h3>
      <div class="banner-sub">by ${creatorLink(top1.game)}</div>
      <div class="banner-stats">
        <span>♥ ${top1.count}</span>
      </div>
    </a>
  `;

  if (top2) {
    html += `
      <a class="banner banner-2" href="/arcade/game.html?slug=${encodeURIComponent(top2.game.slug)}">
        <div class="banner-head">
          <span class="banner-tag">🥈 2nd Place</span>
          <span class="banner-trophy">🥈</span>
        </div>
        <h3 class="banner-title">${esc(top2.game.title)}</h3>
        <div class="banner-sub">by ${creatorLink(top2.game)}</div>
        <div class="banner-stats">
          <span>♥ ${top2.count}</span>
        </div>
      </a>
    `;
  }

  html += rest.map((x, i) => {
    const rank = i + 3;
    const trophy = rank === 3 ? '🥉' : null;
    const rankHtml = trophy
      ? `<div class="rank">${trophy}</div>`
      : `<div class="rank num">${rank}</div>`;
    return `<a class="row" href="/arcade/game.html?slug=${encodeURIComponent(x.game.slug)}">
      ${rankHtml}
      <div class="info">
        <div class="name">${esc(x.game.title)}</div>
        <div class="sub">by ${creatorLink(x.game)}</div>
      </div>
      <div class="count">♥ ${x.count}</div>
    </a>`;
  }).join('');

  gamesEl.innerHTML = html;
}

const creatorsEl = document.getElementById('creators');

if (rankedCreators.length === 0) {
  creatorsEl.innerHTML = '<div class="empty">No creators yet this week.</div>';
} else {
  const top1 = rankedCreators[0];
  const top2 = rankedCreators[1];
  const rest = rankedCreators.slice(2, 10);

  let html = '';

  html += `
    <div class="banner banner-1" style="cursor:default">
      <div class="banner-head">
        <span class="banner-tag">🏆 1st Place · Creator of the Week</span>
        <span class="banner-trophy">🏆</span>
      </div>
      <h3 class="banner-title">${top1.username ?
        '<a href="/u/?u=' + encodeURIComponent(top1.username) +
        '" style="color:inherit;text-decoration:none">' + esc(top1.name) + '</a>'
        : esc(top1.name)}</h3>
      <div class="banner-stats">
        <span>♥ ${top1.count}</span>
      </div>
    </div>
  `;

  if (top2) {
    html += `
      <div class="banner banner-2" style="cursor:default">
        <div class="banner-head">
          <span class="banner-tag">🥈 2nd Place</span>
          <span class="banner-trophy">🥈</span>
        </div>
        <h3 class="banner-title">${top2.username ?
          '<a href="/u/?u=' + encodeURIComponent(top2.username) +
          '" style="color:inherit;text-decoration:none">' + esc(top2.name) + '</a>'
          : esc(top2.name)}</h3>
        <div class="banner-stats">
          <span>♥ ${top2.count}</span>
        </div>
      </div>
    `;
  }

  html += rest.map((x, i) => {
    const rank = i + 3;
    const trophy = rank === 3 ? '🥉' : null;
    const rankHtml = trophy
      ? `<div class="rank">${trophy}</div>`
      : `<div class="rank num">${rank}</div>`;
    const nameHtml = x.username
      ? '<a href="/u/?u=' + encodeURIComponent(x.username) + '">' + esc(x.name) + '</a>'
      : esc(x.name);
    return `<div class="row">
      ${rankHtml}
      <div class="info">
        <div class="name">${nameHtml}</div>
      </div>
      <div class="count">♥ ${x.count}</div>
    </div>`;
  }).join('');

  creatorsEl.innerHTML = html;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
</script>

</body>
 </html>
