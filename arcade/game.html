<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playing — Arcade</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a14; color: #fff;
               font-family: system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 1fr 340px;
          min-height: 100vh; }
  .stage { background: #000; display: flex;
           align-items: center; justify-content: center;
           overflow: hidden; position: relative; }
  .stage iframe { width: 100%; height: 100vh; border: 0; display: block;
                  transform-origin: center center;
                  transition: transform 0.15s ease; }
  .side { background: #10101e; padding: 20px;
          border-left: 1px solid rgba(255,255,255,0.06);
          overflow-y: auto; max-height: 100vh; }
  .side h1 { margin: 0 0 4px; font-size: 20px;
             white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }
  .side .author { font-size: 13px; opacity: 0.5;
                  margin-bottom: 16px; }
  .side .author a { color: #4af; text-decoration: none; opacity: 0.9; }
  .side .author a:hover { text-decoration: underline; }
  .row { display: flex; gap: 8px; margin-bottom: 20px;
         flex-wrap: wrap; }
  .btn { padding: 10px 14px; border: 0; border-radius: 8px;
         background: rgba(255,255,255,0.08); color: #fff;
         font-weight: 600; font-size: 13px; cursor: pointer;
         text-decoration: none; display: inline-block; }
  .btn:hover { background: rgba(255,255,255,0.15); }
  .btn.liked { background: #f44; }
  .zoom-val { padding: 10px 8px; font-size: 13px; opacity: 0.6;
              min-width: 48px; text-align: center; }
  .section { border-top: 1px solid rgba(255,255,255,0.06);
             padding-top: 16px; margin-top: 16px; }
  .section h2 { font-size: 14px; text-transform: uppercase;
                letter-spacing: 0.5px; opacity: 0.6;
                margin: 0 0 12px; font-weight: 600; }
  .comment { padding: 10px 0;
             border-bottom: 1px solid rgba(255,255,255,0.05); }
  .comment .who { font-size: 12px; font-weight: 700;
                  color: #4af; margin-bottom: 2px; }
  .comment .who a { color: #4af; text-decoration: none; }
  .comment .who a:hover { text-decoration: underline; }
  .comment .body { font-size: 14px; line-height: 1.4;
                   white-space: pre-wrap; word-break: break-word; }
  .comment .when { font-size: 11px; opacity: 0.4; margin-top: 4px; }
  .replies { margin-top: 8px; margin-left: 16px;
             padding-left: 12px;
             border-left: 2px solid rgba(68,170,255,0.15); }
  .replies .comment { border-bottom: 0;
                      padding: 6px 0;
                      border-top: 1px solid rgba(255,255,255,0.03); }
  .replies .comment:first-child { border-top: 0; }
  .reply-form { display: flex; gap: 6px; margin-top: 8px;
                margin-left: 16px; }
  .reply-form input { flex: 1; padding: 8px 12px;
                      background: #1a1a2e;
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 6px; color: #fff;
                      font-size: 13px; }
  .reply-form button { padding: 8px 14px; border: 0;
                       border-radius: 6px; background: #4af;
                       color: #fff; font-weight: 600;
                       font-size: 12px; cursor: pointer; }
  .comment-form { display: flex; gap: 6px; margin-top: 12px; }
  .comment-form input { flex: 1; padding: 10px;
                        background: #1a1a2e;
                        border: 1px solid rgba(255,255,255,0.1);
                        border-radius: 8px; color: #fff;
                        font-size: 14px; }
  .comment-form button { padding: 10px 16px; border: 0;
                         border-radius: 8px; background: #4af;
                         color: #fff; font-weight: 600;
                         cursor: pointer; }
  .loading { color: #fff; font-family: monospace;
             padding: 40px; opacity: 0.5; }
  .err { color: #f66; font-family: monospace;
         padding: 40px; white-space: pre-wrap; }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; }
    .side { max-height: none; border-left: 0;
            border-top: 1px solid rgba(255,255,255,0.06); }
    .stage iframe { height: 60vh; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="loading">Loading game...</div>
  </div>
  <aside class="side" id="side" style="display:none">
    <h1 id="title">...</h1>
    <div class="author" id="author">...</div>
    <div id="gameDescription" style="display:none; font-size:13px; opacity:0.75;
         line-height:1.5; margin-bottom:16px; padding:12px;
         background:rgba(255,255,255,0.03);
         border-left:3px solid #4af; border-radius:6px;"></div>
    <div class="row">
      <button class="btn" id="likeBtn">♥ <span id="likeCount">0</span></button>
      <button class="btn" id="shareBtn">🔗 Share</button>
      <button class="btn" id="forkBtn">✎ Fork</button>
      <button class="btn" id="fsBtn">⛶ Fullscreen</button>
      <button class="btn" id="zoomOut">−</button>
      <span class="zoom-val" id="zoomVal">100%</span>
      <button class="btn" id="zoomIn">+</button>
      <a class="btn" href="/arcade/">← Arcade</a>
    </div>
    <div class="section">
      <h2>Comments</h2>
      <div id="comments"><div class="loading">Loading...</div></div>
      <div class="comment-form">
        <input id="commentInput" placeholder="Add a comment..." maxlength="200">
        <button id="commentSubmit">Send</button>
      </div>
    </div>
  </aside>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const slug = new URLSearchParams(location.search).get('slug');
const stage = document.getElementById('stage');
let currentGameId = null;
let currentUserId = null;
let zoomLevel = 1;

const ENGINE_PATCH = `
(function() {
  if (typeof Display === 'undefined') return;

  Display.prototype.addEventListeners = function() {
    var self = this;

    window.addEventListener('keydown', function(e) {
      self.keys[e.keyCode] = true;
    });
    window.addEventListener('keyup', function(e) {
      self.keys[e.keyCode] = false;
    });

    var toCanvasCoords = function(clientX, clientY) {
      var rect = self.canvas.getBoundingClientRect();

      var vv = window.visualViewport;
      var vvScale = vv ? vv.scale : 1;
      var vvOffsetLeft = vv ? vv.offsetLeft : 0;
      var vvOffsetTop = vv ? vv.offsetTop : 0;

      var docX = clientX * vvScale + vvOffsetLeft + window.scrollX;
      var docY = clientY * vvScale + vvOffsetTop + window.scrollY;

      var rectDocLeft = rect.left + window.scrollX;
      var rectDocTop = rect.top + window.scrollY;

      var scaleX = self.canvas.width / rect.width;
      var scaleY = self.canvas.height / rect.height;

      return {
        x: (docX - rectDocLeft) * scaleX,
        y: (docY - rectDocTop) * scaleY
      };
    };

    window.addEventListener('mousedown', function(e) {
      var p = toCanvasCoords(e.clientX, e.clientY);
      self.x = p.x + self.camera.x;
      self.y = p.y + self.camera.y;
    });
    window.addEventListener('mouseup', function() {
      self.x = false;
      self.y = false;
    });
    window.addEventListener('touchstart', function(e) {
      var t = e.touches[0];
      var p = toCanvasCoords(t.clientX, t.clientY);
      self.x = p.x + self.camera.x;
      self.y = p.y + self.camera.y;
    }, { passive: true });
    window.addEventListener('touchend', function() {
      self.x = false;
      self.y = false;
    });
    window.addEventListener('mousemove', function(e) {
      var p = toCanvasCoords(e.clientX, e.clientY);
      if (typeof mouse !== 'undefined') {
        mouse.x = p.x;
        mouse.y = p.y;
      }
    });
    window.addEventListener('touchmove', function(e) {
      var t = e.touches[0];
      var p = toCanvasCoords(t.clientX, t.clientY);
      if (typeof mouse !== 'undefined') {
        mouse.x = p.x;
        mouse.y = p.y;
      }
    }, { passive: true });
  };
})();
`;

async function boot() {
  if (!slug) {
    stage.innerHTML = '<div class="err">No game specified.</div>';
    return;
  }

  const { data, error } = await supabase
    .from('games')
    .select('id, slug, title, author_id, author_name, code, engine_code, engine_version, plays, description')
    .eq('slug', slug)
    .single();

  if (error || !data) {
    stage.innerHTML = '<div class="err">Game not found.</div>';
    return;
  }

  currentGameId = data.id;

  document.title = data.title + ' — Arcade';
  document.getElementById('title').textContent = data.title;
  document.getElementById('side').style.display = 'block';

  if (data.description) {
    const descEl = document.getElementById('gameDescription');
    if (descEl) {
      descEl.textContent = data.description;
      descEl.style.display = 'block';
    }
  }

  renderGame(data);
  renderAuthor(data);

  supabase.from('games').update({ plays: (data.plays || 0) + 1 })
    .eq('id', data.id).then(() => {});

  wireButtons(data);

  loadLikes(data.id);
  loadComments(data.id);

  supabase.auth.getSession().then(({ data: { session } }) => {
    currentUserId = session ? session.user.id : null;
    if (currentUserId) loadLikes(data.id, currentUserId);
  });
}

function renderGame(data) {
  const userCode = data.code || '';
  const safeUserCode = userCode.replace(/<\/script>/gi, '<\\/script>');

  const builtIn = data.engine_code || '';
  const engineInline = builtIn.length > 100 ? builtIn : '';

  let html = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + escapeHtml(data.title) + '</title>' +
    '<style>html,body{margin:0;padding:0;background:#0a0a0a;' +
    'overflow:hidden;height:100%}canvas{display:block;margin:0 auto}</style>' +
    '</head><body>';

  if (engineInline) {
    html += '<script>' + engineInline + '<\/script>';
    html += '<script>' + ENGINE_PATCH + '<\/script>';
    html += '<script>' +
      'window.onerror = function(msg, src, line, col, err) {' +
      'document.body.innerHTML = "<pre style=\\"color:#f66;padding:20px;font-family:monospace\\">ERROR: " + msg + "\\n\\n" + (err && err.stack ? err.stack : "") + "</pre>";' +
      'return true;};' +
      safeUserCode + '<\/script>';
  } else {
    html += '<script>' +
      'window.onerror = function(msg, src, line, col, err) {' +
      'document.body.innerHTML = "<pre style=\\"color:#f66;padding:20px;font-family:monospace\\">ERROR: " + msg + "\\n\\n" + (err && err.stack ? err.stack : "") + "</pre>";' +
      'return true;};' +
      'var s = document.createElement("script");' +
      's.src = "/editor/epic.js";' +
      's.onload = function() {' +
        'try {' +
          '(function(){' + ENGINE_PATCH + '})();' +
          safeUserCode +
        '} catch(e) { document.body.innerHTML = "<pre style=\\"color:#f66;padding:20px;font-family:monospace\\">" + e.message + "\\n" + (e.stack||"") + "</pre>"; }' +
      '};' +
      's.onerror = function() { document.body.innerHTML = "<div style=\\"color:#f66;padding:20px;font-family:monospace\\">Could not load engine.</div>"; };' +
      'document.head.appendChild(s);' +
      '<\/script>';
  }

  html += '</body></html>';

  stage.innerHTML = '<iframe sandbox="allow-scripts allow-same-origin" allowfullscreen id="gameFrame"></iframe>';
  document.getElementById('gameFrame').srcdoc = html;

  zoomLevel = 1;
  updateZoomLabel();
}

function applyZoom() {
  const frame = document.getElementById('gameFrame');
  if (!frame) return;
  frame.style.transform = 'scale(' + zoomLevel + ')';
  updateZoomLabel();
}

function updateZoomLabel() {
  const el = document.getElementById('zoomVal');
  if (el) el.textContent = Math.round(zoomLevel * 100) + '%';
}

async function renderAuthor(data) {
  let creatorUsername = null;
  let creatorLabel = 'anonymous';

  if (data.author_id) {
    try {
      const { data: profile } = await supabase
        .from('profiles')
        .select('username, display_name')
        .eq('user_id', data.author_id)
        .maybeSingle();

      if (profile && profile.username) {
        creatorUsername = profile.username;
        creatorLabel = '@' + profile.username;
      } else if (profile && profile.display_name) {
        creatorLabel = profile.display_name;
      } else if (data.author_name) {
        creatorLabel = data.author_name.split('@')[0];
      }
    } catch (e) {}
  } else if (data.author_name) {
    creatorLabel = data.author_name.split('@')[0];
  }

  const authorEl = document.getElementById('author');
  if (creatorUsername) {
    authorEl.innerHTML = 'by <a href="/u/?u=' +
      encodeURIComponent(creatorUsername) + '">' + escapeHtml(creatorLabel) + '</a>';
  } else {
    authorEl.textContent = 'by ' + creatorLabel;
  }
}

function showSignInPrompt() {
  const existing = document.getElementById('signin-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'signin-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  modal.innerHTML =
    '<div style="background:#15152a;border:1px solid rgba(255,255,255,0.1);' +
    'border-radius:16px;padding:32px;max-width:320px;' +
    'text-align:center;color:#fff;font-family:system-ui;">' +
      '<h2 style="margin:0 0 12px;font-size:20px;">Join the fun</h2>' +
      '<p style="margin:0 0 24px;opacity:0.7;font-size:14px;line-height:1.5;">' +
        'Sign in to like games, leave comments, and follow your favourite creators.' +
      '</p>' +
      '<a href="/signup" style="display:block;padding:12px;' +
        'background:#4af;color:#fff;text-decoration:none;' +
        'border-radius:10px;font-weight:700;margin-bottom:8px;">' +
        'Sign In / Register</a>' +
      '<button id="signin-dismiss" style="padding:10px;background:transparent;' +
        'color:#fff;border:1px solid rgba(255,255,255,0.2);' +
        'border-radius:10px;font-weight:600;width:100%;' +
        'cursor:pointer;font-family:inherit;font-size:14px;">Not now</button>' +
    '</div>';
  document.body.appendChild(modal);

  document.getElementById('signin-dismiss').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
}

function wireButtons(data) {
  document.getElementById('shareBtn').onclick = async () => {
    const url = location.origin + '/arcade/game.html?slug=' + slug;
    try { await navigator.clipboard.writeText(url); alert('Link copied'); }
    catch(e) { prompt('Copy this link:', url); }
  };

  document.getElementById('forkBtn').onclick = () => {
    localStorage.setItem('limn_fork_code', data.code || '');
    localStorage.setItem('limn_fork_title', data.title || 'forked');
    location.href = '/editor/?fork=1';
  };

  document.getElementById('fsBtn').onclick = () => {
    const frame = document.getElementById('gameFrame');
    if (!frame) return;
    const el = document.fullscreenElement || document.webkitFullscreenElement;
    if (el) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const req = frame.requestFullscreen
               || frame.webkitRequestFullscreen
               || frame.msRequestFullscreen;
      if (req) {
        req.call(frame).catch(err => console.warn('Fullscreen failed:', err));
      } else {
        alert('Fullscreen not supported on this browser.');
      }
    }
  };

  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('fsBtn');
    if (btn) btn.textContent = document.fullscreenElement ? '⛶ Exit' : '⛶ Fullscreen';
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

    if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      const btn = document.getElementById('fsBtn');
      if (btn) btn.click();
    } else if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      zoomLevel = Math.min(2, +(zoomLevel + 0.1).toFixed(2));
      applyZoom();
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      zoomLevel = Math.max(0.5, +(zoomLevel - 0.1).toFixed(2));
      applyZoom();
    } else if (e.key === '0') {
      e.preventDefault();
      zoomLevel = 1;
      applyZoom();
    }
  });

  document.getElementById('zoomIn').onclick = () => {
    zoomLevel = Math.min(2, +(zoomLevel + 0.1).toFixed(2));
    applyZoom();
  };
  document.getElementById('zoomOut').onclick = () => {
    zoomLevel = Math.max(0.5, +(zoomLevel - 0.1).toFixed(2));
    applyZoom();
  };

  document.getElementById('commentSubmit').onclick = () => submitComment(null);
  document.getElementById('likeBtn').onclick = () => toggleLike();
}

async function toggleLike() {
  const { data: { session } } = await supabase.auth.getSession();
  const user = session ? session.user : null;
  if (!user) { showSignInPrompt(); return; }

  const { data: existing } = await supabase
    .from('likes').select('id')
    .eq('game_id', currentGameId).eq('user_id', user.id).maybeSingle();

  if (existing) {
    await supabase.from('likes').delete().eq('id', existing.id);
  } else {
    await supabase.from('likes').insert([{ game_id: currentGameId, user_id: user.id }]);
  }
  loadLikes(currentGameId, user.id);
}

async function submitComment(parentId) {
  let body = '';
  if (parentId) {
    const input = document.querySelector('[data-reply-input="' + parentId + '"]');
    body = input ? input.value.trim() : '';
  } else {
    const input = document.getElementById('commentInput');
    body = input ? input.value.trim() : '';
  }
  if (!body) return;

  const { data: { session } } = await supabase.auth.getSession();
  const user = session ? session.user : null;
  if (!user) { showSignInPrompt(); return; }

  const payload = {
    game_id: currentGameId,
    user_id: user.id,
    user_name: user.email || 'anonymous',
    body: body
  };
  if (parentId) payload.parent_id = parentId;

  const { error } = await supabase.from('comments').insert([payload]);
  if (error) { alert('Failed: ' + error.message); return; }

  if (parentId) {
    const input = document.querySelector('[data-reply-input="' + parentId + '"]');
    if (input) input.value = '';
  } else {
    const input = document.getElementById('commentInput');
    if (input) input.value = '';
  }

  loadComments(currentGameId);
}

async function loadLikes(gameId, userId) {
  const { count } = await supabase
    .from('likes').select('*', { count: 'exact', head: true })
    .eq('game_id', gameId);
  document.getElementById('likeCount').textContent = count || 0;
  if (userId) {
    const { data } = await supabase
      .from('likes').select('id')
      .eq('game_id', gameId).eq('user_id', userId).maybeSingle();
    document.getElementById('likeBtn').classList.toggle('liked', !!data);
  }
}

async function loadComments(gameId) {
  const { data, error } = await supabase
    .from('comments')
    .select('id, user_id, user_name, body, created_at, parent_id')
    .eq('game_id', gameId)
    .order('created_at', { ascending: true })
    .limit(200);

  const box = document.getElementById('comments');
  if (error || !data || data.length === 0) {
    box.innerHTML = '<div style=
