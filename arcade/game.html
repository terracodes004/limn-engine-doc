<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playing — Arcade</title>
<style>
  :root {
    --bg: #05060c;
    --bg-1: #0a0c16;
    --panel: rgba(18,20,32,0.75);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --text: #f0f3f8;
    --text-1: #a3aac0;
    --text-2: #6e7589;
    --accent: #6ea8fe;
    --accent-2: #a371f7;
    --warning: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  @keyframes sweep {
    0%   { background-position: -200% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes floatUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .wrap {
    display: grid;
    grid-template-columns: 1fr 380px;
    min-height: 100vh;
  }

  .stage {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .stage iframe {
    width: 100%;
    height: 100vh;
    border: 0;
    display: block;
  }

  .side {
    background: var(--bg-1);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    max-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .side::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(110,168,254,0.5),
      rgba(163,113,247,0.5),
      transparent);
    background-size: 200% 100%;
    animation: sweep 8s linear infinite;
    opacity: 0.7;
    pointer-events: none;
    z-index: 5;
  }

  .side-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 22px 22px 0;
  }
  .side-scroll::-webkit-scrollbar { width: 8px; }
  .side-scroll::-webkit-scrollbar-track { background: transparent; }
  .side-scroll::-webkit-scrollbar-thumb {
    background: var(--border-2);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .side-scroll::-webkit-scrollbar-thumb:hover { background: var(--border-2); background-clip: content-box; }

  .title-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .game-title {
    margin: 0;
    flex: 1;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.4px;
    line-height: 1.15;
    word-break: break-word;
    background: linear-gradient(120deg,
      #f0f3f8 0%, #f0f3f8 40%, #6ea8fe 50%,
      #a371f7 60%, #f0f3f8 70%, #f0f3f8 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sweep 10s linear infinite;
  }
  .offline-badge {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: rgba(74,222,128,0.12);
    border: 1px solid rgba(74,222,128,0.35);
    color: #4ade80;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .offline-badge.on { display: inline-flex; }

  .game-author {
    font-size: 13px;
    color: var(--text-2);
    margin-bottom: 16px;
  }
  .game-author a {
    color: var(--warning);
    text-decoration: none;
    font-weight: 600;
  }
  .game-author a:hover { text-decoration: underline; }

  .game-desc {
    font-size: 13.5px;
    color: var(--text-1);
    line-height: 1.6;
    margin-bottom: 18px;
    padding: 14px 16px;
    background: rgba(110,168,254,0.06);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    white-space: pre-wrap;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,0.035);
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: var(--border-2);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .btn:disabled:hover {
    background: rgba(255,255,255,0.035);
    border-color: var(--border);
    transform: none;
  }

  .btn-like {
    background: rgba(255,84,112,0.1);
    border-color: rgba(255,84,112,0.3);
    color: #ff5470;
  }
  .btn-like:hover:not(:disabled) { background: rgba(255,84,112,0.18); border-color: rgba(255,84,112,0.5); }
  .btn-like.liked {
    background: linear-gradient(135deg, #ff5470, #ec4899);
    border-color: #ff5470;
    color: #fff;
    box-shadow: 0 4px 16px rgba(255,84,112,0.4);
  }
  .btn-like.liked .heart { animation: pop 0.4s ease; }
  .btn-like .heart { font-size: 14px; }

  .btn-offline {
    background: rgba(110,168,254,0.08);
    border-color: rgba(110,168,254,0.3);
    color: var(--accent);
  }
  .btn-offline:hover:not(:disabled) { background: rgba(110,168,254,0.16); border-color: rgba(110,168,254,0.5); }
  .btn-offline.saved {
    background: rgba(74,222,128,0.12);
    border-color: rgba(74,222,128,0.4);
    color: #4ade80;
  }
  .btn-offline.saved:hover:not(:disabled) {
    background: rgba(248,113,113,0.12);
    border-color: rgba(248,113,113,0.4);
    color: #f87171;
  }

  .zoom-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .zoom-group button {
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .zoom-group button:hover { background: rgba(255,255,255,0.08); }
  .zoom-val {
    padding: 0 10px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-1);
    min-width: 52px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--text-2);
    margin: 0 0 14px;
  }
  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .section-title .count {
    padding: 2px 8px;
    background: rgba(110,168,254,0.15);
    border: 1px solid rgba(110,168,254,0.3);
    border-radius: 10px;
    color: var(--accent);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .comment {
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    animation: floatUp 0.35s ease backwards;
  }
  .comment:last-child { border-bottom: 0; }

  .comment-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .comment-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6ea8fe, #a371f7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #fff;
    font-size: 14px;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(110,168,254,0.2);
  }
  .comment-who {
    flex: 1;
    min-width: 0;
  }
  .comment-who a {
    color: var(--warning);
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
  }
  .comment-who a:hover { text-decoration: underline; }
  .comment-who span {
    color: var(--warning);
    font-weight: 700;
    font-size: 13px;
  }
  .comment-when {
    display: block;
    color: var(--text-2);
    font-size: 11px;
    margin-top: 2px;
  }
  .comment-body {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-1);
    white-space: pre-wrap;
    word-break: break-word;
    margin-left: 42px;
  }

  .replies {
    margin-top: 10px;
    margin-left: 42px;
    padding-left: 12px;
    border-left: 2px solid rgba(110,168,254,0.15);
  }
  .replies .comment {
    padding: 8px 0;
    border-bottom: 0;
  }
  .replies .comment-avatar {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }
  .replies .comment-body { margin-left: 36px; font-size: 13px; }

  .reply-form {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    margin-left: 42px;
  }
  .reply-form input {
    flex: 1;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .reply-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110,168,254,0.15);
  }
  .reply-form button {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #6ea8fe, #a371f7);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: filter 0.15s;
  }
  .reply-form button:hover { filter: brightness(1.15); }

  .comment-form-wrap {
    margin-top: 14px;
    padding: 14px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .comment-form {
    display: flex;
    gap: 8px;
  }
  .comment-form input {
    flex: 1;
    padding: 11px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .comment-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110,168,254,0.15);
  }
  .comment-form input::placeholder { color: var(--text-2); }
  .comment-form input:disabled { opacity: 0.5; cursor: not-allowed; }
  .comment-form button {
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #6ea8fe, #a371f7);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: filter 0.15s, transform 0.1s;
  }
  .comment-form button:hover:not(:disabled) { filter: brightness(1.15); }
  .comment-form button:active:not(:disabled) { transform: scale(0.97); }
  .comment-form button:disabled { opacity: 0.4; cursor: not-allowed; }

  .loading {
    color: var(--text-2);
    font-family: "JetBrains Mono", monospace;
    padding: 20px;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .loading::before {
    content: "";
    width: 14px;
    height: 14px;
    border: 2px solid var(--border-2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .err {
    color: #f87171;
    font-family: "JetBrains Mono", monospace;
    padding: 20px;
    font-size: 12.5px;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .empty-comments {
    text-align: center;
    padding: 24px 12px;
    color: var(--text-2);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .empty-comments::before {
    content: "💬";
    font-size: 32px;
    opacity: 0.5;
  }

  .side-footer {
    padding: 18px 22px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: var(--bg-1);
    flex-shrink: 0;
  }
  .side-footer-logo {
    position: relative;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .side-footer-logo::before {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 13px;
    background: conic-gradient(from 0deg,
      #6ea8fe, #a371f7, #ec4899, #fbbf24, #4ade80, #6ea8fe);
    animation: spin 7s linear infinite;
    filter: blur(7px);
    opacity: 0.7;
    z-index: 0;
  }
  .side-footer-logo img {
    position: relative;
    z-index: 1;
    width: 36px;
    height: 36px;
    object-fit: contain;
    border-radius: 10px;
    background: var(--bg);
    padding: 3px;
  }
  .side-footer-text {
    font-size: 11.5px;
    color: var(--text-2);
    letter-spacing: 0.5px;
  }
  .side-footer-text strong {
    color: var(--text-1);
    font-weight: 800;
    letter-spacing: 1px;
  }

  #debugLog {
    position: fixed;
    bottom: 8px;
    left: 8px;
    max-width: 320px;
    max-height: 180px;
    overflow-y: auto;
    background: rgba(0,0,0,0.85);
    color: #34d399;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    line-height: 1.4;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(52,211,153,0.3);
    z-index: 99999;
    display: none;
  }
  #debugLog.on { display: block; }
  #debugLog .err-line { color: #f87171; }
  #debugToggle {
    position: fixed;
    bottom: 8px;
    left: 8px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: #34d399;
    border: 1px solid rgba(52,211,153,0.4);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 900px) {
    .wrap {
      grid-template-columns: 1fr;
    }
    .stage iframe { height: 55vh; }
    .side {
      max-height: none;
      overflow: visible;
    }
    .side-scroll {
      padding: 18px 18px 0;
    }
    .game-title { font-size: 19px; }
  }
</style>
</head>
<body>

<button id="debugToggle" title="Toggle debug log">🐞</button>
<div id="debugLog"></div>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="loading">Loading game...</div>
  </div>
  <aside class="side" id="side" style="display:none">
    <div class="side-scroll">
      <div class="title-row">
        <h1 class="game-title" id="title">...</h1>
        <span class="offline-badge" id="offlineBadge">📴 Offline</span>
      </div>
      <div class="game-author" id="author">...</div>
      <div id="gameDescription" class="game-desc" style="display:none;"></div>

      <div class="actions">
        <button class="btn btn-like" id="likeBtn">
          <span class="heart">♥</span>
          <span id="likeCount">0</span>
        </button>
        <button class="btn" id="shareBtn">🔗 Share</button>
        <button class="btn" id="forkBtn">✎ Fork</button>
        <button class="btn btn-offline" id="offlineBtn">📥 Make Offline</button>
        <button class="btn" id="fsBtn">⛶ Fullscreen</button>
        <div class="zoom-group">
          <button id="zoomOut" title="Zoom out">−</button>
          <span class="zoom-val" id="zoomVal">100%</span>
          <button id="zoomIn" title="Zoom in">+</button>
        </div>
        <a class="btn" href="/arcade/">← Arcade</a>
      </div>

      <div class="section">
        <h2 class="section-title">
          <span>Comments</span>
          <span class="count" id="commentCount">0</span>
        </h2>
        <div id="comments"><div class="loading">Loading...</div></div>
        <div class="comment-form-wrap">
          <div class="comment-form">
            <input id="commentInput" placeholder="Add a comment..." maxlength="200">
            <button id="commentSubmit">Send</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="side-footer">
      <div class="side-footer-logo">
        <img src="/editor/logo.png" alt="Limn" />
      </div>
      <div class="side-footer-text">Powered by <strong>LIMN</strong></div>
    </footer>
  </aside>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const debugLog = document.getElementById('debugLog');
const debugToggle = document.getElementById('debugToggle');

function log(msg, isError) {
  const line = document.createElement('div');
  if (isError) line.className = 'err-line';
  const t = new Date().toISOString().slice(11, 19);
  line.textContent = '[' + t + '] ' + msg;
  debugLog.appendChild(line);
  debugLog.scrollTop = debugLog.scrollHeight;
  if (isError) console.error(msg); else console.log(msg);
}

debugToggle.onclick = () => {
  debugLog.classList.toggle('on');
};

window.addEventListener('error', (e) => {
  log('WINDOW ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno, true);
});
window.addEventListener('unhandledrejection', (e) => {
  log('UNHANDLED PROMISE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), true);
});

log('Script started');

// ─── OFFLINE STORAGE ───
const OFFLINE_GAMES_KEY = 'limn_arcade_offline_games_v1';

function getOfflineGames() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_GAMES_KEY) || '{}'); }
  catch { return {}; }
}
function saveOfflineGames(obj) {
  try { localStorage.setItem(OFFLINE_GAMES_KEY, JSON.stringify(obj)); }
  catch (e) { log('Offline save failed: ' + e.message, true); }
}
function hasOfflineCopy(slug) {
  if (!slug) return false;
  const games = getOfflineGames();
  return !!games[slug];
}

// ─── SUPABASE ───
const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

log('Supabase client created');

const slug = new URLSearchParams(location.search).get('slug');
const stage = document.getElementById('stage');
let currentGameId = null;
let currentUserId = null;
let currentGameData = null;
let isLoadingFromCache = false;
let zoomLevel = 1;

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error((label || 'Request') + ' timed out after ' + ms + 'ms')), ms)
    )
  ]);
}

function toast(msg, isError) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText =
    'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);' +
    'background:rgba(20,22,36,0.96);' +
    'border:1px solid ' + (isError ? 'rgba(248,113,113,0.4)' : 'rgba(110,168,254,0.4)') + ';' +
    'color:#f0f3f8;padding:12px 22px;border-radius:12px;' +
    'font-weight:600;font-size:13.5px;z-index:99999;' +
    'box-shadow:0 8px 32px rgba(0,0,0,0.6);' +
    'backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);' +
    'animation:floatUp 0.3s ease;max-width:90vw;text-align:center;';
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity 0.3s, transform 0.3s';
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(10px)';
    setTimeout(() => t.remove(), 320);
  }, 2600);
}

// ─── BOOT ───
async function boot() {
  log('boot() called with slug=' + slug);

  if (!slug) {
    stage.innerHTML = '<div class="err">No game specified in the URL.</div>';
    log('No slug in URL', true);
    return;
  }

  const cached = getOfflineGames()[slug];
  const browserOffline = !navigator.onLine;

  let data = null;
  let error = null;
  let fromCache = false;

  if (browserOffline && cached) {
    log('Browser offline — using cached copy');
    data = cached;
    fromCache = true;
  } else if (browserOffline && !cached) {
    log('Browser offline and no cache available', true);
    stage.innerHTML =
      '<div class="err">You are offline and this game is not saved for offline play.' +
      '\n\nGo back online, open this game, and tap "Make Offline" to save it.</div>';
    return;
  } else {
    // Online — try network
    try {
      log('Fetching game from Supabase...');
      const result = await withTimeout(
        supabase
          .from('games')
          .select('id, slug, title, author_id, author_name, code, engine_code, engine_version, plays, description')
          .eq('slug', slug)
          .single(),
        8000,
        'Game fetch'
      );
      data = result.data;
      error = result.error;
      log('Supabase responded. error=' + (error ? error.message : 'null') + ' data=' + (data ? 'yes' : 'no'));
    } catch (e) {
      log('Fetch threw: ' + e.message, true);
      if (cached) {
        log('Network failed — falling back to cache');
        data = cached;
        fromCache = true;
        error = null;
      } else {
        stage.innerHTML = '<div class="err">Could not load game: ' + e.message +
          '\n\nCheck your internet connection and refresh.' +
          '\n\nIf this persists, the game may not exist, or Supabase may be blocking the request.</div>';
        return;
      }
    }

    if ((error || !data) && cached) {
      log('Fetch error — using cache');
      data = cached;
      fromCache = true;
      error = null;
    }
  }

  if (error || !data) {
    stage.innerHTML = '<div class="err">Game not found.' +
      (error ? '\n\n' + error.message : '') + '</div>';
    log('Game not found or error', true);
    return;
  }

  // Update cached copy when we successfully fetched and it was already cached
  if (!fromCache && cached) {
    try {
      const games = getOfflineGames();
      games[slug] = buildCacheEntry(data);
      saveOfflineGames(games);
      log('Refreshed cached copy');
    } catch (e) {}
  }

  log('Game loaded: ' + data.title + (fromCache ? ' (offline)' : ''));
  log('Code length: ' + (data.code || '').length + ', engine length: ' + (data.engine_code || '').length);

  currentGameData = data;
  isLoadingFromCache = fromCache;
  applyGameData(data, fromCache);
}

function buildCacheEntry(data) {
  return {
    id: data.id || null,
    slug: data.slug || slug,
    title: data.title || 'Untitled',
    author_id: data.author_id || null,
    author_name: data.author_name || null,
    code: data.code || '',
    engine_code: data.engine_code || '',
    engine_version: data.engine_version || 'v4',
    plays: data.plays || 0,
    description: data.description || '',
    cached_at: Date.now(),
  };
}

function applyGameData(data, fromCache) {
  currentGameId = data.id || null;

  document.title = data.title + ' — Arcade';
  document.getElementById('title').textContent = data.title;
  document.getElementById('side').style.display = 'flex';

  // Offline badge
  const badge = document.getElementById('offlineBadge');
  if (fromCache) {
    badge.classList.add('on');
  } else {
    badge.classList.remove('on');
  }

  if (data.description) {
    const descEl = document.getElementById('gameDescription');
    descEl.textContent = data.description;
    descEl.style.display = 'block';
  }

  log('Rendering game iframe...');
  renderGame(data);
  log('Rendering author...');
  renderAuthor(data);

  // Update plays + load social only when online
  if (!fromCache && !navigator.onLine === false) {
    supabase.from('games').update({ plays: (data.plays || 0) + 1 })
      .eq('id', data.id).then(() => {}).catch(() => {});

    log('Loading likes and comments...');
    loadLikes(data.id);
    loadComments(data.id);

    supabase.auth.getSession().then(({ data: { session } }) => {
      currentUserId = session ? session.user.id : null;
      log('Session loaded. User: ' + (currentUserId ? 'yes' : 'no'));
      if (currentUserId) loadLikes(data.id, currentUserId);
    }).catch((e) => {
      log('Session load failed: ' + e.message, true);
    });
  } else if (fromCache) {
    // Offline — show a message in comments area
    log('Offline mode: skipping likes/comments');
    const box = document.getElementById('comments');
    if (box) box.innerHTML = '<div class="empty-comments">Comments are unavailable offline</div>';
    const input = document.getElementById('commentInput');
    if (input) { input.disabled = true; input.placeholder = 'Offline — comments unavailable'; }
    const sendBtn = document.getElementById('commentSubmit');
    if (sendBtn) sendBtn.disabled = true;
    const likeBtn = document.getElementById('likeBtn');
    if (likeBtn) likeBtn.disabled = true;
  } else {
    // Online but social failed silently — still try
    loadLikes(data.id);
    loadComments(data.id);
  }

  log('Wiring buttons...');
  wireButtons(data);

  updateOfflineBtnState();
  log('boot() finished');
}

// ─── RENDER GAME ───
function renderGame(data) {
  const userCode = data.code || '';
  const safeUserCode = userCode.replace(/<\/script>/gi, '<\\/script>');

  const version = (data.engine_version || 'v4').toLowerCase();
  const engineFile = version.includes('v2') ? 'tcjsgame-v2.js'
                   : version.includes('v3') ? 'tcjsgame-v3.js'
                   : 'epic.js';
  const engineUrl = location.origin + '/editor/' + engineFile;

  log('Using engine URL: ' + engineUrl + ' (' + engineFile + ')');

  const html = '<!DOCTYPE html><html><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + escapeHtml(data.title) + '</title>' +
    '<style>html,body{margin:0;padding:0;background:#0a0a0a;overflow:hidden;height:100%}canvas{display:block;margin:0 auto}</style>' +
    '</head><body>' +
    '<script src="' + engineUrl + '"><\/script>' +
    '<script>' +
      'window.onerror = function(msg, src, line, col, err) {' +
      'parent.postMessage({type:"game-error",msg:msg,stack:(err&&err.stack)||""}, "*");' +
      'document.body.innerHTML = "<pre style=\\"color:#f66;padding:20px;font-family:monospace\\">ERROR: " + msg + "\\n\\n" + (err && err.stack ? err.stack : "") + "</pre>";' +
      'return true;};' +
      safeUserCode +
    '<\/script>' +
    '</body></html>';

  stage.innerHTML = '<iframe sandbox="allow-scripts allow-same-origin" allowfullscreen id="gameFrame"></iframe>';
  const frame = document.getElementById('gameFrame');

  // Re-apply zoom whenever the iframe finishes loading
  frame.addEventListener('load', () => {
    setTimeout(applyZoom, 60);
  });

  frame.srcdoc = html;

  zoomLevel = 1;
  updateZoomLabel();
  log('Iframe rendered');
}

window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'game-error') {
    log('GAME ERROR: ' + e.data.msg, true);
    if (e.data.stack) log('  stack: ' + e.data.stack.slice(0, 200), true);
  } else if (e.data.type === 'game-log') {
    log('IFRAME: ' + e.data.msg);
  }
});

// ─── ZOOM (uses body.style.zoom inside iframe) ───
function applyZoom() {
  const frame = document.getElementById('gameFrame');
  if (!frame) return;

  // Prefer zooming the iframe's BODY — resizes the game canvas correctly
  try {
    const doc = frame.contentDocument;
    if (doc && doc.body) {
      doc.body.style.zoom = zoomLevel;
      updateZoomLabel();
      return;
    }
  } catch (e) {
    // cross-origin fallback below
  }

  // Fallback: zoom the iframe element itself
  frame.style.zoom = zoomLevel;
  updateZoomLabel();
}

function updateZoomLabel() {
  const el = document.getElementById('zoomVal');
  if (el) el.textContent = Math.round(zoomLevel * 100) + '%';
}

// ─── AUTHOR ───
async function renderAuthor(data) {
  let creatorUsername = null;
  let creatorLabel = 'anonymous';

  if (data.author_id) {
    try {
      const { data: profile } = await supabase
        .from('profiles')
        .select('username, display_name')
        .eq('user_id', data.author_id)
        .maybeSingle();

      if (profile && profile.username) {
        creatorUsername = profile.username;
        creatorLabel = '@' + profile.username;
      } else if (profile && profile.display_name) {
        creatorLabel = profile.display_name;
      } else if (data.author_name) {
        creatorLabel = data.author_name.split('@')[0];
      }
    } catch (e) {
      log('Profile lookup failed: ' + e.message, true);
    }
  } else if (data.author_name) {
    creatorLabel = data.author_name.split('@')[0];
  }

  const authorEl = document.getElementById('author');
  if (creatorUsername) {
    authorEl.innerHTML = 'by <a href="/u/?u=' +
      encodeURIComponent(creatorUsername) + '">' + escapeHtml(creatorLabel) + '</a>';
  } else {
    authorEl.textContent = 'by ' + creatorLabel;
  }
}

// ─── SIGN-IN PROMPT ───
function showSignInPrompt() {
  const existing = document.getElementById('signin-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'signin-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  modal.innerHTML =
    '<div style="background:#15152a;border:1px solid rgba(255,255,255,0.12);' +
    'border-radius:20px;padding:32px;max-width:340px;' +
    'text-align:center;color:#fff;font-family:system-ui;box-shadow:0 20px 60px rgba(0,0,0,0.6);">' +
      '<div style="font-size:36px;margin-bottom:12px;">✦</div>' +
      '<h2 style="margin:0 0 10px;font-size:20px;font-weight:800;">Join the fun</h2>' +
      '<p style="margin:0 0 22px;opacity:0.7;font-size:13.5px;line-height:1.55;">' +
        'Sign in to like games, leave comments, and follow your favourite creators.' +
      '</p>' +
      '<a href="/signup" style="display:block;padding:14px;' +
        'background:linear-gradient(135deg,#6ea8fe,#a371f7);color:#fff;text-decoration:none;' +
        'border-radius:12px;font-weight:700;margin-bottom:10px;font-size:14.5px;">' +
        'Sign In / Register</a>' +
      '<button id="signin-dismiss" style="padding:12px;background:transparent;' +
        'color:#fff;border:1px solid rgba(255,255,255,0.15);' +
        'border-radius:12px;font-weight:600;width:100%;' +
        'cursor:pointer;font-family:inherit;font-size:14px;">Not now</button>' +
    '</div>';
  document.body.appendChild(modal);

  document.getElementById('signin-dismiss').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
}

// ─── OFFLINE TOGGLE ───
function updateOfflineBtnState() {
  const btn = document.getElementById('offlineBtn');
  if (!btn) return;
  const saved = hasOfflineCopy(slug);
  if (saved) {
    btn.textContent = '✓ Saved Offline';
    btn.classList.add('saved');
    btn.title = 'Saved for offline play — tap to remove';
  } else {
    btn.textContent = '📥 Make Offline';
    btn.classList.remove('saved');
    btn.title = 'Save this game to play without internet';
  }
}

function toggleOffline() {
  if (!slug || !currentGameData) return;

  const games = getOfflineGames();

  if (games[slug]) {
    // Remove
    delete games[slug];
    saveOfflineGames(games);
    updateOfflineBtnState();
    toast('Removed from offline storage');
    log('Removed ' + slug + ' from offline cache');
  } else {
    // Add
    games[slug] = buildCacheEntry(currentGameData);
    saveOfflineGames(games);
    updateOfflineBtnState();
    toast('Saved! You can now play this offline.');
    log('Saved ' + slug + ' to offline cache');

    // Bonus: if online, also warm the HTTP cache for the engine file so
    // the iframe can load it while offline.
    try {
      const version = (currentGameData.engine_version || 'v4').toLowerCase();
      const engineFile = version.includes('v2') ? 'tcjsgame-v2.js'
                       : version.includes('v3') ? 'tcjsgame-v3.js'
                       : 'epic.js';
      fetch('/editor/' + engineFile, { cache: 'force-cache' }).catch(() => {});
    } catch (e) {}
  }
}

// ─── WIRE BUTTONS ───
function wireButtons(data) {
  document.getElementById('shareBtn').onclick = async () => {
    const url = location.origin + '/arcade/game.html?slug=' + slug;
    try { await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch(e) { prompt('Copy this link:', url); }
  };

  document.getElementById('forkBtn').onclick = () => {
    localStorage.setItem('limn_fork_code', data.code || '');
    localStorage.setItem('limn_fork_title', data.title || 'forked');
    location.href = '/editor/?fork=1';
  };

  const offlineBtn = document.getElementById('offlineBtn');
  if (offlineBtn) {
    offlineBtn.onclick = () => {
      if (!navigator.onLine && !hasOfflineCopy(slug)) {
        toast('You need to be online to save a game offline', true);
        return;
      }
      toggleOffline();
    };
  }

  document.getElementById('fsBtn').onclick = () => {
    const frame = document.getElementById('gameFrame');
    if (!frame) return;
    const el = document.fullscreenElement || document.webkitFullscreenElement;
    if (el) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const req = frame.requestFullscreen
               || frame.webkitRequestFullscreen
               || frame.msRequestFullscreen;
      if (req) {
        req.call(frame).catch(err => log('Fullscreen failed: ' + err.message, true));
      } else {
        alert('Fullscreen not supported on this browser.');
      }
    }
  };

  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('fsBtn');
    if (btn) btn.textContent = document.fullscreenElement ? '⛶ Exit' : '⛶ Fullscreen';
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

    if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      document.getElementById('fsBtn').click();
    } else if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      zoomLevel = +(zoomLevel + 0.1).toFixed(2);
      applyZoom();
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      zoomLevel = +(zoomLevel - 0.1).toFixed(2);
      applyZoom();
    } else if (e.key === '0') {
      e.preventDefault();
      zoomLevel = 1;
      applyZoom();
    }
  });

  document.getElementById('zoomIn').onclick = () => {
    zoomLevel = +(zoomLevel + 0.1).toFixed(2);
    applyZoom();
  };
  document.getElementById('zoomOut').onclick = () => {
    zoomLevel = +(zoomLevel - 0.1).toFixed(2);
    applyZoom();
  };

  document.getElementById('commentSubmit').onclick = () => submitComment(null);
  document.getElementById('likeBtn').onclick = () => toggleLike();
}

// ─── LIKE / COMMENT ───
async function toggleLike() {
  if (!navigator.onLine) { toast('You are offline', true); return; }
  const { data: { session } } = await supabase.auth.getSession();
  const user = session ? session.user : null;
  if (!user) { showSignInPrompt(); return; }

  const { data: existing } = await supabase
    .from('likes').select('id')
    .eq('game_id', currentGameId).eq('user_id', user.id).maybeSingle();

  if (existing) {
    await supabase.from('likes').delete().eq('id', existing.id);
  } else {
    await supabase.from('likes').insert([{ game_id: currentGameId, user_id: user.id }]);
  }
  loadLikes(currentGameId, user.id);
}

async function submitComment(parentId) {
  if (!navigator.onLine) { toast('You are offline', true); return; }

  let body = '';
  if (parentId) {
    const input = document.querySelector('[data-reply-input="' + parentId + '"]');
    body = input ? input.value.trim() : '';
  } else {
    const input = document.getElementById('commentInput');
    body = input ? input.value.trim() : '';
  }
  if (!body) return;

  const { data: { session } } = await supabase.auth.getSession();
  const user = session ? session.user : null;
  if (!user) { showSignInPrompt(); return; }

  const payload = {
    game_id: currentGameId,
    user_id: user.id,
    user_name: user.email || 'anonymous',
    body: body
  };
  if (parentId) payload.parent_id = parentId;

  const { error } = await supabase.from('comments').insert([payload]);
  if (error) { alert('Failed: ' + error.message); return; }

  if (parentId) {
    const input = document.querySelector('[data-reply-input="' + parentId + '"]');
    if (input) input.value = '';
  } else {
    const input = document.getElementById('commentInput');
    if (input) input.value = '';
  }

  loadComments(currentGameId);
}

async function loadLikes(gameId, userId) {
  if (!navigator.onLine || !gameId) return;
  try {
    const { count } = await supabase
      .from('likes').select('*', { count: 'exact', head: true })
      .eq('game_id', gameId);
    document.getElementById('likeCount').textContent = count || 0;
    if (userId) {
      const { data } = await supabase
        .from('likes').select('id')
        .eq('game_id', gameId).eq('user_id', userId).maybeSingle();
      document.getElementById('likeBtn').classList.toggle('liked', !!data);
    }
  } catch (e) {
    log('Likes load failed: ' + e.message, true);
  }
}

async function loadComments(gameId) {
  const box = document.getElementById('comments');
  const countEl = document.getElementById('commentCount');

  if (!navigator.onLine || !gameId) {
    if (box) box.innerHTML = '<div class="empty-comments">Comments are unavailable offline</div>';
    return;
  }

  let data;
  try {
    const result = await withTimeout(
      supabase
        .from('comments')
        .select('id, user_id, user_name, body, created_at, parent_id')
        .eq('game_id', gameId)
        .order('created_at', { ascending: true })
        .limit(200),
      6000,
      'Comments fetch'
    );
    data = result.data;
  } catch (e) {
    log('Comments load failed: ' + e.message, true);
    box.innerHTML = '<div style="opacity:0.4;font-size:13px">Could not load comments.</div>';
    return;
  }

  if (countEl) countEl.textContent = (data || []).length;

  if (!data || data.length === 0) {
    box.innerHTML = '<div class="empty-comments">No comments yet. Be the first!</div>';
    return;
  }

  const ids = [...new Set(data.map(c => c.user_id).filter(Boolean))];
  const profileMap = {};
  if (ids.length > 0) {
    try {
      const { data: profiles } = await supabase
        .from('profiles')
        .select('user_id, username, display_name')
        .in('user_id', ids);
      for (const p of profiles || []) profileMap[p.user_id] = p;
    } catch (e) {}
  }

  function whoHtml(c) {
    const p = profileMap[c.user_id];
    if (p && p.username) {
      return '<a href="/u/?u=' + encodeURIComponent(p.username) + '">@' +
        escapeHtml(p.username) + '</a>';
    }
    if (p && p.display_name) return '<span>' + escapeHtml(p.display_name) + '</span>';
    return '<span>' + escapeHtml(c.user_name ? c.user_name.split('@')[0] : 'anon') + '</span>';
  }

  function initialOf(c) {
    const p = profileMap[c.user_id];
    const name = (p && (p.display_name || p.username)) ||
                 (c.user_name ? c.user_name.split('@')[0] : '?');
    return (name || '?').replace(/^@/, '').trim().charAt(0).toUpperCase() || '?';
  }

  const roots = data.filter(c => !c.parent_id);
  const replies = {};
  for (const c of data) {
    if (c.parent_id) {
      if (!replies[c.parent_id]) replies[c.parent_id] = [];
      replies[c.parent_id].push(c);
    }
  }

  function renderOne(c, isReply, idx) {
    const kids = replies[c.id] || [];
    const replyForm = isReply ? '' :
      '<div class="reply-form">' +
        '<input data-reply-input="' + c.id + '" placeholder="Write a reply..." maxlength="200">' +
        '<button data-reply-btn="' + c.id + '">Reply</button>' +
      '</div>';
    const kidsHtml = kids.length > 0
      ? '<div class="replies">' + kids.map((k, i) => renderOne(k, true, i)).join('') + '</div>'
      : '';
    return '<div class="comment" style="animation-delay:' + (idx * 0.04) + 's">' +
      '<div class="comment-head">' +
        '<div class="comment-avatar">' + escapeHtml(initialOf(c)) + '</div>' +
        '<div class="comment-who">' +
          whoHtml(c) +
          '<span class="comment-when">' + timeAgo(c.created_at) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="comment-body">' + escapeHtml(c.body) + '</div>' +
      kidsHtml + replyForm +
      '</div>';
  }

  box.innerHTML = roots.map((c, i) => renderOne(c, false, i)).join('');

  box.querySelectorAll('[data-reply-btn]').forEach(btn => {
    btn.addEventListener('click', () => submitComment(btn.dataset.replyBtn));
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

// ─── ONLINE/OFFLINE EVENTS ───
window.addEventListener('online', () => {
  log('Browser is online');
  toast('Back online');
});
window.addEventListener('offline', () => {
  log('Browser is offline');
  if (hasOfflineCopy(slug)) {
    toast('Offline — using saved copy');
  } else {
    toast('You are offline', true);
  }
});

boot();
</script>
