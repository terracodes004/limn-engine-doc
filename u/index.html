<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile — Arcade</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a14; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; }

  .banner {
    height: 160px;
    background: linear-gradient(135deg,
      #ec4899 0%,
      #f97316 25%,
      #facc15 50%,
      #22d3ee 75%,
      #6366f1 100%);
    position: relative;
  }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.1) 0%,
      rgba(10,10,20,0.9) 100%);
    pointer-events: none;
  }

  .container { max-width: 1000px; margin: 0 auto;
               padding: 0 24px; }

  .profile-head {
    margin-top: -60px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  .avatar {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 4px solid #0a0a14;
    background: #15152a;
    object-fit: cover;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    flex-shrink: 0;
  }

  .profile-info {
    flex: 1;
    min-width: 200px;
    padding-bottom: 8px;
  }
  .username {
    font-size: 28px; font-weight: 800;
    margin: 0 0 4px; letter-spacing: -0.5px;
    color: #ffffff;
  }
  .display { font-size: 15px; opacity: 0.7;
             margin: 0; }

  .badges {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(245,158,11,0.4);
  }

  .stats {
    display: flex; gap: 24px; margin-top: 12px;
    font-size: 14px; opacity: 0.85;
    flex-wrap: wrap;
  }
  .stats span b { color: #fbbf24; font-weight: 800; }

  .follow-btn {
    padding: 14px 28px;
    border: 2px solid rgba(68,170,255,0.6);
    border-radius: 10px;
    background: #4af;
    color: #ffffff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    align-self: center;
    margin-bottom: 8px;
    transition: transform 0.15s, background 0.15s, box-shadow 0.15s, border-color 0.15s;
    box-shadow: 0 4px 20px rgba(68,170,255,0.35);
  }
  .follow-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 28px rgba(68,170,255,0.55);
  }
  .follow-btn.following {
    background: transparent;
    border-color: rgba(255,255,255,0.4);
    color: #ffffff;
    box-shadow: none;
  }
  .follow-btn.following:hover {
    background: rgba(255,255,255,0.1);
    box-shadow: none;
  }

  h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.6;
    margin: 40px 0 16px;
    font-weight: 700;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    padding-bottom: 60px;
  }

  .card {
    background: linear-gradient(180deg,#15152a,#10101e);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: rgba(68,170,255,0.6);
    box-shadow: 0 8px 24px rgba(68,170,255,0.15);
  }

  .thumb { width: 100%; aspect-ratio: 4/3; display: block; }

  .info { padding: 12px 14px; }
  .info h3 {
    margin: 0 0 4px;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    opacity: 0.5;
    font-size: 15px;
  }

  @media (max-width: 600px) {
    .profile-head { align-items: flex-start; }
    .follow-btn { width: 100%; margin-bottom: 0; }
    .username { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="banner"></div>

<div class="container">
  <div class="profile-head">
    <img class="avatar" id="avatar" src="https://via.placeholder.com/110" alt="">
    <div class="profile-info">
      <h1 class="username" id="username">Loading...</h1>
      <p class="display" id="display"></p>
      <div class="badges" id="badges"></div>
      <div class="stats">
        <span><b id="gameCount">0</b> games</span>
        <span><b id="likeCount">0</b> likes</span>
        <span><b id="followerCount">0</b> followers</span>
      </div>
    </div>
    <button class="follow-btn" id="followBtn" style="display:none">Follow</button>
  </div>

  <h2>Games</h2>
  <div class="grid" id="grid"><div class="empty">Loading...</div></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const params = new URLSearchParams(location.search);
const username = (params.get('u') || '').toLowerCase().replace(/^@/, '');

const gridEl = document.getElementById('grid');
const followBtn = document.getElementById('followBtn');
const badgesEl = document.getElementById('badges');

if (!username) {
  document.getElementById('username').textContent = 'No user specified.';
  gridEl.innerHTML = '';
} else {
  document.title = '@' + username + ' — Arcade';

  const { data: profile, error: profileErr } = await supabase
    .from('profiles')
    .select('user_id, username, display_name, avatar_url')
    .eq('username', username)
    .maybeSingle();

  if (profileErr || !profile) {
    document.getElementById('username').textContent = 'User not found.';
    gridEl.innerHTML = '';
  } else {
    document.getElementById('username').textContent = '@' + profile.username;
    document.getElementById('display').textContent = profile.display_name || '';
    if (profile.avatar_url) {
      document.getElementById('avatar').src = profile.avatar_url;
    }

    const { data: games } = await supabase
      .from('games')
      .select('id, slug, title, config')
      .eq('author_id', profile.user_id)
      .order('created_at', { ascending: false });

    const gameList = games || [];
    document.getElementById('gameCount').textContent = gameList.length;

    if (gameList.length > 0) {
      const gameIds = gameList.map(g => g.id);
      const { count: likeTotal } = await supabase
        .from('likes')
        .select('*', { count: 'exact', head: true })
        .in('game_id', gameIds);
      document.getElementById('likeCount').textContent = likeTotal || 0;
    }

    const { count: followerTotal } = await supabase
      .from('follows')
      .select('*', { count: 'exact', head: true })
      .eq('creator_id', profile.user_id);
    document.getElementById('followerCount').textContent = followerTotal || 0;

    // Badge support (optional — will show if weekly_winners table exists)
    try {
      const { data: wins } = await supabase
        .from('weekly_winners')
        .select('week_start')
        .eq('user_id', profile.user_id)
        .order('week_start', { ascending: false })
        .limit(3);

      if (wins && wins.length > 0) {
        badgesEl.innerHTML = wins.map(w => {
          const d = new Date(w.week_start);
          const label = d.toLocaleDateString('en', { month: 'short', day: 'numeric' });
          return '<span class="badge">🏆 Won week of ' + label + '</span>';
        }).join('');
      }
    } catch (e) {
      // weekly_winners table doesn't exist yet — skip silently
    }

    if (gameList.length === 0) {
      gridEl.innerHTML = '<div class="empty">No games yet.</div>';
    } else {
      gridEl.innerHTML = '';
      for (const g of gameList) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = '/arcade/game.html?slug=' + encodeURIComponent(g.slug);
        a.innerHTML = thumbSVG(g.config) +
          '<div class="info"><h3>' + esc(g.title) + '</h3></div>';
        gridEl.appendChild(a);
      }
    }

    const { data: { user } } = await supabase.auth.getUser();

    if (user && user.id !== profile.user_id) {
      followBtn.style.display = 'inline-block';

      const { data: existing } = await supabase
        .from('follows')
        .select('follower_id')
        .eq('follower_id', user.id)
        .eq('creator_id', profile.user_id)
        .maybeSingle();

      if (existing) {
        followBtn.textContent = '✓ Following';
        followBtn.classList.add('following');
      }

      followBtn.onclick = async () => {
        if (existing) {
          await supabase.from('follows').delete()
            .eq('follower_id', user.id)
            .eq('creator_id', profile.user_id);
          location.reload();
        } else {
          await supabase.from('follows').insert({
            follower_id: user.id,
            creator_id: profile.user_id
          });
          location.reload();
        }
      };
    }
  }
}

function thumbSVG(config) {
  const w = 300, h = 225;
  const world = (config && config.world) || { w: 800, h: 600, bg: '#0d0d2a' };
  const slots = (config && config.slots) || [];
  const sx = w / world.w, sy = h / world.h;
  let rects = '';
  for (const s of slots) {
    rects += '<rect x="' + (s.x*sx) + '" y="' + (s.y*sy) +
             '" width="' + (s.w*sx) + '" height="' + (s.h*sy) +
             '" fill="' + (s.color||'#4af') + '" />';
  }
  if (!rects) {
    rects = '<text x="' + (w/2) + '" y="' + (h/2) +
            '" text-anchor="middle" fill="#4af" font-size="40">▶</text>';
  }
  return '<svg class="thumb" viewBox="0 0 ' + w + ' ' + h +
    '" preserveAspectRatio="xMidYMid slice" style="background:' +
    (world.bg||'#0d0d2a') + '">' + rects + '</svg>';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
</script>

</body>
 </html>
