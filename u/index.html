<style>
  :root {
    --bg: #05060c;
    --panel: rgba(18,20,32,0.72);
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --text: #f0f3f8;
    --text-1: #a3aac0;
    --text-2: #6e7589;
    --accent: #6ea8fe;
    --accent-2: #a371f7;
    --accent-3: #ec4899;
    --warning: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    pointer-events: none;
    z-index: 0;
    border-radius: 50%;
  }
  body::before {
    top: -40vh; left: -20vw;
    width: 80vw; height: 80vh;
    background: radial-gradient(circle, rgba(110,168,254,0.12), transparent 60%);
    animation: float1 22s ease-in-out infinite alternate;
  }
  body::after {
    bottom: -40vh; right: -20vw;
    width: 80vw; height: 80vh;
    background: radial-gradient(circle, rgba(163,113,247,0.1), transparent 60%);
    animation: float2 26s ease-in-out infinite alternate;
  }
  @keyframes float1 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(6vw, 6vh); }
  }
  @keyframes float2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-6vw, -6vh); }
  }
  @keyframes sweep {
    0%   { background-position: -200% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes bannerShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spinReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  @keyframes avatarPulse {
    0%, 100% {
      box-shadow:
        0 0 0 4px rgba(5,6,12,1),
        0 0 20px rgba(110,168,254,0.5),
        0 0 40px rgba(163,113,247,0.35),
        0 0 60px rgba(236,72,153,0.2);
    }
    50% {
      box-shadow:
        0 0 0 4px rgba(5,6,12,1),
        0 0 30px rgba(110,168,254,0.8),
        0 0 60px rgba(163,113,247,0.6),
        0 0 90px rgba(236,72,153,0.4);
    }
  }
  @keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .app { position: relative; z-index: 1; }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: rgba(5,6,12,0.72);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(110,168,254,0.5) 20%,
      rgba(163,113,247,0.6) 50%,
      rgba(236,72,153,0.5) 80%,
      transparent 100%);
    background-size: 200% 100%;
    animation: sweep 8s linear infinite;
    opacity: 0.7;
    pointer-events: none;
  }
  .brand-block { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-logo img {
    width: 36px; height: 36px;
    object-fit: contain;
    border-radius: 10px;
    background: var(--bg);
    padding: 3px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 0 18px rgba(110,168,254,0.35);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
  .brand-name {
    font-size: 16px; font-weight: 800; letter-spacing: 1.6px;
    background: linear-gradient(120deg,
      #f0f3f8 0%, #f0f3f8 40%, #6ea8fe 50%,
      #a371f7 60%, #f0f3f8 70%, #f0f3f8 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sweep 9s linear infinite;
  }
  .brand-sub {
    font-size: 9.5px; font-weight: 600;
    letter-spacing: 2.4px;
    color: var(--text-2);
    margin-top: 3px;
  }
  .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-links a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    font-size: 13px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-links a:hover { border-color: var(--border-2); transform: translateY(-1px); background: rgba(255,255,255,0.07); }

  .banner {
    height: 200px;
    background: linear-gradient(135deg,
      #ec4899 0%, #f97316 20%, #facc15 40%,
      #22d3ee 60%, #6366f1 80%, #a371f7 100%);
    background-size: 300% 300%;
    animation: bannerShift 15s ease-in-out infinite;
    position: relative;
    overflow: hidden;
  }
  .banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.15), transparent 40%);
    pointer-events: none;
  }
  .banner::after {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(90deg,
      transparent,
      rgba(255,255,255,0.15),
      transparent);
    transform: rotate(20deg);
    animation: sweep 6s linear infinite;
    pointer-events: none;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  .profile-head {
    margin-top: -75px;
    display: flex;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 44px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
    animation: fadeUp 0.5s ease;
  }

  .avatar-wrap {
    position: relative;
    width: 140px; height: 140px;
    flex-shrink: 0;
  }
  .avatar-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #6ea8fe, #a371f7, #ec4899, #fbbf24, #4ade80, #22d3ee, #6ea8fe);
    animation: spin 8s linear infinite;
    filter: blur(6px);
    opacity: 0.9;
    z-index: 0;
  }
  .avatar-ring-2 {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 90deg,
      #ec4899, #f97316, #facc15, #22d3ee, #6366f1, #a371f7, #ec4899);
    animation: spinReverse 10s linear infinite;
    filter: blur(3px);
    opacity: 0.7;
    z-index: 0;
  }
  .avatar {
    position: relative;
    z-index: 1;
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 4px solid var(--bg);
    background: #15152a;
    object-fit: cover;
    animation: avatarPulse 4s ease-in-out infinite;
  }

  .profile-info { flex: 1; min-width: 200px; padding-bottom: 8px; }
  .username {
    font-size: 30px; font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.5px;
    background: linear-gradient(120deg,
      #f0f3f8 0%, #f0f3f8 35%, #6ea8fe 45%,
      #a371f7 55%, #ec4899 62%, #f0f3f8 72%, #f0f3f8 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sweep 10s linear infinite;
    line-height: 1.1;
  }
  .display { font-size: 15px; color: var(--text-1); margin: 0 0 8px; }

  .stats {
    display: flex; gap: 12px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--text-1);
    flex-wrap: wrap;
  }
  .stat-btn {
    padding: 8px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    font-family: inherit;
    color: inherit;
    font-size: 14px;
    cursor: pointer;
    appearance: none;
  }
  .stat-btn:hover {
    border-color: var(--border-2);
    background: rgba(255,255,255,0.07);
    transform: translateY(-1px);
  }
  .stat-btn b { color: var(--warning); font-weight: 800; font-size: 15px; }
  .stat-btn.active {
    border-color: rgba(110,168,254,0.55);
    background: linear-gradient(135deg, rgba(110,168,254,0.12), rgba(163,113,247,0.12));
    box-shadow: 0 0 20px rgba(110,168,254,0.15);
  }
  .stat-btn.active b { color: #fff; }
  .stat-btn.active .stat-chev {
    transform: rotate(90deg);
  }
  .stat-chev {
    font-size: 11px;
    color: var(--text-2);
    transition: transform 0.25s;
    display: inline-block;
    line-height: 1;
  }

  .follow-btn {
    padding: 14px 30px;
    border: 2px solid rgba(110,168,254,0.6);
    border-radius: 12px;
    background: linear-gradient(135deg, #6ea8fe, #a371f7);
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    align-self: center;
    margin-bottom: 8px;
    transition: all 0.2s;
    box-shadow: 0 8px 24px rgba(110,168,254,0.4);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .follow-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg,
      transparent, rgba(255,255,255,0.3), transparent);
    animation: sweep 3s linear infinite;
  }
  .follow-btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 12px 32px rgba(110,168,254,0.6);
  }
  .follow-btn.following {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.2);
    color: var(--text-1);
    box-shadow: none;
  }
  .follow-btn.following::before { display: none; }
  .follow-btn.following:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
    transform: translateY(-1px);
  }

  h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-2);
    margin: 44px 0 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  .expand-region {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .expand-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.34s ease, margin 0.34s ease;
    overflow: hidden;
    margin-top: 0;
  }
  .expand-panel.open {
    grid-template-rows: 1fr;
    margin-top: 14px;
  }
  .expand-panel-inner {
    overflow: hidden;
    min-height: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-bottom: 0;
    border-top-left-radius: 14px;
    border-top-right-radius: 14px;
  }
  .panel-header-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.3px;
  }
  .panel-header-title .icon {
    font-size: 16px;
  }
  .panel-header-sub {
    font-size: 11.5px;
    color: var(--text-2);
    font-weight: 600;
  }
  .panel-header-action {
    padding: 6px 12px;
    border-radius: 9px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-1);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .panel-header-action:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
    border-color: var(--border-2);
  }

  .panel-list {
    background: linear-gradient(180deg, rgba(21,21,42,0.85), rgba(16,16,30,0.85));
    border: 1px solid var(--border);
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
    padding: 6px;
    backdrop-filter: blur(10px);
  }
  .panel-loading,
  .panel-empty,
  .panel-error {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-2);
    font-size: 13px;
    line-height: 1.5;
  }
  .panel-error { color: #f87171; }

  .panel-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 10px;
    transition: background 0.18s;
  }
  .panel-row:hover { background: rgba(255,255,255,0.045); }
  .panel-row + .panel-row { border-top: 1px solid rgba(255,255,255,0.045); }

  .panel-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #202040;
    border: 2px solid rgba(255,255,255,0.08);
  }
  .panel-avatar-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: #fff;
    font-size: 16px;
    background: linear-gradient(135deg, #6ea8fe, #a371f7);
  }

  .panel-row-content { flex: 1; min-width: 0; }
  .panel-row-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel-row-title a {
    color: var(--warning);
    text-decoration: none;
  }
  .panel-row-title a:hover { text-decoration: underline; }
  .panel-row-meta {
    font-size: 11.5px;
    color: var(--text-2);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .panel-row-meta a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .panel-row-meta a:hover { text-decoration: underline; }

  .panel-row-action {
    flex-shrink: 0;
  }
  .panel-follow-btn {
    padding: 6px 14px;
    border-radius: 9px;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s;
    white-space: nowrap;
    background: rgba(110,168,254,0.12);
    border: 1px solid rgba(110,168,254,0.4);
    color: var(--accent);
  }
  .panel-follow-btn:hover:not(:disabled) {
    background: rgba(110,168,254,0.22);
    border-color: rgba(110,168,254,0.7);
    transform: translateY(-1px);
  }
  .panel-follow-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .panel-follow-btn.following {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.15);
    color: var(--text-2);
  }
  .panel-follow-btn.following:hover {
    background: rgba(248,113,113,0.1);
    border-color: rgba(248,113,113,0.4);
    color: #f87171;
  }

  .panel-show-more {
    display: flex;
    justify-content: center;
    padding: 12px;
  }
  .panel-show-more button {
    padding: 9px 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-2);
    border-radius: 10px;
    color: var(--text-1);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s;
  }
  .panel-show-more button:hover:not(:disabled) {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    transform: translateY(-1px);
  }
  .panel-show-more button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .badges-dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    padding: 14px;
    background: linear-gradient(180deg, rgba(21,21,42,0.85), rgba(16,16,30,0.85));
    border: 1px solid var(--border);
    border-top: 0;
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
    backdrop-filter: blur(10px);
  }

  .badge-card {
    position: relative;
    background: linear-gradient(180deg, rgba(21,21,42,0.85), rgba(16,16,30,0.85));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.22s, box-shadow 0.22s;
    overflow: hidden;
    font-family: inherit;
    color: inherit;
    appearance: none;
  }
  .badge-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--badge-accent, var(--accent));
    opacity: 0.9;
  }
  .badge-card:hover {
    transform: translateY(-4px);
    border-color: var(--badge-accent, var(--accent));
    box-shadow:
      0 12px 32px rgba(0,0,0,0.4),
      0 0 30px color-mix(in srgb, var(--badge-accent, var(--accent)) 25%, transparent);
  }
  .badge-card:active { transform: translateY(-2px) scale(0.99); }
  .badge-card:focus-visible {
    outline: 2px solid var(--badge-accent, var(--accent));
    outline-offset: 2px;
  }

  .badge-card.is-locked {
    filter: grayscale(0.85);
    opacity: 0.72;
  }
  .badge-card.is-locked::before {
    background: rgba(255,255,255,0.15);
  }

  .badge-card.newcomer  { --badge-accent: #4ade80; }
  .badge-card.firstgame { --badge-accent: #6ea8fe; }
  .badge-card.streak    { --badge-accent: #fb923c; }
  .badge-card.loved     { --badge-accent: #ec4899; }
  .badge-card.winner    { --badge-accent: #fbbf24; }
  .badge-card.rising    { --badge-accent: #a371f7; }
  .badge-card.veteran   { --badge-accent: #22d3ee; }
  .badge-card.legend    { --badge-accent: #f472b6; }
  .badge-card.prolific  { --badge-accent: #4ade80; }
  .badge-card.voice     { --badge-accent: #60a5fa; }

  .badge-icon-wrap {
    width: 60px;
    height: 60px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    position: relative;
    flex-shrink: 0;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--badge-accent) 30%, transparent),
      color-mix(in srgb, var(--badge-accent) 12%, transparent));
    border: 1px solid color-mix(in srgb, var(--badge-accent) 45%, transparent);
    box-shadow:
      0 0 20px color-mix(in srgb, var(--badge-accent) 25%, transparent),
      inset 0 0 20px color-mix(in srgb, var(--badge-accent) 8%, transparent);
  }
  .badge-card.is-locked .badge-icon-wrap {
    background: rgba(255,255,255,0.05);
    border: 1px dashed rgba(255,255,255,0.2);
    box-shadow: none;
  }

  .badge-name {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--text);
    margin: 0;
    letter-spacing: -0.1px;
  }
  .badge-hint {
    font-size: 11.5px;
    color: var(--text-2);
    margin: 0;

function getWeekStart(date) {
  const d = new Date(date);
  const day = (d.getUTCDay() + 6) % 7;
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day, 0, 0, 0));
}

function getWeekKey(date) {
  return getWeekStart(date).toISOString().slice(0, 10);
}

function computeBestStreak(gameDates) {
  if (!gameDates || gameDates.length === 0) return 0;
  const weeks = new Set();
  for (const d of gameDates) {
    if (!d) continue;
    weeks.add(getWeekKey(new Date(d)));
  }
  const sorted = Array.from(weeks).sort();
  if (sorted.length === 0) return 0;

  let best = 1;
  let current = 1;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i - 1] + 'T00:00:00Z');
    const curr = new Date(sorted[i] + 'T00:00:00Z');
    const diffDays = Math.round((curr - prev) / 86400000);
    if (diffDays === 7) {
      current++;
      if (current > best) best = current;
    } else {
      current = 1;
    }
  }
  return best;
}

function computeCurrentStreak(gameDates) {
  if (!gameDates || gameDates.length === 0) return 0;
  const weeks = new Set();
  for (const d of gameDates) {
    if (!d) continue;
    weeks.add(getWeekKey(new Date(d)));
  }
  const now = new Date();
  const thisWeek = getWeekKey(now);
  const lastWeek = getWeekKey(new Date(getWeekStart(now).getTime() - 7 * 86400000));

  if (!weeks.has(thisWeek) && !weeks.has(lastWeek)) return 0;

  const startWeek = weeks.has(thisWeek) ? thisWeek : lastWeek;
  let streak = 0;
  let cursor = new Date(startWeek + 'T00:00:00Z');
  while (weeks.has(cursor.toISOString().slice(0, 10))) {
    streak++;
    cursor = new Date(cursor.getTime() - 7 * 86400000);
  }
  return streak;
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  if (s < 2592000) return Math.floor(s / 604800) + 'w ago';
  if (s < 31536000) return Math.floor(s / 2592000) + 'mo ago';
  return Math.floor(s / 31536000) + 'y ago';
}

async function getAccountAgeDays(userId) {
  try {
    const { data: { user } } = await supabase.auth.getUser();
    if (user && user.id === userId && user.created_at) {
      return (Date.now() - new Date(user.created_at).getTime()) / 86400000;
    }
  } catch (e) {}

  const { data: profileRow } = await supabase
    .from('profiles')
    .select('created_at')
    .eq('user_id', userId)
    .maybeSingle();
  if (profileRow && profileRow.created_at) {
    return (Date.now() - new Date(profileRow.created_at).getTime()) / 86400000;
  }
  return null;
}

async function computeBadgesForUser(userId, gameList, totalLikes, totalComments) {
  const badges = [];
  const accountAgeDays = await getAccountAgeDays(userId);

  const isNewcomer = accountAgeDays !== null && accountAgeDays < 14 && gameList.length <= 3;
  const firstGame = gameList.length >= 1;
  const gameDates = gameList.map(g => g.created_at).filter(Boolean);
  const bestStreak = computeBestStreak(gameDates);
  const currentStreak = computeCurrentStreak(gameDates);
  const streakEarned = bestStreak >= 3;
  const lovedEarned = totalLikes >= 50;
  const legendEarned = totalLikes >= 200;
  const risingEarned = gameList.length >= 5;
  const prolificEarned = gameList.length >= 10;
  const voiceEarned = totalComments >= 20;
  const veteranEarned = accountAgeDays !== null && accountAgeDays >= 180;

  let winnerEarned = false;
  let winnerGameTitle = null;
  try {
    const { data: wins } = await supabase
      .from('weekly_winners')
      .select('week_start, likes_at_win, game_id, games ( title, slug )')
      .eq('user_id', userId)
      .order('week_start', { ascending: false })
      .limit(1);
    if (wins && wins.length > 0) {
      winnerEarned = true;
      winnerGameTitle = wins[0].games && wins[0].games.title;
    }
  } catch (e) {}

  badges.push({
    def: BADGE_DEFS.newcomer,
    earned: isNewcomer,
    progress: isNewcomer ? 1 : 0,
    progressTarget: 1,
    progressLabel: isNewcomer
      ? 'Active · day ' + Math.max(1, Math.floor(accountAgeDays || 0)) + ' of 14'
      : 'Welcome period ended'
  });

  badges.push({
    def: BADGE_DEFS.firstgame,
    earned: firstGame,
    progress: Math.min(gameList.length, 1),
    progressTarget: 1,
    progressLabel: gameList.length + ' / 1 game published'
  });

  badges.push({
    def: BADGE_DEFS.streak,
    earned: streakEarned,
    progress: Math.min(currentStreak, 3),
    progressTarget: 3,
    progressLabel: currentStreak + ' / 3 consecutive weeks' +
      (bestStreak > currentStreak ? ' · best: ' + bestStreak : '')
  });

  badges.push({
    def: BADGE_DEFS.loved,
    earned: lovedEarned,
    progress: Math.min(totalLikes, 50),
    progressTarget: 50,
    progressLabel: totalLikes + ' / 50 likes'
  });

  badges.push({
    def: BADGE_DEFS.winner,
    earned: winnerEarned,
    progress: winnerEarned ? 1 : 0,
    progressTarget: 1,
    progressLabel: winnerEarned
      ? 'Won with "' + (winnerGameTitle || 'a game') + '"'
      : 'Not yet — win a week to earn'
  });

  badges.push({
    def: BADGE_DEFS.rising,
    earned: risingEarned,
    progress: Math.min(gameList.length, 5),
    progressTarget: 5,
    progressLabel: gameList.length + ' / 5 games published'
  });

  badges.push({
    def: BADGE_DEFS.prolific,
    earned: prolificEarned,
    progress: Math.min(gameList.length, 10),
    progressTarget: 10,
    progressLabel: gameList.length + ' / 10 games published'
  });

  badges.push({
    def: BADGE_DEFS.voice,
    earned: voiceEarned,
    progress: Math.min(totalComments, 20),
    progressTarget: 20,
    progressLabel: totalComments + ' / 20 comments received'
  });

  badges.push({
    def: BADGE_DEFS.veteran,
    earned: veteranEarned,
    progress: accountAgeDays !== null ? Math.min(Math.floor(accountAgeDays), 180) : 0,
    progressTarget: 180,
    progressLabel: accountAgeDays !== null
      ? Math.floor(accountAgeDays) + ' / 180 days old'
      : 'Unknown account age'
  });

  badges.push({
    def: BADGE_DEFS.legend,
    earned: legendEarned,
    progress: Math.min(totalLikes, 200),
    progressTarget: 200,
    progressLabel: totalLikes + ' / 200 likes'
  });

  return badges;
}

async function computeRarity() {
  try {
    const cached = JSON.parse(localStorage.getItem(RARITY_CACHE_KEY) || 'null');
    if (cached && cached.timestamp && (Date.now() - cached.timestamp) < RARITY_CACHE_TTL) {
      return cached.data;
    }
  } catch (e) {}

  const { data: allGames } = await supabase
    .from('games')
    .select('id, author_id, created_at');
  if (!allGames || allGames.length === 0) return null;

  const gamesByUser = {};
  const gameToAuthor = {};
  for (const g of allGames) {
    if (!g.author_id) continue;
    gameToAuthor[g.id] = g.author_id;
    if (!gamesByUser[g.author_id]) gamesByUser[g.author_id] = [];
    gamesByUser[g.author_id].push(g);
  }

  const totalUsers = Object.keys(gamesByUser).length;
  if (totalUsers < RARITY_MIN_USERS) return null;

  const allGameIds = allGames.map(g => g.id);
  let allLikes = [];
  if (allGameIds.length > 0) {
    const { data: likesData } = await supabase
      .from('likes').select('game_id').in('game_id', allGameIds);
    allLikes = likesData || [];
  }

  const likesByUser = {};
  for (const l of allLikes) {
    const author = gameToAuthor[l.game_id];
    if (!author) continue;
    likesByUser[author] = (likesByUser[author] || 0) + 1;
  }

  const commentsByUser = {};
  try {
    const { data: allComments } = await supabase
      .from('comments').select('game_id').in('game_id', allGameIds);
    if (allComments) {
      for (const c of allComments) {
        const author = gameToAuthor[c.game_id];
        if (!author) continue;
        commentsByUser[author] = (commentsByUser[author] || 0) + 1;
      }
    }
  } catch (e) {}

  const winnerUsers = new Set();
  try {
    const { data: winners } = await supabase.from('weekly_winners').select('user_id');
    if (winners) for (const w of winners) winnerUsers.add(w.user_id);
  } catch (e) {}

  const profileCreatedAt = {};
  const { data: profilesAll } = await supabase.from('profiles').select('user_id, created_at');
  if (profilesAll) for (const p of profilesAll) profileCreatedAt[p.user_id] = p.created_at;

  const counts = {
    newcomer: 0, firstgame: 0, streak: 0, loved: 0, winner: 0,
    rising: 0, prolific: 0, voice: 0, veteran: 0, legend: 0
  };

  for (const userId of Object.keys(gamesByUser)) {
    const games = gamesByUser[userId];
    counts.firstgame++;
    if (games.length >= 5) counts.rising++;
    if (games.length >= 10) counts.prolific++;

    const created = profileCreatedAt[userId];
    if (created) {
      const ageDays = (Date.now() - new Date(created).getTime()) / 86400000;
      if (ageDays < 14 && games.length <= 3) counts.newcomer++;
      if (ageDays >= 180) counts.veteran++;
    }

    const gameDates = games.map(g => g.created_at).filter(Boolean);
    if (computeBestStreak(gameDates) >= 3) counts.streak++;

    const likes = likesByUser[userId] || 0;
    if (likes >= 50) counts.loved++;
    if (likes >= 200) counts.legend++;

    if ((commentsByUser[userId] || 0) >= 20) counts.voice++;
    if (winnerUsers.has(userId)) counts.winner++;
  }

  const rarity = {};
  for (const id of Object.keys(counts)) {
    rarity[id] = totalUsers > 0 ? Math.round((counts[id] / totalUsers) * 1000) / 10 : 0;
  }

  try {
    localStorage.setItem(RARITY_CACHE_KEY, JSON.stringify({
      timestamp: Date.now(), data: rarity
    }));
  } catch (e) {}

  return rarity;
}

function badgeProgressRatio(b) {
  if (b.progress === null || !b.progressTarget || b.progressTarget === 0) return 0;
  return b.progress / b.progressTarget;
}

function pickVisibleBadges(badges) {
  const sorted = [...badges].sort((a, b) => {
    if (a.earned !== b.earned) return a.earned ? -1 : 1;
    const ra = badgeProgressRatio(a);
    const rb = badgeProgressRatio(b);
    if (rb !== ra) return rb - ra;
    return BADGE_ORDER.indexOf(a.def.id) - BADGE_ORDER.indexOf(b.def.id);
  });

  const earnedCount = sorted.filter(b => b.earned).length;

  if (earnedCount === 0) return sorted.slice(0, 2);
  if (earnedCount <= 3) return sorted.slice(0, earnedCount + 1);
  return sorted.slice(0, Math.min(earnedCount, 4));
}

function badgeCardHtml(b, idx) {
  const def = b.def;
  let miniBar = '';
  if (!b.earned && b.progress !== null && b.progressTarget && b.progressTarget > 1) {
    const pctFill = Math.min(100, Math.round((b.progress / b.progressTarget) * 100));
    miniBar = '<div class="badge-progress-mini">' +
      '<div class="badge-progress-mini-fill" style="width:' + pctFill + '%"></div></div>';
  }
  return '<button type="button" class="badge-card ' + def.color +
    (b.earned ? ' is-earned' : ' is-locked') + '" ' +
    'data-badge-id="' + def.id + '" style="animation-delay:' + (idx * 0.03) + 's">' +
    '<span class="badge-status-chip">' + (b.earned ? '✓ Earned' : 'Locked') + '</span>' +
    '<div class="badge-icon-wrap">' + def.icon + '</div>' +
    '<h3 class="badge-name">' + esc(def.name) + '</h3>' +
    '<p class="badge-hint">' + esc(def.hint) + '</p>' +
    miniBar +
  '</button>';
}

function wireBadgeCards(container, badges, rarity) {
  container.querySelectorAll('.badge-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.badgeId;
      const badge = badges.find(b => b.def.id === id);
      if (badge) openBadgeModal(badge, rarity);
    });
  });
}

let badgesExpanded = false;
let badgesEarnedTotal = 0;
let badgesOrdered = [];
let badgesRarity = null;

function renderBadges(badges, rarity) {
  badgesRarity = rarity;

  if (!badges || badges.length === 0) {
    badgesPreview.innerHTML = '<div class="badges-empty">No badges yet.</div>';
    badgesAll.innerHTML = '';
    badgesAll.style.display = 'none';
    document.getElementById('badgeCount').textContent = '0';
    badgesEarnedTotal = 0;
    badgesSeeAll.textContent = 'See all →';
    return;
  }

  badgesOrdered = BADGE_ORDER
    .map(id => badges.find(b => b.def.id === id))
    .filter(Boolean);

  badgesEarnedTotal = badgesOrdered.filter(b => b.earned).length;
  document.getElementById('badgeCount').textContent = badgesEarnedTotal;

  const visible = pickVisibleBadges(badgesOrdered);

  badgesPreview.innerHTML = visible.map((b, i) => badgeCardHtml(b, i)).join('');
  wireBadgeCards(badgesPreview, badgesOrdered, rarity);

  badgesAll.innerHTML = badgesOrdered.map((b, i) => badgeCardHtml(b, i)).join('');
  wireBadgeCards(badgesAll, badgesOrdered, rarity);

  badgesAll.style.display = badgesExpanded ? 'grid' : 'none';
  badgesSeeAll.textContent = badgesExpanded
    ? '↑ See less'
    : (badgesEarnedTotal > 0 ? 'See all ' + badgesEarnedTotal + ' →' : 'See all →');
}

badgesSeeAll.addEventListener('click', (e) => {
  e.stopPropagation();
  badgesExpanded = !badgesExpanded;
  badgesAll.style.display = badgesExpanded ? 'grid' : 'none';
  badgesSeeAll.textContent = badgesExpanded
    ? '↑ See less'
    : (badgesEarnedTotal > 0 ? 'See all ' + badgesEarnedTotal + ' →' : 'See all →');
});

let lastFocusedEl = null;

function openBadgeModal(badge, rarity) {
  const def = badge.def;
  const pct = rarity ? (rarity[def.id] ?? 0) : null;

  badgeModalCard.className = 'badge-modal-card ' + def.color;

  let rarityHtml = '';
  if (pct !== null) {
    const ringPct = Math.max(2, Math.min(100, pct));
    let rarityNote = 'of creators have this badge';
    if (pct <= 5) rarityNote = 'of creators have this — very rare';
    else if (pct <= 15) rarityNote = 'of creators have this — rare';
    else if (pct >= 80) rarityNote = 'of creators have this — common';

    rarityHtml =
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">Rarity</p>' +
        '<div class="badge-modal-rarity">' +
          '<div class="badge-modal-rarity-ring" style="--rarity-pct:' + ringPct + '">' +
            '<span class="badge-modal-rarity-ring-inner">' + pct + '%</span>' +
          '</div>' +
          '<div class="badge-modal-rarity-text">' +
            '<p class="badge-modal-rarity-title">' + pct + '% ' + esc(rarityNote) + '</p>' +
            '<p class="badge-modal-rarity-sub">Across all creators with at least one published game. Cached 24h.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  } else {
    rarityHtml =
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">Rarity</p>' +
        '<div class="badge-modal-rarity">' +
          '<div class="badge-modal-rarity-text">' +
            '<p class="badge-modal-rarity-title">Not enough data yet</p>' +
            '<p class="badge-modal-rarity-sub">Rarity unlocks at ' + RARITY_MIN_USERS + '+ creators with published games.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  let progressHtml = '';
  if (badge.progress !== null && badge.progressTarget && badge.progressTarget > 0) {
    const pctFill = Math.min(100, Math.round((badge.progress / badge.progressTarget) * 100));
    progressHtml =
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">' + (badge.earned ? 'Progress' : 'Your progress') + '</p>' +
        '<div class="badge-modal-progress">' +
          '<div class="badge-modal-progress-top">' +
            '<span class="badge-modal-progress-label">' + esc(badge.progressLabel || '') + '</span>' +
            '<span class="badge-modal-progress-pct">' + pctFill + '%</span>' +
          '</div>' +
          '<div class="badge-modal-progress-bar">' +
            '<div class="badge-modal-progress-fill" style="width:' + pctFill + '%"></div>' +
          '</div>' +
          (badge.earned
            ? '<p class="badge-modal-progress-note">Badge earned. Nice work.</p>'
            : '<p class="badge-modal-progress-note">' + Math.max(0, badge.progressTarget - badge.progress) + ' to go.</p>'
          ) +
        '</div>' +
      '</div>';
  }

  badgeModalCard.innerHTML =
    '<div class="badge-modal-hero">' +
      '<button type="button" class="badge-modal-close" id="badgeModalClose" aria-label="Close">×</button>' +
      '<div class="badge-modal-icon">' + def.icon + '</div>' +
      '<div class="badge-modal-status' + (badge.earned ? '' : ' locked') + '">' +
        (badge.earned ? '✓ Earned' : '🔒 Locked') +
      '</div>' +
      '<h2 class="badge-modal-name">' + esc(def.name) + '</h2>' +
      '<p class="badge-modal-tagline">' + esc(def.tagline) + '</p>' +
    '</div>' +
    '<div class="badge-modal-body">' +
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">What it means</p>' +
        '<p class="badge-modal-desc">' + esc(def.desc) + '</p>' +
      '</div>' +
      progressHtml +
      rarityHtml +
    '</div>';

  lastFocusedEl = document.activeElement;
  badgeModal.classList.add('open');
  badgeModalBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';

  requestAnimationFrame(() => {
    const closeBtn = document.getElementById('badgeModalClose');
    if (closeBtn) closeBtn.focus();
  });
}

function closeBadgeModal() {
  badgeModal.classList.remove('open');
  badgeModalBackdrop.classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') {
    try { lastFocusedEl.focus(); } catch (e) {}
  }
  lastFocusedEl = null;
}

badgeModalBackdrop.addEventListener('click', closeBadgeModal);

badgeModal.addEventListener('click', (e) => {
  if (e.target.closest('#badgeModalClose')) {
    e.preventDefault();
    e.stopPropagation();
    closeBadgeModal();
    return;
  }
  if (e.target === badgeModal) closeBadgeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && badgeModal.classList.contains('open')) {
    closeBadgeModal();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || !badgeModal.classList.contains('open')) return;
  const focusables = badgeModalCard.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  if (focusables.length === 0) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

function profileLinkFor(profileRow) {
  if (!profileRow) return null;
  if (profileRow.username) {
    return '/u/?u=' + encodeURIComponent(profileRow.username);
  }
  return null;
}

function displayNameFor(profileRow) {
  if (!profileRow) return 'anonymous';
  if (profileRow.username) return '@' + profileRow.username;
  if (profileRow.display_name) return profileRow.display_name;
  return 'anonymous';
}

function initialFor(profileRow) {
  let name = '';
  if (profileRow && profileRow.username) name = profileRow.username;
  else if (profileRow && profileRow.display_name) name = profileRow.display_name;
  else name = '?';
  return (name || '?').replace(/^@/, '').trim().charAt(0).toUpperCase() || '?';
}

function renderAvatarHtml(profileRow) {
  if (profileRow && profileRow.avatar_url) {
    return '<img class="panel-avatar" src="' + esc(profileRow.avatar_url) +
      '" alt="" onerror="this.classList.add(\'panel-avatar-fallback\');this.removeAttribute(\'src\');this.textContent=\'' +
      esc(initialFor(profileRow)) + '\'">';
  }
  return '<div class="panel-avatar panel-avatar-fallback">' + esc(initialFor(profileRow)) + '</div>';
}

async function fetchProfilesByIds(userIds) {
  const map = {};
  if (!userIds || userIds.length === 0) return map;
  try {
    const { data } = await supabase
      .from('profiles')
      .select('user_id, username, display_name, avatar_url')
      .in('user_id', userIds);
    if (data) for (const p of data) map[p.user_id] = p;
  } catch (e) {}
  return map;
}

async function fetchFollowerCounts(userIds) {
  const map = {};
  if (!userIds || userIds.length === 0) return map;
  try {
    const { data } = await supabase
      .from('follows')
      .select('creator_id')
      .in('creator_id', userIds);
    if (data) for (const row of data) {
      map[row.creator_id] = (map[row.creator_id] || 0) + 1;
    }
  } catch (e) {}
  return map;
}

function buildFollowersRows(followRows, profilesMap, followerCounts, myFollowingSet) {
  if (!followRows || followRows.length === 0) return '';
  return followRows.map(row => {
    const p = profilesMap[row.follower_id] || null;
    const name = displayNameFor(p);
    const link = profileLinkFor(p);
    const nameHtml = link
      ? '<a href="' + link + '">' + esc(name) + '</a>'
      : esc(name);
    const count = followerCounts[row.follower_id] || 0;
    const isFollowing = myFollowingSet.has(row.follower_id);
    return '<div class="panel-row">' +
      renderAvatarHtml(p) +
      '<div class="panel-row-content">' +
        '<div class="panel-row-title">' + nameHtml + '</div>' +
        '<div class="panel-row-meta">' + count + ' follower' + (count === 1 ? '' : 's') +
          ' · followed ' + esc(timeAgo(row.created_at)) + '</div>' +
      '</div>' +
      '<div class="panel-row-action">' +
        '<button class="panel-follow-btn' + (isFollowing ? ' following' : '') +
          '" data-follow-back="' + esc(row.follower_id) + '" type="button">' +
          (isFollowing ? '✓ Following' : 'Follow back') +
        '</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function buildLikesRows(likeRows, profilesMap, gamesMap) {
  if (!likeRows || likeRows.length === 0) return '';
  return likeRows.map(row => {
    const p = profilesMap[row.user_id] || null;
    const g = gamesMap[row.game_id] || null;
    const name = displayNameFor(p);
    const link = profileLinkFor(p);
    const nameHtml = link
      ? '<a href="' + link + '">' + esc(name) + '</a>'
      : esc(name);
    const gameTitle = g ? g.title : 'a game';
    const gameLink = g && g.slug
      ? '/arcade/game.html?slug=' + encodeURIComponent(g.slug)
      : null;
    const gameHtml = gameLink
      ? '<a href="' + gameLink + '">' + esc(gameTitle) + '</a>'
      : esc(gameTitle);
    return '<div class="panel-row">' +
      renderAvatarHtml(p) +
      '<div class="panel-row-content">' +
        '<div class="panel-row-title">' + nameHtml + ' liked ' + gameHtml + '</div>' +
        '<div class="panel-row-meta">' + esc(timeAgo(row.created_at)) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function wireFollowBackButtons(container, myFollowingSet) {
  container.querySelectorAll('[data-follow-back]').forEach(btn => {
    if (btn.dataset.wired === '1') return;
    btn.dataset.wired = '1';
    btn.addEventListener('click', async () => {
      const targetId = btn.dataset.followBack;
      if (!targetId) return;
      const isFollowing = myFollowingSet.has(targetId);
      btn.disabled = true;
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { btn.disabled = false; return; }
        if (isFollowing) {
          await supabase.from('follows')
            .delete()
            .eq('follower_id', user.id)
            .eq('creator_id', targetId);
          myFollowingSet.delete(targetId);
          btn.textContent = 'Follow back';
          btn.classList.remove('following');
        } else {
          await supabase.from('follows')
            .insert({ follower_id: user.id, creator_id: targetId });
          myFollowingSet.add(targetId);
          btn.textContent = '✓ Following';
          btn.classList.add('following');
        }
      } catch (e) {}
      btn.disabled = false;
    });
  });
}

function appendShowMore(container, loader) {
  if (container.querySelector('.panel-show-more')) return;
  const wrap = document.createElement('div');
  wrap.className = 'panel-show-more';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Show more';
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Loading…';
    const hasMore = await loader();
    if (!hasMore) wrap.remove();
    else {
      btn.disabled = false;
      btn.textContent = 'Show more';
    }
  });
  wrap.appendChild(btn);
  container.appendChild(wrap);
}

let followersLoaded = false;
let likesLoaded = false;

async function loadFollowersPanel(me) {
  if (followersLoaded) return;
  followersLoaded = true;

  const listEl = document.getElementById('followersList');
  const subEl = document.getElementById('followersPanelSub');
  if (!listEl) return;

  let page = 0;
  let allRows = [];
  let profilesMap = {};
  let followerCounts = {};
  const myFollowingSet = new Set();

  async function fetchPage() {
    const from = page * PANEL_PAGE_SIZE;
    const to = from + PANEL_PAGE_SIZE - 1;
    return supabase
      .from('follows')
      .select('follower_id, created_at')
      .eq('creator_id', me.id)
      .order('created_at', { ascending: false })
      .range(from, to);
  }

  try {
    const { data, error } = await fetchPage();
    if (error) throw error;
    allRows = data || [];
  } catch (e) {
    listEl.innerHTML = '<div class="panel-error">Could not load followers.</div>';
    if (subEl) subEl.textContent = 'Could not load';
    return;
  }

  if (allRows.length === 0) {
    listEl.innerHTML = '<div class="panel-empty">No followers yet. Publish more games to get noticed.</div>';
    if (subEl) subEl.textContent = '0 followers';
    return;
  }

  const followerIds = allRows.map(r => r.follower_id).filter(Boolean);
  profilesMap = await fetchProfilesByIds(followerIds);
  followerCounts = await fetchFollowerCounts(followerIds);

  try {
    const { data: myFollows } = await supabase
      .from('follows')
      .select('creator_id')
      .eq('follower_id', me.id)
      .in('creator_id', followerIds);
    if (myFollows) for (const f of myFollows) myFollowingSet.add(f.creator_id);
  } catch (e) {}

  listEl.innerHTML = buildFollowersRows(allRows, profilesMap, followerCounts, myFollowingSet);
  if (subEl) subEl.textContent = allRows.length + ' follower' + (allRows.length === 1 ? '' : 's');
  wireFollowBackButtons(listEl, myFollowingSet);

  if (allRows.length === PANEL_PAGE_SIZE) {
    appendShowMore(listEl, async () => {
      page++;
      const { data, error } = await fetchPage();
      if (error || !data || data.length === 0) return false;
      const newIds = data.map(r => r.follower_id).filter(Boolean);
      const newProfiles = await fetchProfilesByIds(newIds);
      const newCounts = await fetchFollowerCounts(newIds);
      Object.assign(profilesMap, newProfiles);
      Object.assign(followerCounts, newCounts);
      allRows = allRows.concat(data);
      listEl.querySelector('.panel-show-more')?.remove();
      listEl.insertAdjacentHTML('beforeend', buildFollowersRows(data, profilesMap, followerCounts, myFollowingSet));
      if (subEl) subEl.textContent = allRows.length + ' followers';
      wireFollowBackButtons(listEl, myFollowingSet);
      return data.length === PANEL_PAGE_SIZE;
    });
  }
}

async function loadLikesPanel(me, gameList) {
  if (likesLoaded) return;
  likesLoaded = true;

  const listEl = document.getElementById('likesList');
  const subEl = document.getElementById('likesPanelSub');
  if (!listEl) return;

  const gameIds = (gameList || []).map(g => g.id);
  if (gameIds.length === 0) {
    listEl.innerHTML = '<div class="panel-empty">No likes yet.</div>';
    if (subEl) subEl.textContent = 'No likes yet';
    return;
  }

  const gamesMap = {};
  for (const g of gameList) gamesMap[g.id] = g;

  let page = 0;
  let allRows = [];
  let profilesMap = {};

  async function fetchPage() {
    const from = page * PANEL_PAGE_SIZE;
    const to = from + PANEL_PAGE_SIZE - 1;
    return supabase
      .from('likes')
      .select('id, user_id, game_id, created_at')
      .in('game_id', gameIds)
      .not('user_id', 'is', null)
      .order('created_at', { ascending: false })
      .range(from, to);
  }

  try {
    const { data, error } = await fetchPage();
    if (error) throw error;
    allRows = data || [];
  } catch (e) {
    listEl.innerHTML = '<div class="panel-error">Could not load likes.</div>';
    if (subEl) subEl.textContent = 'Could not load';
    return;
  }

  if (allRows.length === 0) {
    listEl.innerHTML = '<div class="panel-empty">No likes yet.</div>';
    if (subEl) subEl.textContent = 'No likes yet';
    return;
  }

  const userIds = [...new Set(allRows.map(r => r.user_id).filter(Boolean))];
  profilesMap = await fetchProfilesByIds(userIds);

  listEl.innerHTML = buildLikesRows(allRows, profilesMap, gamesMap);
  if (subEl) subEl.textContent = allRows.length + ' like' + (allRows.length === 1 ? '' : 's');

  if (allRows.length === PANEL_PAGE_SIZE) {
    appendShowMore(listEl, async () => {
      page++;
      const { data, error } = await fetchPage();
      if (error || !data || data.length === 0) return false;
      const newIds = [...new Set(data.map(r => r.user_id).filter(Boolean))];
      const newProfiles = await fetchProfilesByIds(newIds);
      Object.assign(profilesMap, newProfiles);
      allRows = allRows.concat(data);
      listEl.querySelector('.panel-show-more')?.remove();
      listEl.insertAdjacentHTML('beforeend', buildLikesRows(data, profilesMap, gamesMap));
      if (subEl) subEl.textContent = allRows.length + ' likes';
      return data.length === PANEL_PAGE_SIZE;
    });
  }
}

let openPanelId = null;

function closeAllPanels() {
  expandBadges.classList.remove('open');
  expandFollowers.classList.remove('open');
  expandLikes.classList.remove('open');
  statBadges.classList.remove('active');
  statFollowers.classList.remove('active');
  statLikes.classList.remove('active');
  openPanelId = null;
}

function togglePanel(id) {
  if (openPanelId === id) {
    closeAllPanels();
    return;
  }
  closeAllPanels();
  openPanelId = id;

  if (id === 'badges') {
    expandBadges.classList.add('open');
    statBadges.classList.add('active');
  } else if (id === 'followers') {
    expandFollowers.classList.add('open');
    statFollowers.classList.add('active');
  } else if (id === 'likes') {
    expandLikes.classList.add('open');
    statLikes.classList.add('active');
  }
}

statBadges.addEventListener('click', () => togglePanel('badges'));

statGames.addEventListener('click', () => {
  const heading = document.getElementById('gamesHeading');
  if (heading) heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

async function run() {
  if (!username) {
    document.getElementById('username').textContent = 'No user specified.';
    gridEl.innerHTML = '';
    badgesPreview.innerHTML = '<div class="badges-empty">No user.</div>';
    badgesAll.innerHTML = '';
    return;
  }

  document.title = '@' + username + ' — Limn Arcade';

  const { data: profile, error: profileErr } = await supabase
    .from('profiles')
    .select('user_id, username, display_name, avatar_url, created_at')
    .eq('username', username)
    .maybeSingle();

  if (profileErr || !profile) {
    document.getElementById('username').textContent = 'User not found.';
    gridEl.innerHTML = '';
    badgesPreview.innerHTML = '<div class="badges-empty">User not found.</div>';
    badgesAll.innerHTML = '';
    return;
  }

  const canonicalUrl = 'https://limn-engine-doc.vercel.app/u/?u=' + encodeURIComponent(profile.username);
  document.querySelector('link[rel="canonical"]').setAttribute('href', canonicalUrl);
  document.querySelector('meta[property="og:url"]').setAttribute('content', canonicalUrl);

  const displayName = profile.display_name || profile.username;
  const pageTitle = '@' + profile.username + ' — Limn Arcade';
  const pageDescription = 'Games made by ' + displayName + ' on the Limn Arcade. Browse published games, likes, badges, and weekly leaderboard wins.';

  document.title = pageTitle;
  document.querySelector('meta[property="og:title"]').setAttribute('content', pageTitle);
  document.querySelector('meta[property="og:description"]').setAttribute('content', pageDescription);
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', pageTitle);
  document.querySelector('meta[name="twitter:description"]').setAttribute('content', pageDescription);
  document.querySelector('meta[name="description"]').setAttribute('content', pageDescription);

  if (profile.avatar_url) {
    document.querySelector('meta[property="og:image"]').setAttribute('content', profile.avatar_url);
    document.querySelector('meta[name="twitter:image"]').setAttribute('content', profile.avatar_url);
  }

  document.getElementById('username').textContent = '@' + profile.username;
  document.getElementById('display').textContent = profile.display_name || '';
  if (profile.avatar_url) {
    document.getElementById('avatar').src = profile.avatar_url;
  }

  const { data: games } = await supabase
    .from('games')
    .select('id, slug, title, description, config, created_at')
    .eq('author_id', profile.user_id)
    .order('created_at', { ascending: false });

  const gameList = games || [];
  document.getElementById('gameCount').textContent = gameList.length;

  const gameIds = gameList.map(g => g.id);
  const winnerSet = new Set();
  let totalLikes = 0;
  let totalComments = 0;

  if (gameIds.length > 0) {
    const { count: likeTotal } = await supabase
      .from('likes')
      .select('*', { count: 'exact', head: true })
      .in('game_id', gameIds);
    totalLikes = likeTotal || 0;
    document.getElementById('likeCount').textContent = totalLikes;

    try {
      const { count: commentTotal } = await supabase
        .from('comments')
        .select('*', { count: 'exact', head: true })
        .in('game_id', gameIds);
      totalComments = commentTotal || 0;
    } catch (e) {}

    const { data: wins } = await supabase
      .from('weekly_winners')
      .select('game_id')
      .in('game_id', gameIds);

    if (wins) wins.forEach(w => winnerSet.add(w.game_id));
  }

  const { count: followerTotal } = await supabase
    .from('follows')
    .select('*', { count: 'exact', head: true })
    .eq('creator_id', profile.user_id);
  document.getElementById('followerCount').textContent = followerTotal || 0;

  if (gameList.length === 0) {
    gridEl.innerHTML =
      '<div class="empty">No games yet.<a href="/editor/">Create one →</a></div>';
  } else {
    gridEl.innerHTML = '';
    gameList.forEach((g, i) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.style.animationDelay = (i * 0.05) + 's';
      a.href = '/arcade/game.html?slug=' + encodeURIComponent(g.slug);
      const desc = (g.description || '').trim();
      const crown = winnerSet.has(g.id) ? '<span class="winner-crown">👑</span>' : '';
      a.innerHTML =
        '<div class="thumb-wrap">' + thumbSVG(g) + crown + '</div>' +
        '<div class="info">' +
          '<h3>' + esc(g.title) + '</h3>' +
          '<p>' + (desc ? esc(desc) : 'No description') + '</p>' +
        '</div>';
      gridEl.appendChild(a);
    });
  }

  const schemaEl = document.getElementById('profileSchema');
  if (schemaEl) {
    schemaEl.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "url": canonicalUrl,
      "mainEntity": {
        "@type": "Person",
        "name": displayName,
        "alternateName": '@' + profile.username,
        "url": canonicalUrl,
        "image": profile.avatar_url || undefined,
        "interactionStatistic": [
          {
            "@type": "InteractionCounter",
            "interactionType": "https://schema.org/FollowAction",
            "userInteractionCount": followerTotal || 0
          }
        ]
      },
      "about": gameList.slice(0, 20).map(g => ({
        "@type": "VideoGame",
        "name": g.title,
        "url": "https://limn-engine-doc.vercel.app/arcade/game.html?slug=" + encodeURIComponent(g.slug),
        "description": (g.description || '').slice(0, 200)
      }))
    });
  }

  try {
    const [badges, rarity] = await Promise.all([
      computeBadgesForUser(profile.user_id, gameList, totalLikes, totalComments),
      computeRarity()
    ]);
    renderBadges(badges, rarity);
  } catch (e) {
    console.log('Badge computation failed:', e && e.message);
    badgesPreview.innerHTML = '<div class="badges-empty">Could not load badges.</div>';
    badgesAll.innerHTML = '';
  }

  const { data: { user } } = await supabase.auth.getUser();
  const isOwner = user && user.id === profile.user_id;

  if (isOwner) {
    statFollowers.style.display = 'inline-flex';
    statLikes.style.display = 'inline-flex';

    statFollowers.addEventListener('click', () => togglePanel('followers'));
    statLikes.addEventListener('click', () => togglePanel('likes'));

    loadFollowersPanel(user).catch(() => {});
    loadLikesPanel(user, gameList).catch(() => {});
  }

  if (user && user.id !== profile.user_id) {
    followBtn.style.display = 'inline-block';

    const { data: existing } = await supabase
      .from('follows')
      .select('follower_id')
      .eq('follower_id', user.id)
      .eq('creator_id', profile.user_id)
      .maybeSingle();

    if (existing) {
      followBtn.textContent = '✓ Following';
      followBtn.classList.add('following');
    }

    followBtn.onclick = async () => {
      if (existing) {
        await supabase.from('follows').delete()
          .eq('follower_id', user.id)
          .eq('creator_id', profile.user_id);
      } else {
        await supabase.from('follows').insert({
          follower_id: user.id,
          creator_id: profile.user_id
        });
      }
      location.reload();
    };
  }
}

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function detectTemplate(game) {
  const cfg = game.config || {};
  const title = (game.title || '').toLowerCase();
  const hasSlots = cfg.slots && cfg.slots.length > 0;

  if (hasSlots) {
    const n = cfg.slots.length;
    if (n >= 6) return 'dressup';
    if (n >= 2 && n <= 6) {
      if (title.includes('snake')) return 'snake';
      if (title.includes('shoot') || title.includes('star')) return 'shooter';
      if (title.includes('plat') || title.includes('jump')) return 'platformer';
      if (title.includes('run')) return 'runner';
      if (title.includes('break') || title.includes('brick')) return 'breakout';
      if (title.includes('flap')) return 'flappy';
      if (title.includes('catch')) return 'catch';
      if (title.includes('dodge')) return 'dodge';
      if (title.includes('tank')) return 'tank';
      if (title.includes('dungeon')) return 'dungeon';
      if (title.includes('soccer') || title.includes('football')) return 'soccer';
      if (title.includes('race') || title.includes('car')) return 'race';
      if (title.includes('asteroid')) return 'asteroids';
      if (title.includes('click')) return 'clicker';
      return 'platformer';
    }
  }
  return 'custom';
}

function thumbSVG(game) {
  const w = 300;
  const h = 225;
  const cfg = game.config || {};
  const world = cfg.world || { w: 800, h: 600, bg: '#0d0d2a' };
  const hash = hashString(String(game.id || game.slug || game.title || Math.random()));
  const bg = world.bg || '#0d0d2a';
  const type = detectTemplate(game);

  const palettes = {
    platformer: ['#4f8', '#fd3', '#4af', '#1a2a1a'],
    runner: ['#4af', '#f44', '#333', '#1a1a3a'],
    shooter: ['#050510', '#4af', '#fd3', '#f44'],
    clicker: ['#0d0d2a', '#4af', '#fd3', '#a371f7'],
    breakout: ['#0d0d2a', '#4af', '#ffffff', '#ec4899'],
    flappy: ['#fd3', '#4f8', '#4af', '#0d0d2a'],
    snake: ['#0d0d2a', '#4f8', '#7fffb2', '#f44'],
    catch: ['#0d0d2a', '#4af', '#4f8', '#f44'],
    dodge: ['#0d0d2a', '#4af', '#f44', '#a371f7'],
    tank: ['#0d0d2a', '#4af', '#f44', '#555'],
    dungeon: ['#1a1020', '#4af', '#f44', '#fd3'],
    soccer: ['#0a3d0a', '#4af', '#f44', '#ffffff'],
    race: ['#1a4a1a', '#4af', '#f44', '#333'],
    asteroids: ['#000', '#4af', '#888', '#fd3'],
    dressup: ['#0d0d2a', '#4af', '#fd3', '#f44'],
    custom: ['#6ea8fe', '#a371f7', '#ec4899', '#fbbf24']
  };
  const p = palettes[type] || palettes.custom;
  const uid = 'g' + hash.toString(36);

  return '<svg class="thumb" viewBox="0 0 ' + w + ' ' + h + '" ' +
    'preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
      '<linearGradient id="sky' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + p[0] + '" stop-opacity="0.9"/>' +
        '<stop offset="100%" stop-color="' + bg + '"/>' +
      '</linearGradient>' +
      '<radialGradient id="glow' + uid + '" cx="50%" cy="50%" r="70%">' +
        '<stop offset="0%" stop-color="' + p[1] + '" stop-opacity="0.5"/>' +
        '<stop offset="100%" stop-color="' + p[1] + '" stop-opacity="0"/>' +
      '</radialGradient>' +
    '</defs>' +
    '<rect width="' + w + '" height="' + h + '" fill="url(#sky' + uid + ')"/>' +
    '<rect width="' + w + '" height="' + h + '" fill="url(#glow' + uid + ')"/>' +
    renderScene(type, w, h, p, hash) +
    '</svg>';
}

function renderScene(type, w, h, p, hash) {
  const h2 = hashString(type + hash);
  const c1 = p[1], c2 = p[2], c3 = p[3];
  let art = '';

  if (type === 'platformer') {
    const groundY = h * 0.8;
    art += '<rect x="0" y="' + groundY + '" width="' + w + '" height="' + (h - groundY) + '" fill="' + c3 + '"/>';
    art += '<rect x="' + (w * 0.55) + '" y="' + (groundY - 30) + '" width="60" height="12" fill="' + c3 + '"/>';
    art += '<rect x="' + (w * 0.15) + '" y="' + (groundY - 60) + '" width="50" height="12" fill="' + c3 + '"/>';
    const px = w * 0.3 + (h2 % 40);
    art += '<rect x="' + px + '" y="' + (groundY - 26) + '" width="18" height="22" fill="' + c1 + '" rx="2"/>';
    art += '<rect x="' + (px + 5) + '" y="' + (groundY - 32) + '" width="8" height="8" fill="#fdd" rx="1"/>';
    [[0.6, 0.35], [0.72, 0.28], [0.85, 0.35]].forEach(([cx, cy]) => {
      art += '<circle cx="' + (w * cx) + '" cy="' + (h * cy) + '" r="6" fill="' + c2 + '"/>';
      art += '<circle cx="' + (w * cx) + '" cy="' + (h * cy) + '" r="3" fill="#fff" opacity="0.6"/>';
    });
  } else if (type === 'runner') {
    art += '<rect x="0" y="' + (h * 0.85) + '" width="' + w + '" height="' + (h * 0.15) + '" fill="' + c2 + '"/>';
    for (let i = 0; i < 6; i++) {
      art += '<rect x="' + (i * 55) + '" y="' + (h * 0.5) + '" width="40" height="20" fill="' + c1 + '" opacity="' + (0.3 + i * 0.1) + '"/>';
    }
    art += '<rect x="' + (w * 0.25) + '" y="' + (h * 0.72) + '" width="20" height="24" fill="' + c1 + '" rx="2"/>';
    art += '<rect x="' + (w * 0.7) + '" y="' + (h * 0.68) + '" width="24" height="32" fill="' + c2 + '" rx="2"/>';
  } else if (type === 'shooter') {
    for (let i = 0; i < 30; i++) {
      const sx = (hashString('s' + i + hash) % w);
      const sy = (hashString('y' + i + hash) % h);
      const sr = 1 + (hashString('r' + i) % 2);
      art += '<circle cx="' + sx + '" cy="' + sy + '" r="' + sr + '" fill="#fff" opacity="0.7"/>';
    }
    art += '<rect x="' + (w * 0.45) + '" y="' + (h * 0.75) + '" width="30" height="30" fill="' + c1 + '" rx="3"/>';
    art += '<rect x="' + (w * 0.5) + '" y="' + (h * 0.55) + '" width="6" height="18" fill="' + c2 + '"/>';
    art += '<rect x="' + (w * 0.25) + '" y="' + (h * 0.25) + '" width="26" height="26" fill="' + c3 + '" rx="3"/>';
    art += '<rect x="' + (w * 0.7) + '" y="' + (h * 0.2) + '" width="26" height="26" fill="' + c3 + '" rx="3"/>';
  } else if (type === 'snake') {
    const cell = 24;
    for (let i = 0; i < w / cell; i++) {
      for (let j = 0; j < h / cell; j++) {
        art += '<rect x="' + (i * cell) + '" y="' + (j * cell) + '" width="' + (cell - 1) + '" height="' + (cell - 1) + '" fill="#0d0d2a" opacity="0.3"/>';
      }
    }
    const path = [[3, 8], [4, 8], [5, 8], [5, 7], [5, 6], [6, 6], [7, 6], [7, 5]];
    path.forEach((seg, i) => {
      art += '<rect x="' + (seg[0] * cell + 1) + '" y="' + (seg[1] * cell + 1) + '" width="' + (cell - 2) + '" height="' + (cell - 2) + '" fill="' + (i === 0 ? c2 : c1) + '" rx="3"/>';
    });
    art += '<circle cx="' + (10 * cell + cell / 2) + '" cy="' + (6 * cell + cell / 2) + '" r="6" fill="' + c3 + '"/>';
  } else if (type === 'breakout') {
    const bw = 30, bh = 10, rows = 4, cols = Math.floor(w / bw) - 1;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        art += '<rect x="' + (15 + c * bw) + '" y="' + (30 + r * (bh + 4)) + '" width="' + (bw - 4) + '" height="' + bh + '" fill="' + (r < 2 ? c3 : c1) + '" rx="2"/>';
      }
    }
    art += '<rect x="' + (w * 0.4) + '" y="' + (h - 30) + '" width="60" height="10" fill="' + c1 + '" rx="5"/>';
    art += '<circle cx="' + (w * 0.5) + '" cy="' + (h - 55) + '" r="7" fill="#fff"/>';
  } else if (type === 'flappy') {
    art += '<rect x="' + (w * 0.4) + '" y="0" width="40" height="' + (h * 0.35) + '" fill="' + c2 + '" rx="4"/>';
    art += '<rect x="' + (w * 0.4) + '" y="' + (h * 0.6) + '" width="40" height="' + (h * 0.4) + '" fill="' + c2 + '" rx="4"/>';
    art += '<circle cx="' + (w * 0.25) + '" cy="' + (h * 0.45) + '" r="14" fill="' + c1 + '"/>';
    art += '<circle cx="' + (w * 0.22) + '" cy="' + (h * 0.42) + '" r="4" fill="#fff"/>';
    art += '<circle cx="' + (w * 0.22) + '" cy="' + (h * 0.42) + '" r="2" fill="#000"/>';
  } else if (type === 'catch') {
    art += '<rect x="' + (w * 0.35) + '" y="' + (h - 40) + '" width="80" height="20" fill="' + c1 + '" rx="4"/>';
    [[0.3, 0.2], [0.5, 0.35], [0.7, 0.25], [0.4, 0.5]].forEach(([fx, fy]) => {
      art += '<circle cx="' + (w * fx) + '" cy="' + (h * fy) + '" r="10" fill="' + c2 + '"/>';
    });
    art += '<circle cx="' + (w * 0.65) + '" cy="' + (h * 0.55) + '" r="10" fill="' + c3 + '"/>';
  } else if (type === 'dodge') {
    art += '<circle cx="' + (w * 0.5) + '" cy="' + (h * 0.5) + '" r="14" fill="' + c1 + '"/>';
    [[0.15, 0.2], [0.85, 0.3], [0.3, 0.75], [0.75, 0.8], [0.5, 0.15]].forEach(([bx, by]) => {
      art += '<rect x="' + (w * bx - 12) + '" y="' + (h * by - 12) + '" width="24" height="24" fill="' + c2 + '" rx="3"/>';
    });
  } else if (type === 'tank') {
    art += '<rect x="0" y="' + (h * 0.7) + '" width="' + w + '" height="' + (h * 0.3) + '" fill="#1a1a2a"/>';
    art += '<rect x="' + (w * 0.2) + '" y="' + (h * 0.3) + '" width="30" height="80" fill="' + c3 + '" rx="3"/>';
    art += '<rect x="' + (w * 0.7) + '" y="' + (h * 0.3) + '" width="30" height="80" fill="' + c3 + '" rx="3"/>';
    art += '<rect x="' + (w * 0.42) + '" y="' + (h * 0.75) + '" width="40" height="30" fill="' + c1 + '" rx="4"/>';
    art += '<rect x="' + (w * 0.48) + '" y="' + (h * 0.6) + '" width="10" height="20" fill="' + c1 + '"/>';
  } else if (type === 'dungeon') {
    art += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#1a1020"/>';
    for (let i = 0; i < 4; i++) {
      art += '<rect x="' + (i * 70 + 20) + '" y="' + (h - 40) + '" width="60" height="40" fill="#3a2a4a"/>';
    }
    art += '<rect x="' + (w * 0.15) + '" y="' + (h * 0.3) + '" width="30" height="30" fill="' + c1 + '" rx="4"/>';
    art += '<rect x="' + (w * 0.5) + '" y="' + (h * 0.4) + '" width="26" height="26" fill="' + c3 + '" rx="3"/>';
  } else if (type === 'soccer') {
    art += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#0a3d0a"/>';
    art += '<rect x="' + (w / 2 - 1) + '" y="0" width="2" height="' + h + '" fill="#fff" opacity="0.6"/>';
    art += '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="30" fill="none" stroke="#fff" stroke-width="2" opacity="0.6"/>';
    art += '<rect x="20" y="' + (h / 2 - 40) + '" width="10" height="80" fill="' + c1 + '" rx="4"/>';
    art += '<rect x="' + (w - 30) + '" y="' + (h / 2 - 40) + '" width="10" height="80" fill="' + c2 + '" rx="4"/>';
    art += '<circle cx="' + (w * 0.6) + '" cy="' + (h * 0.5) + '" r="10" fill="#fff"/>';
  } else if (type === 'race') {
    art += '<rect x="' + (w * 0.15) + '" y="0" width="' + (w * 0.7) + '" height="' + h + '" fill="#333"/>';
    for (let i = 0; i < 8; i++) {
      art += '<rect x="' + (w / 2 - 3) + '" y="' + (i * 30) + '" width="6" height="15" fill="#fff"/>';
    }
    art += '<rect x="' + (w * 0.3) + '" y="' + (h * 0.75) + '" width="40" height="30" fill="' + c1 + '" rx="4"/>';
    art += '<rect x="' + (w * 0.6) + '" y="' + (h * 0.25) + '" width="40" height="30" fill="' + c2 + '" rx="4"/>';
  } else if (type === 'asteroids') {
    for (let i = 0; i < 40; i++) {
      const sx = (hashString('a' + i + hash) % w);
      const sy = (hashString('b' + i + hash) % h);
      art += '<circle cx="' + sx + '" cy="' + sy + '" r="1.5" fill="#fff"/>';
    }
    art += '<circle cx="' + (w * 0.3) + '" cy="' + (h * 0.35) + '" r="20" fill="' + c2 + '" opacity="0.9"/>';
    art += '<circle cx="' + (w * 0.7) + '" cy="' + (h * 0.6) + '" r="16" fill="' + c2 + '" opacity="0.9"/>';
    art += '<polygon points="' + (w * 0.5) + ',' + (h * 0.7) + ' ' + (w * 0.5 - 12) + ',' + (h * 0.85) + ' ' + (w * 0.5 + 12) + ',' + (h * 0.85) + '" fill="' + c1 + '"/>';
  } else if (type === 'clicker') {
    art += '<rect x="' + (w / 2 - 30) + '" y="' + (h / 2 - 30) + '" width="60" height="60" fill="' + c1 + '" rx="8"/>';
    art += '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="15" fill="' + c2 + '" opacity="0.7"/>';
    art += '<text x="' + (w / 2) + '" y="' + (h / 2 + 6) + '" text-anchor="middle" font-size="20" fill="#fff">👆</text>';
  } else if (type === 'dressup') {
    art += '<rect x="' + (w / 2 - 20) + '" y="30" width="40" height="20" fill="' + c1 + '" rx="4"/>';
    art += '<circle cx="' + (w / 2) + '" cy="70" r="20" fill="' + c2 + '"/>';
    art += '<rect x="' + (w / 2 - 25) + '" y="95" width="50" height="55" fill="' + c3 + '" rx="6"/>';
    art += '<rect x="' + (w / 2 - 22) + '" y="155" width="20" height="30" fill="' + c2 + '" rx="4"/>';
    art += '<rect x="' + (w / 2 + 2) + '" y="155" width="20" height="30" fill="' + c2 + '" rx="4"/>';
  } else {
    const shapeStyle = hash % 4;
    if (shapeStyle === 0) {
      for (let i = 0; i < 5; i++) {
        art += '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="' + (20 + i * 18) + '" fill="none" stroke="' + c1 + '" stroke-width="2" opacity="' + (0.8 - i * 0.13) + '"/>';
      }
      art += '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="18" fill="' + c2 + '"/>';
    } else if (shapeStyle === 1) {
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const x = w / 2 + Math.cos(a) * 70;
        const y = h / 2 + Math.sin(a) * 60;
        art += '<polygon points="' + x + ',' + (y - 30) + ' ' + (x + 30) + ',' + (y + 25) + ' ' + (x - 30) + ',' + (y + 25) + '" fill="' + (i % 2 ? c1 : c2) + '" opacity="0.85"/>';
      }
    } else if (shapeStyle === 2) {
      for (let i = 0; i < 3; i++) {
        const r = 40 + i * 30;
        art += '<rect x="' + (w / 2 - r) + '" y="' + (h / 2 - r * 0.6) + '" width="' + (r * 2) + '" height="' + (r * 1.2) + '" fill="' + (i % 2 ? c1 : c2) + '" opacity="' + (0.5 + i * 0.15) + '" rx="12" transform="rotate(' + (i * 20) + ' ' + (w / 2) + ' ' + (h / 2) + ')"/>';
      }
    } else {
      art += '<path d="M ' + (w * 0.2) + ' ' + (h * 0.7) + ' Q ' + (w * 0.5) + ' ' + (h * 0.1) + ' ' + (w * 0.8) + ' ' + (h * 0.7) + ' Z" fill="' + c1 + '" opacity="0.85"/>';
      art += '<path d="M ' + (w * 0.35) + ' ' + (h * 0.8) + ' Q ' + (w * 0.5) + ' ' + (h * 0.4) + ' ' + (w * 0.65) + ' ' + (h * 0.8) + ' Z" fill="' + c2 + '" opacity="0.9"/>';
    }
  }
  return art;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

run();
</script>
