<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox — Limn</title>
<style>
  :root {
    --bg: #05060c;
    --bg-1: #0a0c16;
    --surface: rgba(18,20,32,0.75);
    --muted: #6e7589;
    --text: #f0f3f8;
    --text-1: #a3aac0;
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --accent: #6ea8fe;
    --accent2: #4ade80;
    --accent-2: #a371f7;
    --warning: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    pointer-events: none;
    z-index: 0;
    border-radius: 50%;
  }
  body::before {
    top: -40vh; left: -20vw;
    width: 80vw; height: 80vh;
    background: radial-gradient(circle, rgba(110,168,254,0.12), transparent 60%);
    animation: float1 22s ease-in-out infinite alternate;
  }
  body::after {
    bottom: -40vh; right: -20vw;
    width: 80vw; height: 80vh;
    background: radial-gradient(circle, rgba(163,113,247,0.1), transparent 60%);
    animation: float2 26s ease-in-out infinite alternate;
  }
  @keyframes float1 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(6vw, 6vh); }
  }
  @keyframes float2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-6vw, -6vh); }
  }
  @keyframes sweep {
    0%   { background-position: -200% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes logoBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes floatUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .app { position: relative; z-index: 1; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: rgba(5,6,12,0.72);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  header.top::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(110,168,254,0.5) 20%,
      rgba(163,113,247,0.6) 50%,
      rgba(236,72,153,0.5) 80%,
      transparent 100%);
    background-size: 200% 100%;
    animation: sweep 8s linear infinite;
    opacity: 0.7;
    pointer-events: none;
  }
  .brand-block { display: flex; align-items: center; gap: 12px; }
  .brand-logo {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    animation: logoBob 5s ease-in-out infinite;
  }
  .brand-logo img {
    width: 36px; height: 36px;
    object-fit: contain;
    border-radius: 10px;
    background: var(--bg);
    padding: 3px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 0 18px rgba(110,168,254,0.35);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
  .brand-name {
    font-size: 16px; font-weight: 800; letter-spacing: 1.6px;
    background: linear-gradient(120deg,
      #f0f3f8 0%, #f0f3f8 40%, #6ea8fe 50%,
      #a371f7 60%, #f0f3f8 70%, #f0f3f8 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sweep 9s linear infinite;
  }
  .brand-sub {
    font-size: 9.5px; font-weight: 600;
    letter-spacing: 2.4px;
    color: var(--muted);
    margin-top: 3px;
  }
  .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-links a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    font-size: 13px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-links a:hover {
    border-color: var(--border-2);
    transform: translateY(-1px);
    background: rgba(255,255,255,0.07);
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .page-head-left { min-width: 0; flex: 1; }
  .page-head h1 {
    margin: 0 0 6px;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.8px;
    line-height: 1.1;
    background: linear-gradient(120deg,
      #f0f3f8 0%, #f0f3f8 35%, #6ea8fe 45%,
      #a371f7 55%, #ec4899 62%, #f0f3f8 72%, #f0f3f8 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sweep 10s linear infinite;
  }
  .page-head p {
    margin: 0;
    color: var(--text-1);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .search-wrap { position: relative; margin-bottom: 24px; }
  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.5;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 14px 18px 14px 46px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  .search-wrap input:focus {
    border-color: rgba(110,168,254,0.6);
    box-shadow: 0 0 0 4px rgba(110,168,254,0.15);
  }
  .search-wrap input::placeholder { color: var(--muted); }

  #notifications-list > div {
    animation: floatUp 0.4s ease backwards;
  }

  #notifications-list > div:hover {
    transform: translateY(-2px);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  #notifications-list a {
    transition: all 0.15s;
  }
  #notifications-list a:hover {
    background: rgba(110,168,254,0.08) !important;
    border-color: rgba(110,168,254,0.4) !important;
    transform: translateX(2px);
  }

  #notifications-list button {
    transition: filter 0.15s, transform 0.1s;
  }
  #notifications-list button:hover { filter: brightness(1.15); }
  #notifications-list button:active { transform: scale(0.97); }

  footer {
    margin-top: 40px;
    padding: 30px 24px 40px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }
  .footer-logo-wrap {
    position: relative;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .footer-logo-wrap::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 16px;
    background: conic-gradient(from 0deg,
      #6ea8fe, #a371f7, #ec4899, #fbbf24, #4ade80, #6ea8fe);
    animation: spin 7s linear infinite;
    filter: blur(8px);
    opacity: 0.7;
    z-index: 0;
  }
  .footer-logo-wrap img {
    position: relative;
    z-index: 1;
    width: 46px;
    height: 46px;
    object-fit: contain;
    border-radius: 12px;
    background: var(--bg);
    padding: 4px;
  }
  .footer-text {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .footer-text strong {
    color: var(--text-1);
    font-weight: 700;
  }

  @media (max-width: 750px) {
    header.top { padding: 12px 16px; gap: 12px; }
    .brand-logo { width: 36px; height: 36px; }
    .brand-logo img { width: 32px; height: 32px; }
    .brand-name { font-size: 14px; letter-spacing: 1.4px; }
    .brand-sub { font-size: 8.5px; letter-spacing: 2px; }
    .nav-links a { padding: 7px 10px; font-size: 12px; }

    main { padding: 22px 16px 40px; }
    .page-head h1 { font-size: 26px; }
    .page-head p { font-size: 13px; }

    #notifications-list > div {
      padding: 18px !important;
    }

    footer { padding: 24px 16px 30px; }
    .footer-logo-wrap { width: 44px; height: 44px; }
    .footer-logo-wrap img { width: 38px; height: 38px; }
  }
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand-block">
    <div class="brand-logo">
      <img src="/editor/logo.png" alt="Limn" />
    </div>
    <div class="brand-text">
      <div class="brand-name">LIMN INBOX</div>
      <div class="brand-sub">UPDATES · NEWS · HIGHLIGHTS</div>
    </div>
  </div>
  <div class="nav-links">
    <a href="/arcade/">🏠 Arcade</a>
    <a href="/my-games.html">📁 My Games</a>
    <a href="/arcade/leaderboard.html">🏆 Leaderboard</a>
    <a href="/editor/">+ New</a>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="page-head-left">
      <h1>💌 Your Inbox</h1>
      <p>Catch up on all the latest updates and community creations.</p>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search updates..." autocomplete="off" />
  </div>

  <div id="notifications-list"></div>
</main>

<footer>
  <div class="footer-logo-wrap">
    <img src="/editor/logo.png" alt="Limn" />
  </div>
  <div class="footer-text">Powered by <strong>LIMN</strong></div>
</footer>

</div>

<script type="module" src="inbox.js"></script>

</body>
</html>
