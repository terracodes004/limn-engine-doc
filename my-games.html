<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Games — Limn</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a14; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh; }

  header { padding: 24px 32px;
           border-bottom: 1px solid rgba(255,255,255,0.12); }
  header h1 { margin: 0 0 4px; font-size: 24px;
              letter-spacing: -0.5px; }
  header p { margin: 0; opacity: 0.7; font-size: 14px; }

  main { padding: 32px; max-width: 1200px; margin: 0 auto; }

  .grid { display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 18px; }

  .card {
    background: linear-gradient(180deg,#15152a,#10101e);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: rgba(68,170,255,0.6);
    box-shadow: 0 8px 24px rgba(68,170,255,0.15);
  }

  .thumb { width: 100%; aspect-ratio: 4/3; display: block; }

  .info { padding: 14px 16px; }
  .info h3 { margin: 0 0 6px; font-size: 15px;
             white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }

  .stats { font-size: 12px; opacity: 0.85;
           display: flex; gap: 14px;
           font-weight: 600;
           color: #fbbf24; }
  .stats span { display: inline-flex; align-items: center; gap: 4px; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 100px 20px;
    opacity: 0.6;
    font-size: 15px;
  }
  .empty a {
    color: #fbbf24;
    text-decoration: none;
    font-weight: 700;
  }
  .empty a:hover { text-decoration: underline; }

  .err {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: #f87171;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>My Games</h1>
  <p id="subtitle">Loading...</p>
</header>

<main>
  <div class="grid" id="grid">
    <div class="empty">Loading your games...</div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const grid = document.getElementById('grid');
const subtitle = document.getElementById('subtitle');

async function boot() {
  let user = null;
  try {
    const result = await supabase.auth.getUser();
    user = result.data ? result.data.user : null;
  } catch (e) {
    console.log('Auth failed:', e.message);
  }

  if (!user) {
    subtitle.textContent = 'Log in to see your games.';
    grid.innerHTML = '<div class="empty"><a href="/signup">Sign in →</a></div>';
    return;
  }

  const { data: games, error } = await supabase
    .from('games')
    .select('id, slug, title, config, plays, created_at')
    .eq('author_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    subtitle.textContent = 'Failed to load games.';
    grid.innerHTML = '<div class="err">' + esc(error.message) + '</div>';
    return;
  }

  const list = games || [];
  subtitle.textContent = list.length + ' game' + (list.length === 1 ? '' : 's') + ' published';

  if (list.length === 0) {
    grid.innerHTML =
      '<div class="empty">' +
        '<p style="margin:0 0 12px 0">No games yet.</p>' +
        '<p style="margin:0"><a href="/editor/">Make your first →</a></p>' +
      '</div>';
    return;
  }

  const ids = list.map(g => g.id);

  const likesRes = await supabase
    .from('likes')
    .select('game_id')
    .in('game_id', ids);

  const commentsRes = await supabase
    .from('comments')
    .select('game_id')
    .in('game_id', ids);

  const lc = {}, cc = {};
  for (const l of likesRes.data || []) lc[l.game_id] = (lc[l.game_id] || 0) + 1;
  for (const c of commentsRes.data || []) cc[c.game_id] = (cc[c.game_id] || 0) + 1;

  grid.innerHTML = '';
  for (const g of list) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '/arcade/game.html?slug=' + encodeURIComponent(g.slug);
    a.innerHTML =
      thumbSVG(g.config) +
      '<div class="info">' +
        '<h3>' + esc(g.title) + '</h3>' +
        '<div class="stats">' +
          '<span>♥ ' + (lc[g.id] || 0) + '</span>' +
          '<span>💬 ' + (cc[g.id] || 0) + '</span>' +
          '<span>▶ ' + (g.plays || 0) + '</span>' +
        '</div>' +
      '</div>';
    grid.appendChild(a);
  }
}

function thumbSVG(config) {
  const w = 300, h = 225;
  const world = (config && config.world) || { w: 800, h: 600, bg: '#0d0d2a' };
  const slots = (config && config.slots) || [];
  const sx = w / world.w, sy = h / world.h;

  let rects = '';
  for (const s of slots) {
    rects += '<rect x="' + (s.x * sx) + '" y="' + (s.y * sy) +
             '" width="' + (s.w * sx) + '" height="' + (s.h * sy) +
             '" fill="' + (s.color || '#4af') + '" />';
  }

  if (!rects) {
    rects = '<text x="' + (w / 2) + '" y="' + (h / 2) +
            '" text-anchor="middle" fill="#4af" font-size="40">▶</text>';
  }

  return '<svg class="thumb" viewBox="0 0 ' + w + ' ' + h +
    '" preserveAspectRatio="xMidYMid slice" style="background:' +
    (world.bg || '#0d0d2a') + '">' + rects + '</svg>';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

boot();
</script>

</body>
     </html>
