<html lang="en">

<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh;
         background:
           radial-gradient(circle at 15% 15%, rgba(255, 0, 128, 0.22), transparent 45%),
           radial-gradient(circle at 85% 20%, rgba(0, 204, 255, 0.2), transparent 45%),
           radial-gradient(circle at 20% 85%, rgba(124, 58, 237, 0.24), transparent 45%),
           radial-gradient(circle at 85% 90%, rgba(57, 255, 20, 0.14), transparent 45%),
           linear-gradient(135deg, #0a0a1e 0%, #150a2a 50%, #0a0a1e 100%);
         background-attachment: fixed; }

  .hero {
    position: relative;
    padding: 44px 32px 36px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    background: linear-gradient(135deg,
      #ec4899 0%,
      #f97316 22%,
      #facc15 44%,
      #22d3ee 66%,
      #6366f1 100%);
    background-size: 200% 200%;
    animation: heroRainbow 12s ease infinite;
  }
  @keyframes heroRainbow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .hero::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 150%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      transparent 40%,
      rgba(255, 255, 255, 0.35) 50%,
      transparent 60%,
      transparent 100%
    );
    animation: lightSweep 6s ease-in-out infinite;
    animation-delay: 1s;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes lightSweep {
    0%, 40%   { left: -150%; }
    60%, 100% { left: 150%; }
  }

  .hero-inner {
    position: relative;
    z-index: 3;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero h1 {
    margin: 0 0 6px;
    font-size: 34px;
    letter-spacing: -0.8px;
    color: #ffffff;
    font-weight: 900;
    text-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .hero p {
    margin: 0;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .hero-actions {
    display: flex;
    gap: 8px;
  }
  .hero-actions a {
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .hero-actions a.primary {
    background: #0a0a1e;
    color: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }
  .hero-actions a.primary:hover {
    transform: translateY(-2px);
    background: #1a1a3e;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  .hero-actions a.ghost {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(8px);
  }
  .hero-actions a.ghost:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-2px);
  }

  .stats-bar {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 32px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat-pill {
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .stat-pill .num {
    font-weight: 800;
    color: #fbbf24;
    font-size: 16px;
  }
  .stat-pill .lbl {
    opacity: 0.65;
  }

  .badges-bar {
    max-width: 1200px;
    margin: 20px auto 0;
    padding: 0 32px;
    display: none;
  }
  .badges-bar.on { display: block; }
  .badges-bar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .badges-bar-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 800;
    color: rgba(255,255,255,0.6);
  }
  .badges-bar-toggle {
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .badges-bar-toggle:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }

  .badges-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }

  .badge-card {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.22s, box-shadow 0.22s;
    overflow: hidden;
    font-family: inherit;
    color: inherit;
    appearance: none;
  }
  .badge-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--badge-accent, #6ea8fe);
    opacity: 0.9;
  }
  .badge-card:hover {
    transform: translateY(-4px);
    border-color: var(--badge-accent, #6ea8fe);
    box-shadow:
      0 12px 32px rgba(0,0,0,0.4),
      0 0 30px color-mix(in srgb, var(--badge-accent, #6ea8fe) 25%, transparent);
  }
  .badge-card:active { transform: translateY(-2px) scale(0.99); }
  .badge-card:focus-visible {
    outline: 2px solid var(--badge-accent, #6ea8fe);
    outline-offset: 2px;
  }
  .badge-card.is-locked {
    filter: grayscale(0.85);
    opacity: 0.72;
  }
  .badge-card.is-locked::before {
    background: rgba(255,255,255,0.15);
  }

  .badge-card.newcomer  { --badge-accent: #4ade80; }
  .badge-card.firstgame { --badge-accent: #6ea8fe; }
  .badge-card.streak    { --badge-accent: #fb923c; }
  .badge-card.loved     { --badge-accent: #ec4899; }
  .badge-card.winner    { --badge-accent: #fbbf24; }
  .badge-card.rising    { --badge-accent: #a371f7; }
  .badge-card.veteran   { --badge-accent: #22d3ee; }
  .badge-card.legend    { --badge-accent: #f472b6; }
  .badge-card.prolific  { --badge-accent: #4ade80; }
  .badge-card.voice     { --badge-accent: #60a5fa; }

  .badge-icon-wrap {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    position: relative;
    flex-shrink: 0;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--badge-accent) 30%, transparent),
      color-mix(in srgb, var(--badge-accent) 12%, transparent));
    border: 1px solid color-mix(in srgb, var(--badge-accent) 45%, transparent);
    box-shadow:
      0 0 20px color-mix(in srgb, var(--badge-accent) 25%, transparent),
      inset 0 0 20px color-mix(in srgb, var(--badge-accent) 8%, transparent);
  }
  .badge-card.is-locked .badge-icon-wrap {
    background: rgba(255,255,255,0.05);
    border: 1px dashed rgba(255,255,255,0.2);
    box-shadow: none;
  }

  .badge-name {
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    margin: 0;
    letter-spacing: -0.1px;
  }
  .badge-hint {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    margin: 0;
    line-height: 1.4;
    max-height: 2.8em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .badge-status-chip {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 3px 8px;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    border-radius: 8px;
    background: color-mix(in srgb, var(--badge-accent) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--badge-accent) 50%, transparent);
    color: var(--badge-accent);
  }
  .badge-card.is-locked .badge-status-chip {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5);
  }

  .badge-progress-mini {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 2px;
  }
  .badge-progress-mini-fill {
    height: 100%;
    background: var(--badge-accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .badge-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s;
  }
  .badge-modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .badge-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    pointer-events: none;
  }
  .badge-modal.open { pointer-events: auto; }

  .badge-modal-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
    background: linear-gradient(180deg, rgba(24,24,48,0.98), rgba(14,14,28,0.98));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.8),
      0 0 60px color-mix(in srgb, var(--modal-accent, #6ea8fe) 25%, transparent);
    opacity: 0;
    transform: scale(0.94);
    transition: opacity 0.24s, transform 0.24s;
    overflow-x: hidden;
  }
  .badge-modal.open .badge-modal-card {
    opacity: 1;
    transform: scale(1);
  }

  .badge-modal-card.newcomer  { --modal-accent: #4ade80; }
  .badge-modal-card.firstgame { --modal-accent: #6ea8fe; }
  .badge-modal-card.streak    { --modal-accent: #fb923c; }
  .badge-modal-card.loved     { --modal-accent: #ec4899; }
  .badge-modal-card.winner    { --modal-accent: #fbbf24; }
  .badge-modal-card.rising    { --modal-accent: #a371f7; }
  .badge-modal-card.veteran   { --modal-accent: #22d3ee; }
  .badge-modal-card.legend    { --modal-accent: #f472b6; }
  .badge-modal-card.prolific  { --modal-accent: #4ade80; }
  .badge-modal-card.voice     { --modal-accent: #60a5fa; }

  .badge-modal-hero {
    position: relative;
    padding: 32px 24px 22px;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--modal-accent) 18%, transparent),
      transparent);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .badge-modal-hero::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 40%,
      color-mix(in srgb, var(--modal-accent) 30%, transparent),
      transparent 55%);
    pointer-events: none;
  }
  .badge-modal-icon {
    position: relative;
    width: 92px;
    height: 92px;
    border-radius: 26px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--modal-accent) 35%, transparent),
      color-mix(in srgb, var(--modal-accent) 12%, transparent));
    border: 2px solid color-mix(in srgb, var(--modal-accent) 55%, transparent);
    box-shadow:
      0 0 40px color-mix(in srgb, var(--modal-accent) 40%, transparent),
      inset 0 0 30px color-mix(in srgb, var(--modal-accent) 15%, transparent);
    z-index: 1;
  }
  .badge-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    transition: background 0.15s, transform 0.15s;
    font-family: inherit;
    padding: 0;
  }
  .badge-modal-close:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.1);
  }

  .badge-modal-status {
    position: relative;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 10.5px;
    font-weight: 900;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    background: color-mix(in srgb, var(--modal-accent) 25%, transparent);
    border: 1px solid color-mix(in srgb, var(--modal-accent) 55%, transparent);
    color: var(--modal-accent);
    z-index: 1;
  }
  .badge-modal-status.locked {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5);
  }

  .badge-modal-name {
    position: relative;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    margin: 12px 0 4px;
    letter-spacing: -0.4px;
    z-index: 1;
  }
  .badge-modal-tagline {
    position: relative;
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    margin: 0;
    line-height: 1.5;
    z-index: 1;
  }

  .badge-modal-body {
    padding: 22px 24px 24px;
  }

  .badge-modal-section {
    margin-bottom: 18px;
  }
  .badge-modal-section:last-child { margin-bottom: 0; }

  .badge-modal-label {
    font-size: 10.5px;
    font-weight: 900;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin: 0 0 8px;
  }

  .badge-modal-desc {
    font-size: 13.5px;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
    margin: 0;
  }

  .badge-modal-progress {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
  }
  .badge-modal-progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 12px;
  }
  .badge-modal-progress-label {
    font-size: 12.5px;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
  }
  .badge-modal-progress-pct {
    font-size: 13px;
    font-weight: 900;
    color: var(--modal-accent);
    font-variant-numeric: tabular-nums;
  }
  .badge-modal-progress-bar {
    height: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .badge-modal-progress-fill {
    height: 100%;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--modal-accent) 70%, transparent),
      var(--modal-accent));
    border-radius: 6px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px color-mix(in srgb, var(--modal-accent) 60%, transparent);
  }
  .badge-modal-progress-note {
    font-size: 11.5px;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
    line-height: 1.5;
  }

  .badge-modal-rarity {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
  }
  .badge-modal-rarity-ring {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(
      var(--modal-accent) calc(var(--rarity-pct) * 1%),
      rgba(255,255,255,0.06) 0
    );
  }
  .badge-modal-rarity-ring::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: #0f0f1e;
  }
  .badge-modal-rarity-ring-inner {
    position: relative;
    font-size: 13px;
    font-weight: 900;
    color: var(--modal-accent);
    font-variant-numeric: tabular-nums;
    z-index: 1;
  }
  .badge-modal-rarity-text {
    flex: 1;
    min-width: 0;
  }
  .badge-modal-rarity-title {
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    margin: 0 0 3px;
  }
  .badge-modal-rarity-sub {
    font-size: 11.5px;
    color: rgba(255,255,255,0.5);
    margin: 0;
    line-height: 1.4;
  }

  main { padding: 32px; max-width: 1200px; margin: 0 auto; }

  .grid { display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 20px; }

  .card-wrap { position: relative; }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    backdrop-filter: blur(8px);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card-wrap:hover .card {
    transform: translateY(-3px);
    border-color: rgba(236, 72, 153, 0.6);
    box-shadow: 0 12px 32px rgba(236, 72, 153, 0.25);
  }

  .thumb-wrap { position: relative; overflow: hidden; }
  .thumb { width: 100%; aspect-ratio: 4/3; display: block; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  .card-wrap:hover .thumb { transform: scale(1.05); }

  .winner-chip {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 10px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    border: 1px solid rgba(255,255,255,0.55);
    color: #1a1000;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.8px;
    border-radius: 8px;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(251,191,36,0.55), 0 0 24px rgba(251,191,36,0.35);
    z-index: 3;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 4px;
    animation: winnerPulse 2.4s ease-in-out infinite;
  }
  .winner-chip.lastweek {
    background: linear-gradient(135deg, #fbbf24, #b45309);
  }
  @keyframes winnerPulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(251,191,36,0.55), 0 0 24px rgba(251,191,36,0.35); }
    50% { box-shadow: 0 4px 20px rgba(251,191,36,0.85), 0 0 40px rgba(251,191,36,0.55); }
  }

  .info { padding: 16px 18px; }
  .info h3 {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info .desc {
    margin: 0 0 12px;

const BADGE_ORDER = ['newcomer', 'firstgame', 'streak', 'loved', 'winner', 'rising', 'prolific', 'voice', 'veteran', 'legend'];

function getWeekStart(date) {
  const d = new Date(date);
  const day = (d.getUTCDay() + 6) % 7;
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - day, 0, 0, 0));
}

function getWeekKey(date) {
  return getWeekStart(date).toISOString().slice(0, 10);
}

function computeBestStreak(gameDates) {
  if (!gameDates || gameDates.length === 0) return 0;
  const weeks = new Set();
  for (const d of gameDates) {
    if (!d) continue;
    weeks.add(getWeekKey(new Date(d)));
  }
  const sorted = Array.from(weeks).sort();
  if (sorted.length === 0) return 0;

  let best = 1;
  let current = 1;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i - 1] + 'T00:00:00Z');
    const curr = new Date(sorted[i] + 'T00:00:00Z');
    const diffDays = Math.round((curr - prev) / 86400000);
    if (diffDays === 7) {
      current++;
      if (current > best) best = current;
    } else {
      current = 1;
    }
  }
  return best;
}

function computeCurrentStreak(gameDates) {
  if (!gameDates || gameDates.length === 0) return 0;
  const weeks = new Set();
  for (const d of gameDates) {
    if (!d) continue;
    weeks.add(getWeekKey(new Date(d)));
  }
  const now = new Date();
  const thisWeek = getWeekKey(now);
  const lastWeek = getWeekKey(new Date(getWeekStart(now).getTime() - 7 * 86400000));

  if (!weeks.has(thisWeek) && !weeks.has(lastWeek)) return 0;

  const startWeek = weeks.has(thisWeek) ? thisWeek : lastWeek;
  let streak = 0;
  let cursor = new Date(startWeek + 'T00:00:00Z');
  while (weeks.has(cursor.toISOString().slice(0, 10))) {
    streak++;
    cursor = new Date(cursor.getTime() - 7 * 86400000);
  }
  return streak;
}

async function getAccountAgeDays(userId, authUser) {
  if (authUser && authUser.id === userId && authUser.created_at) {
    return (Date.now() - new Date(authUser.created_at).getTime()) / 86400000;
  }
  try {
    const { data } = await supabase
      .from('profiles')
      .select('created_at')
      .eq('user_id', userId)
      .maybeSingle();
    if (data && data.created_at) {
      return (Date.now() - new Date(data.created_at).getTime()) / 86400000;
    }
  } catch (e) {}
  return null;
}

async function computeBadgesForUser(user, gameList, totalLikes, totalComments) {
  const badges = [];
  const accountAgeDays = await getAccountAgeDays(user.id, user);

  const isNewcomer = accountAgeDays !== null && accountAgeDays < 14 && gameList.length <= 3;
  const firstGame = gameList.length >= 1;
  const gameDates = gameList.map(g => g.created_at).filter(Boolean);
  const bestStreak = computeBestStreak(gameDates);
  const currentStreak = computeCurrentStreak(gameDates);
  const streakEarned = bestStreak >= 3;

  let winnerEarned = false;
  let winnerGameTitle = null;
  try {
    const { data: wins } = await supabase
      .from('weekly_winners')
      .select('week_start, likes_at_win, game_id, games ( title, slug )')
      .eq('user_id', user.id)
      .order('week_start', { ascending: false })
      .limit(1);
    if (wins && wins.length > 0) {
      winnerEarned = true;
      winnerGameTitle = wins[0].games && wins[0].games.title;
    }
  } catch (e) {}

  badges.push({
    def: BADGE_DEFS.newcomer,
    earned: isNewcomer,
    progress: isNewcomer ? 1 : 0,
    progressTarget: 1,
    progressLabel: isNewcomer
      ? 'Active · day ' + Math.max(1, Math.floor(accountAgeDays || 0)) + ' of 14'
      : 'Welcome period ended'
  });
  badges.push({
    def: BADGE_DEFS.firstgame,
    earned: firstGame,
    progress: Math.min(gameList.length, 1),
    progressTarget: 1,
    progressLabel: gameList.length + ' / 1 game published'
  });
  badges.push({
    def: BADGE_DEFS.streak,
    earned: streakEarned,
    progress: Math.min(currentStreak, 3),
    progressTarget: 3,
    progressLabel: currentStreak + ' / 3 consecutive weeks' +
      (bestStreak > currentStreak ? ' · best: ' + bestStreak : '')
  });
  badges.push({
    def: BADGE_DEFS.loved,
    earned: totalLikes >= 50,
    progress: Math.min(totalLikes, 50),
    progressTarget: 50,
    progressLabel: totalLikes + ' / 50 likes'
  });
  badges.push({
    def: BADGE_DEFS.winner,
    earned: winnerEarned,
    progress: winnerEarned ? 1 : 0,
    progressTarget: 1,
    progressLabel: winnerEarned
      ? 'Won with "' + (winnerGameTitle || 'a game') + '"'
      : 'Not yet — win a week to earn'
  });
  badges.push({
    def: BADGE_DEFS.rising,
    earned: gameList.length >= 5,
    progress: Math.min(gameList.length, 5),
    progressTarget: 5,
    progressLabel: gameList.length + ' / 5 games published'
  });
  badges.push({
    def: BADGE_DEFS.prolific,
    earned: gameList.length >= 10,
    progress: Math.min(gameList.length, 10),
    progressTarget: 10,
    progressLabel: gameList.length + ' / 10 games published'

    earned: totalComments >= 20,
    progress: Math.min(totalComments, 20),

    def: BADGE_DEFS.veteran,
    earned: accountAgeDays !== null && accountAgeDays >= 180,
    progress: accountAgeDays !== null ? Math.min(Math.floor(accountAgeDays), 180) : 0,
    progressTarget: 180,
    progressLabel: accountAgeDays !== null
      ? Math.floor(accountAgeDays) + ' / 180 days old'
      : 'Unknown account age'
  });
  badges.push({
    def: BADGE_DEFS.legend,
    earned: totalLikes >= 200,
    progress: Math.min(totalLikes, 200),
    progressTarget: 200,
    progressLabel: totalLikes + ' / 200 likes'
  });

  return badges;
}

async function computeRarity() {
  try {
    const cached = JSON.parse(localStorage.getItem(RARITY_CACHE_KEY) || 'null');
    if (cached && cached.timestamp && (Date.now() - cached.timestamp) < RARITY_CACHE_TTL) {
      return cached.data;
    }
  } catch (e) {}

  const { data: allGames } = await supabase
    .from('games')
    .select('id, author_id, created_at');
  if (!allGames || allGames.length === 0) return null;

  const gamesByUser = {};
  const gameToAuthor = {};
  for (const g of allGames) {
    if (!g.author_id) continue;
    gameToAuthor[g.id] = g.author_id;
    if (!gamesByUser[g.author_id]) gamesByUser[g.author_id] = [];
    gamesByUser[g.author_id].push(g);
  }

  const totalUsers = Object.keys(gamesByUser).length;
  if (totalUsers < RARITY_MIN_USERS) return null;

  const allGameIds = allGames.map(g => g.id);
  let allLikes = [];
  if (allGameIds.length > 0) {
    const { data: likesData } = await supabase
      .from('likes').select('game_id').in('game_id', allGameIds);
    allLikes = likesData || [];
  }

  const likesByUser = {};
  for (const l of allLikes) {
    const author = gameToAuthor[l.game_id];
    if (!author) continue;
    likesByUser[author] = (likesByUser[author] || 0) + 1;
  }

  const commentsByUser = {};
  try {
    const { data: allComments } = await supabase
      .from('comments').select('game_id').in('game_id', allGameIds);
    if (allComments) {
      for (const c of allComments) {
        const author = gameToAuthor[c.game_id];
        if (!author) continue;
        commentsByUser[author] = (commentsByUser[author] || 0) + 1;
      }
    }
  } catch (e) {}

  const winnerUsers = new Set();
  try {
    const { data: winners } = await supabase.from('weekly_winners').select('user_id');
    if (winners) for (const w of winners) winnerUsers.add(w.user_id);
  } catch (e) {}

  const profileCreatedAt = {};
  const { data: profilesAll } = await supabase.from('profiles').select('user_id, created_at');
  if (profilesAll) for (const p of profilesAll) profileCreatedAt[p.user_id] = p.created_at;

  const counts = {
    newcomer: 0, firstgame: 0, streak: 0, loved: 0, winner: 0,
    rising: 0, prolific: 0, voice: 0, veteran: 0, legend: 0
  };

  for (const userId of Object.keys(gamesByUser)) {
    const games = gamesByUser[userId];
    counts.firstgame++;
    if (games.length >= 5) counts.rising++;
    if (games.length >= 10) counts.prolific++;

    const created = profileCreatedAt[userId];
    if (created) {
      const ageDays = (Date.now() - new Date(created).getTime()) / 86400000;
      if (ageDays < 14 && games.length <= 3) counts.newcomer++;
      if (ageDays >= 180) counts.veteran++;
    }

    const gameDates = games.map(g => g.created_at).filter(Boolean);
    if (computeBestStreak(gameDates) >= 3) counts.streak++;

    const likes = likesByUser[userId] || 0;
    if (likes >= 50) counts.loved++;
    if (likes >= 200) counts.legend++;

    if ((commentsByUser[userId] || 0) >= 20) counts.voice++;
    if (winnerUsers.has(userId)) counts.winner++;
  }

  const rarity = {};
  for (const id of Object.keys(counts)) {
    rarity[id] = totalUsers > 0 ? Math.round((counts[id] / totalUsers) * 1000) / 10 : 0;
  }

  try {
    localStorage.setItem(RARITY_CACHE_KEY, JSON.stringify({
      timestamp: Date.now(), data: rarity
    }));
  } catch (e) {}

  return rarity;
}

function badgeProgressRatio(b) {
  if (b.progress === null || !b.progressTarget || b.progressTarget === 0) return 0;
  return b.progress / b.progressTarget;
}

function pickTopBadges(badges, count) {
  return [...badges].sort((a, b) => {
    if (a.earned !== b.earned) return a.earned ? -1 : 1;
    const ra = badgeProgressRatio(a);
    const rb = badgeProgressRatio(b);
    if (rb !== ra) return rb - ra;
    return BADGE_ORDER.indexOf(a.def.id) - BADGE_ORDER.indexOf(b.def.id);
  }).slice(0, count);
}

function badgeCardHtml(b, idx) {
  const def = b.def;
  let miniBar = '';
  if (!b.earned && b.progress !== null && b.progressTarget && b.progressTarget > 1) {
    const pctFill = Math.min(100, Math.round((b.progress / b.progressTarget) * 100));
    miniBar = '<div class="badge-progress-mini">' +
      '<div class="badge-progress-mini-fill" style="width:' + pctFill + '%"></div></div>';
  }
  return '<button type="button" class="badge-card ' + def.color +
    (b.earned ? ' is-earned' : ' is-locked') + '" ' +
    'data-badge-id="' + def.id + '" style="animation-delay:' + (idx * 0.03) + 's">' +
    '<span class="badge-status-chip">' + (b.earned ? '✓ Earned' : 'Locked') + '</span>' +
    '<div class="badge-icon-wrap">' + def.icon + '</div>' +
    '<h3 class="badge-name">' + esc(def.name) + '</h3>' +
    '<p class="badge-hint">' + esc(def.hint) + '</p>' +
    miniBar +
  '</button>';
}

function wireBadgeCards(container, badges, rarity) {
  container.querySelectorAll('.badge-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.badgeId;
      const badge = badges.find(b => b.def.id === id);
      if (badge) openBadgeModal(badge, rarity);
    });
  });
}

let badgesExpanded = false;

function renderBadges(badges, rarity) {
  if (!badges || badges.length === 0) {
    badgesBar.classList.remove('on');
    return;
  }

  badgesBar.classList.add('on');

  const ordered = BADGE_ORDER
    .map(id => badges.find(b => b.def.id === id))
    .filter(Boolean);

  const top = pickTopBadges(ordered, 2);
  badgesPreview.innerHTML = top.map((b, i) => badgeCardHtml(b, i)).join('');
  wireBadgeCards(badgesPreview, ordered, rarity);

  badgesAll.innerHTML = ordered.map((b, i) => badgeCardHtml(b, i)).join('');
  wireBadgeCards(badgesAll, ordered, rarity);
}

badgesToggle.addEventListener('click', () => {
  badgesExpanded = !badgesExpanded;
  badgesAll.style.display = badgesExpanded ? 'grid' : 'none';
  badgesToggle.textContent = badgesExpanded ? '↑ See less' : 'See all →';
});

let lastFocusedEl = null;

function openBadgeModal(badge, rarity) {
  const def = badge.def;
  const pct = rarity ? (rarity[def.id] ?? 0) : null;

  badgeModalCard.className = 'badge-modal-card ' + def.color;

  let rarityHtml = '';
  if (pct !== null) {
    const ringPct = Math.max(2, Math.min(100, pct));
    let rarityNote = 'of creators have this badge';
    if (pct <= 5) rarityNote = 'of creators have this — very rare';
    else if (pct <= 15) rarityNote = 'of creators have this — rare';
    else if (pct >= 80) rarityNote = 'of creators have this — common';

    rarityHtml =
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">Rarity</p>' +
        '<div class="badge-modal-rarity">' +
          '<div class="badge-modal-rarity-ring" style="--rarity-pct:' + ringPct + '">' +
            '<span class="badge-modal-rarity-ring-inner">' + pct + '%</span>' +
          '</div>' +
          '<div class="badge-modal-rarity-text">' +
            '<p class="badge-modal-rarity-title">' + pct + '% ' + esc(rarityNote) + '</p>' +
            '<p class="badge-modal-rarity-sub">Across all creators with at least one published game. Cached 24h.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  } else {
    rarityHtml =
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">Rarity</p>' +
        '<div class="badge-modal-rarity">' +
          '<div class="badge-modal-rarity-text">' +
            '<p class="badge-modal-rarity-title">Not enough data yet</p>' +
            '<p class="badge-modal-rarity-sub">Rarity unlocks at ' + RARITY_MIN_USERS + '+ creators with published games.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  let progressHtml = '';
  if (badge.progress !== null && badge.progressTarget && badge.progressTarget > 0) {
    const pctFill = Math.min(100, Math.round((badge.progress / badge.progressTarget) * 100));
    progressHtml =
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">' + (badge.earned ? 'Progress' : 'Your progress') + '</p>' +
        '<div class="badge-modal-progress">' +
          '<div class="badge-modal-progress-top">' +
            '<span class="badge-modal-progress-label">' + esc(badge.progressLabel || '') + '</span>' +
            '<span class="badge-modal-progress-pct">' + pctFill + '%</span>' +
          '</div>' +
          '<div class="badge-modal-progress-bar">' +
            '<div class="badge-modal-progress-fill" style="width:' + pctFill + '%"></div>' +
          '</div>' +
          (badge.earned
            ? '<p class="badge-modal-progress-note">Badge earned. Nice work.</p>'
            : '<p class="badge-modal-progress-note">' + Math.max(0, badge.progressTarget - badge.progress) + ' to go.</p>'
          ) +
        '</div>' +
      '</div>';
  }

  badgeModalCard.innerHTML =
    '<div class="badge-modal-hero">' +
      '<button type="button" class="badge-modal-close" id="badgeModalClose" aria-label="Close">×</button>' +
      '<div class="badge-modal-icon">' + def.icon + '</div>' +
      '<div class="badge-modal-status' + (badge.earned ? '' : ' locked') + '">' +
        (badge.earned ? '✓ Earned' : '🔒 Locked') +
      '</div>' +
      '<h2 class="badge-modal-name">' + esc(def.name) + '</h2>' +
      '<p class="badge-modal-tagline">' + esc(def.tagline) + '</p>' +
    '</div>' +
    '<div class="badge-modal-body">' +
      '<div class="badge-modal-section">' +
        '<p class="badge-modal-label">What it means</p>' +
        '<p class="badge-modal-desc">' + esc(def.desc) + '</p>' +
      '</div>' +
      progressHtml +
      rarityHtml +
    '</div>';

  lastFocusedEl = document.activeElement;
  badgeModal.classList.add('open');
  badgeModalBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';

  requestAnimationFrame(() => {
    const closeBtn = document.getElementById('badgeModalClose');
    if (closeBtn) closeBtn.focus();
  });
}

function closeBadgeModal() {
  badgeModal.classList.remove('open');
  badgeModalBackdrop.classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') {
    try { lastFocusedEl.focus(); } catch (e) {}
  }
  lastFocusedEl = null;
}

badgeModalBackdrop.addEventListener('click', closeBadgeModal);

badgeModal.addEventListener('click', (e) => {
  if (e.target.closest('#badgeModalClose')) {
    e.preventDefault();
    e.stopPropagation();
    closeBadgeModal();
    return;
  }
  if (e.target === badgeModal) closeBadgeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && badgeModal.classList.contains('open')) closeBadgeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || !badgeModal.classList.contains('open')) return;
  const focusables = badgeModalCard.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  if (focusables.length === 0) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});

async function computeWinners(gameIds) {
  const result = { current: null, last: null };
  if (!gameIds || gameIds.length === 0) return result;

  const now = new Date();
  const thisWeekStart = getWeekStart(now);
  const lastWeekStart = new Date(thisWeekStart.getTime() - 7 * 86400000);
  const lookbackStart = new Date(thisWeekStart.getTime() - 14 * 86400000);

  const { data: likes } = await supabase
    .from('likes')
    .select('game_id, created_at')
    .in('game_id', gameIds)
    .gte('created_at', lookbackStart.toISOString());

  if (!likes || likes.length === 0) return result;

  const buckets = {};
  for (const l of likes) {
    if (!l.created_at) continue;
    const key = getWeekKey(new Date(l.created_at));
    if (!buckets[key]) buckets[key] = {};
    buckets[key][l.game_id] = (buckets[key][l.game_id] || 0) + 1;
  }

  const thisWeekKey = getWeekKey(now);
  const lastWeekKey = getWeekKey(lastWeekStart);

  const pickTop = (bucket) => {
    if (!bucket) return null;
    const sorted = Object.entries(bucket).sort((a, b) => b[1] - a[1]);
    if (sorted.length === 0) return null;
    return { gameId: sorted[0][0], likes: sorted[0][1] };
  };

  const current = pickTop(buckets[thisWeekKey]);
  const last = pickTop(buckets[lastWeekKey]);

  if (current && gameIds.includes(current.gameId)) result.current = current.gameId;
  if (last && gameIds.includes(last.gameId)) result.last = last.gameId;

  return result;
}

async function boot() {
  let user = null;
  try {
    const result = await supabase.auth.getUser();
    user = result.data ? result.data.user : null;
  } catch (e) {
    console.log('Auth failed:', e.message);
  }

  if (!user) {
    subtitle.textContent = 'Log in to see your games.';
    grid.innerHTML = '<div class="empty"><a href="/signup">Sign in →</a></div>';
    return;
  }

  const { data: games, error } = await supabase
    .from('games')
    .select('id, slug, title, description, config, plays, created_at')
    .eq('author_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    subtitle.textContent = 'Failed to load games.';
    grid.innerHTML = '<div class="empty" style="color:#f87171">' + esc(error.message) + '</div>';
    return;
  }

  const list = games || [];
  subtitle.textContent = list.length + ' game' + (list.length === 1 ? '' : 's') + ' published';

  if (list.length === 0) {
    grid.innerHTML =
      '<div class="empty">' +
        '<p style="margin:0 0 12px 0">No games yet.</p>' +
        '<p style="margin:0"><a href="/editor/">Make your first →</a></p>' +
      '</div>';
    return;
  }

  const ids = list.map(g => g.id);

  const [likesRes, commentsRes, winners] = await Promise.all([
    supabase.from('likes').select('game_id').in('game_id', ids),
    supabase.from('comments').select('game_id').in('game_id', ids),
    computeWinners(ids)
  ]);

  const lc = {}, cc = {};
  for (const l of likesRes.data || []) lc[l.game_id] = (lc[l.game_id] || 0) + 1;
  for (const c of commentsRes.data || []) cc[c.game_id] = (cc[c.game_id] || 0) + 1;

  let totalLikes = 0, totalComments = 0, totalPlays = 0;
  for (const g of list) {
    totalLikes += lc[g.id] || 0;
    totalComments += cc[g.id] || 0;
    totalPlays += g.plays || 0;
  }

  document.getElementById('statGames').textContent = list.length;
  document.getElementById('statLikes').textContent = totalLikes;
  document.getElementById('statComments').textContent = totalComments;
  document.getElementById('statPlays').textContent = totalPlays;
  statsBar.style.display = 'flex';

  try {
    const [badges, rarity] = await Promise.all([
      computeBadgesForUser(user, list, totalLikes, totalComments),
      computeRarity()
    ]);
    renderBadges(badges, rarity);
  } catch (e) {
    console.log('Badge computation failed:', e && e.message);
  }

  grid.innerHTML = '';
  for (const g of list) {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';

    const descHtml = g.description
      ? '<p class="desc">' + esc(g.description) + '</p>'
      : '';

    let chipHtml = '';
    if (g.id === winners.current) {
      chipHtml = '<div class="winner-chip">🏆 Game of the Week</div>';
    } else if (g.id === winners.last) {
      chipHtml = '<div class="winner-chip lastweek">🥇 Last Week\'s Winner</div>';
    }

    wrap.innerHTML =
      '<a class="card" href="/arcade/game.html?slug=' + encodeURIComponent(g.slug) + '">' +
        '<div class="thumb-wrap">' +
          thumbSVG(g.config) +
          chipHtml +
        '</div>' +
        '<div class="info">' +
          '<h3>' + esc(g.title) + '</h3>' +
          descHtml +
          '<div class="stats">' +
            '<span class="likes">♥ ' + (lc[g.id] || 0) + '</span>' +
            '<span class="comments">💬 ' + (cc[g.id] || 0) + '</span>' +
            '<span class="plays">▶ ' + (g.plays || 0) + '</span>' +
          '</div>' +
        '</div>' +
      '</a>' +
      '<div class="actions">' +
        '<a class="action-btn" href="/editor/?edit=' + encodeURIComponent(g.slug) + '" title="Edit">✏️</a>' +
        '<button class="action-btn danger" data-delete="' + g.slug + '" data-title="' + esc(g.title) + '" title="Delete">🗑️</button>' +
      '</div>';

    grid.appendChild(wrap);
  }

  grid.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const slug = btn.dataset.delete;
      const title = btn.dataset.title;

      if (!confirm('Delete "' + title + '"?\n\nThis cannot be undone.')) return;

      btn.textContent = '⏳';
      btn.disabled = true;

      const { error } = await supabase
        .from('games')
        .delete()
        .eq('slug', slug)
        .eq('author_id', user.id);

      if (error) {
        alert('Failed to delete: ' + error.message);
        btn.textContent = '🗑️';
        btn.disabled = false;
        return;
      }

      const wrap = btn.closest('.card-wrap');
      if (wrap) wrap.remove();
    });
  });
}

function thumbSVG(config) {
  const w = 300, h = 225;
  const world = (config && config.world) || { w: 800, h: 600, bg: '#0d0d2a' };
  const slots = (config && config.slots) || [];
  const sx = w / world.w, sy = h / world.h;
  let rects = '';
  for (const s of slots) {
    rects += '<rect x="' + (s.x*sx) + '" y="' + (s.y*sy) +
             '" width="' + (s.w*sx) + '" height="' + (s.h*sy) +
             '" fill="' + (s.color||'#4af') + '" />';
  }
  if (!rects) {
    rects = '<text x="' + (w/2) + '" y="' + (h/2) +
            '" text-anchor="middle" fill="#4af" font-size="40">▶</text>';
  }
  return '<svg class="thumb" viewBox="0 0 ' + w + ' ' + h +
    '" preserveAspectRatio="xMidYMid slice" style="background:' +
    (world.bg||'#0d0d2a') + '">' + rects + '</svg>';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

boot();
</script>
