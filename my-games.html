<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Games — Limn</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #fff;
         font-family: system-ui, -apple-system, sans-serif;
         min-height: 100vh;
         background:
           radial-gradient(circle at 15% 15%, rgba(255, 0, 128, 0.22), transparent 45%),
           radial-gradient(circle at 85% 20%, rgba(0, 204, 255, 0.2), transparent 45%),
           radial-gradient(circle at 20% 85%, rgba(124, 58, 237, 0.24), transparent 45%),
           radial-gradient(circle at 85% 90%, rgba(57, 255, 20, 0.14), transparent 45%),
           linear-gradient(135deg, #0a0a1e 0%, #150a2a 50%, #0a0a1e 100%);
         background-attachment: fixed; }

  .hero {
    position: relative;
    padding: 44px 32px 36px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    background: linear-gradient(135deg,
      #ec4899 0%,
      #f97316 22%,
      #facc15 44%,
      #22d3ee 66%,
      #6366f1 100%);
    background-size: 200% 200%;
    animation: heroRainbow 12s ease infinite;
  }
  @keyframes heroRainbow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .hero::after {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 150%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      transparent 40%,
      rgba(255, 255, 255, 0.35) 50%,
      transparent 60%,
      transparent 100%
    );
    animation: lightSweep 6s ease-in-out infinite;
    animation-delay: 1s;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes lightSweep {
    0%, 40%   { left: -150%; }
    60%, 100% { left: 150%; }
  }

  .hero-inner {
    position: relative;
    z-index: 3;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero h1 {
    margin: 0 0 6px;
    font-size: 34px;
    letter-spacing: -0.8px;
    color: #ffffff;
    font-weight: 900;
    text-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .hero p {
    margin: 0;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .hero-actions {
    display: flex;
    gap: 8px;
  }
  .hero-actions a {
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .hero-actions a.primary {
    background: #0a0a1e;
    color: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }
  .hero-actions a.primary:hover {
    transform: translateY(-2px);
    background: #1a1a3e;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  .hero-actions a.ghost {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(8px);
  }
  .hero-actions a.ghost:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-2px);
  }

  .stats-bar {
    max-width: 1200px;
    margin: 24px auto 0;
    padding: 0 32px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat-pill {
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .stat-pill .num {
    font-weight: 800;
    color: #fbbf24;
    font-size: 16px;
  }
  .stat-pill .lbl {
    opacity: 0.65;
  }

  main { padding: 32px; max-width: 1200px; margin: 0 auto; }

  .grid { display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 20px; }

  .card-wrap { position: relative; }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    backdrop-filter: blur(8px);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card-wrap:hover .card {
    transform: translateY(-3px);
    border-color: rgba(236, 72, 153, 0.6);
    box-shadow: 0 12px 32px rgba(236, 72, 153, 0.25);
  }

  .thumb { width: 100%; aspect-ratio: 4/3; display: block; }

  .info { padding: 16px 18px; }
  .info h3 {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info .desc {
    margin: 0 0 12px;
    font-size: 12.5px;
    opacity: 0.6;
    line-height: 1.5;
    max-height: 3em;
    overflow: hidden;
  }

  .stats {
    font-size: 12px;
    display: flex;
    gap: 8px;
    font-weight: 700;
  }
  .stats span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .stats span.likes { color: #ff4d8d; }
  .stats span.comments { color: #4af; }
  .stats span.plays { color: #fbbf24; }

  .actions {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .card-wrap:hover .actions,
  .card-wrap:focus-within .actions {
    opacity: 1;
  }

  .action-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(10,10,20,0.9);
    backdrop-filter: blur(8px);
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: background 0.15s, transform 0.15s, border-color 0.15s;
    padding: 0;
  }
  .action-btn:hover {
    background: rgba(68,170,255,0.4);
    border-color: rgba(68,170,255,0.8);
    transform: scale(1.1);
  }
  .action-btn.danger:hover {
    background: rgba(239,68,68,0.5);
    border-color: rgba(239,68,68,0.9);
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 100px 20px;
    opacity: 0.6;
    font-size: 15px;
  }
  .empty a {
    color: #fbbf24;
    text-decoration: none;
    font-weight: 700;
  }
  .empty a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .hero { padding: 28px 20px 24px; }
    .hero h1 { font-size: 24px; }
    .stats-bar { padding: 0 20px; margin-top: 16px; }
    main { padding: 20px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .actions { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero { animation: none; }
    .hero::after { animation: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div>
      <h1>My Games</h1>
      <p id="subtitle">Loading...</p>
    </div>
    <div class="hero-actions">
      <a href="/editor/" class="primary">+ Create</a>
      <a href="/arcade/" class="ghost">Arcade →</a>
    </div>
  </div>
</div>

<div class="stats-bar" id="statsBar" style="display:none;">
  <div class="stat-pill">
    <span class="num" id="statGames">0</span>
    <span class="lbl">games</span>
  </div>
  <div class="stat-pill">
    <span class="num" id="statLikes">0</span>
    <span class="lbl">likes</span>
  </div>
  <div class="stat-pill">
    <span class="num" id="statComments">0</span>
    <span class="lbl">comments</span>
  </div>
  <div class="stat-pill">
    <span class="num" id="statPlays">0</span>
    <span class="lbl">plays</span>
  </div>
</div>

<main>
  <div class="grid" id="grid">
    <div class="empty">Loading your games...</div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://pjtpesdhjfvcidfkxord.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38'
);

const grid = document.getElementById('grid');
const subtitle = document.getElementById('subtitle');
const statsBar = document.getElementById('statsBar');

async function boot() {
  let user = null;
  try {
    const result = await supabase.auth.getUser();
    user = result.data ? result.data.user : null;
  } catch (e) {
    console.log('Auth failed:', e.message);
  }

  if (!user) {
    subtitle.textContent = 'Log in to see your games.';
    grid.innerHTML = '<div class="empty"><a href="/signup">Sign in →</a></div>';
    return;
  }

  const { data: games, error } = await supabase
    .from('games')
    .select('id, slug, title, description, config, plays, created_at')
    .eq('author_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    subtitle.textContent = 'Failed to load games.';
    grid.innerHTML = '<div class="empty" style="color:#f87171">' + esc(error.message) + '</div>';
    return;
  }

  const list = games || [];
  subtitle.textContent = list.length + ' game' + (list.length === 1 ? '' : 's') + ' published';

  if (list.length === 0) {
    grid.innerHTML =
      '<div class="empty">' +
        '<p style="margin:0 0 12px 0">No games yet.</p>' +
        '<p style="margin:0"><a href="/editor/">Make your first →</a></p>' +
      '</div>';
    return;
  }

  const ids = list.map(g => g.id);

  const [likesRes, commentsRes] = await Promise.all([
    supabase.from('likes').select('game_id').in('game_id', ids),
    supabase.from('comments').select('game_id').in('game_id', ids)
  ]);

  const lc = {}, cc = {};
  for (const l of likesRes.data || []) lc[l.game_id] = (lc[l.game_id] || 0) + 1;
  for (const c of commentsRes.data || []) cc[c.game_id] = (cc[c.game_id] || 0) + 1;

  let totalLikes = 0, totalComments = 0, totalPlays = 0;
  for (const g of list) {
    totalLikes += lc[g.id] || 0;
    totalComments += cc[g.id] || 0;
    totalPlays += g.plays || 0;
  }

  document.getElementById('statGames').textContent = list.length;
  document.getElementById('statLikes').textContent = totalLikes;
  document.getElementById('statComments').textContent = totalComments;
  document.getElementById('statPlays').textContent = totalPlays;
  statsBar.style.display = 'flex';

  grid.innerHTML = '';
  for (const g of list) {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';

    const descHtml = g.description
      ? '<p class="desc">' + esc(g.description) + '</p>'
      : '';

    wrap.innerHTML =
      '<a class="card" href="/arcade/game.html?slug=' + encodeURIComponent(g.slug) + '">' +
        thumbSVG(g.config) +
        '<div class="info">' +
          '<h3>' + esc(g.title) + '</h3>' +
          descHtml +
          '<div class="stats">' +
            '<span class="likes">♥ ' + (lc[g.id] || 0) + '</span>' +
            '<span class="comments">💬 ' + (cc[g.id] || 0) + '</span>' +
            '<span class="plays">▶ ' + (g.plays || 0) + '</span>' +
          '</div>' +
        '</div>' +
      '</a>' +
      '<div class="actions">' +
        '<a class="action-btn" href="/editor/?edit=' + encodeURIComponent(g.slug) + '" title="Edit">✏️</a>' +
        '<button class="action-btn danger" data-delete="' + g.slug + '" data-title="' + esc(g.title) + '" title="Delete">🗑️</button>' +
      '</div>';

    grid.appendChild(wrap);
  }

  grid.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const slug = btn.dataset.delete;
      const title = btn.dataset.title;

      if (!confirm('Delete "' + title + '"?\n\nThis cannot be undone.')) return;

      btn.textContent = '⏳';
      btn.disabled = true;

      const { error } = await supabase
        .from('games')
        .delete()
        .eq('slug', slug)
        .eq('author_id', user.id);

      if (error) {
        alert('Failed to delete: ' + error.message);
        btn.textContent = '🗑️';
        btn.disabled = false;
        return;
      }

      const wrap = btn.closest('.card-wrap');
      if (wrap) wrap.remove();
    });
  });
}

function thumbSVG(config) {
  const w = 300, h = 225;
  const world = (config && config.world) || { w: 800, h: 600, bg: '#0d0d2a' };
  const slots = (config && config.slots) || [];
  const sx = w / world.w, sy = h / world.h;
  let rects = '';
  for (const s of slots) {
    rects += '<rect x="' + (s.x*sx) + '" y="' + (s.y*sy) +
             '" width="' + (s.w*sx) + '" height="' + (s.h*sy) +
             '" fill="' + (s.color||'#4af') + '" />';
  }
  if (!rects) {
    rects = '<text x="' + (w/2) + '" y="' + (h/2) +
            '" text-anchor="middle" fill="#4af" font-size="40">▶</text>';
  }
  return '<svg class="thumb" viewBox="0 0 ' + w + ' ' + h +
    '" preserveAspectRatio="xMidYMid slice" style="background:' +
    (world.bg||'#0d0d2a') + '">' + rects + '</svg>';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

boot();
</script>

</body>
</html>
