<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>Limn Studio</title>
  <link rel="stylesheet" href="/editor/ui/ui.css">
  <style>
    :root {
      --bg-0: #08090d;
      --bg-1: #0d0f16;
      --bg-2: #12141d;
      --bg-3: #181b26;
      --bg-4: #1f2330;
      --border: #242938;
      --border-2: #2f3547;
      --border-3: #3d4459;
      --text-0: #f0f3f8;
      --text-1: #a3aac0;
      --text-2: #6e7589;
      --text-3: #4a5163;
      --accent: #6ea8fe;
      --accent-2: #a371f7;
      --accent-3: #ec4899;
      --success: #4ade80;
      --success-2: #22c55e;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
      --radius-lg: 18px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg-0);
      color: var(--text-0);
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    body::before {
      content: "";
      position: fixed;
      top: -30vh; left: -10vw;
      width: 60vw; height: 60vh;
      background: radial-gradient(circle, rgba(110,168,254,0.08), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      bottom: -30vh; right: -10vw;
      width: 60vw; height: 60vh;
      background: radial-gradient(circle, rgba(163,113,247,0.06), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    body.game-open::before,
    body.game-open::after { display: none; }

    @keyframes logo-hue {
      0%   { filter: hue-rotate(0deg) brightness(1.1); }
      50%  { filter: hue-rotate(90deg) brightness(1.35); }
      100% { filter: hue-rotate(0deg) brightness(1.1); }
    }
    @keyframes logo-spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes logo-ring {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      background: linear-gradient(180deg, rgba(18,20,29,0.98), rgba(13,15,22,0.98));
      border-bottom: 1px solid var(--border);
      z-index: 100000;
      padding-top: env(safe-area-inset-top, 0);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .topbar.hidden {
      transform: translateY(calc(-100% - env(safe-area-inset-top, 0px)));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 34px; height: 34px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 12px;
      background: conic-gradient(from 0deg, #6ea8fe, #a371f7, #ec4899, #fbbf24, #4ade80, #6ea8fe);
      animation: logo-spin 6s linear infinite;
      filter: blur(7px);
      opacity: 0.85;
      z-index: 0;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6ea8fe, #a371f7, #ec4899);
      background-size: 200% 200%;
      animation: logo-ring 4s ease infinite;
      z-index: 1;
      box-shadow:
        0 0 16px rgba(110,168,254,0.6),
        0 0 30px rgba(163,113,247,0.4);
    }
    .brand-mark img {
      position: relative;
      z-index: 2;
      width: 30px; height: 30px;
      object-fit: contain;
      border-radius: 8px;
      background: var(--bg-0);
      padding: 2px;
      animation: logo-hue 8s ease-in-out infinite;
    }
    @media (max-width: 900px) {
      .brand-mark::before { display: none; }
      .brand-mark::after {
        background: linear-gradient(135deg, #6ea8fe, #a371f7);
        animation: none;
        filter: none;
        box-shadow: 0 0 10px rgba(110, 168, 254, 0.6);
      }
      .brand-mark img { animation: none; filter: none; }
    }
    body.game-open .brand-mark::before,
    body.game-open .brand-mark::after,
    body.game-open .brand-mark img {
      animation: none !important;
      filter: none !important;
    }

    .spacer { flex: 1; }
    .tabswitch {
      display: flex; gap: 3px;
      background: var(--bg-1); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px; flex-shrink: 0;
    }
    .tabswitch button {
      background: transparent; border: none; color: var(--text-1);
      padding: 7px 12px; border-radius: 999px; cursor: pointer;
      font-size: 12.5px; font-weight: 600; font-family: inherit; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .tabswitch button.active {
      background: linear-gradient(135deg, #6ea8fe, #a371f7);
      color: #fff; box-shadow: 0 2px 10px rgba(110,168,254,0.4);
    }
    .icon-btn {
      width: 34px; height: 34px; padding: 0;
      background: transparent; border: 1px solid var(--border-2);
      border-radius: 10px; color: var(--text-1); font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .icon-btn:active { background: var(--bg-2); }
    .show-btn {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 8px;
      width: 34px; height: 34px; padding: 0;
      background: rgba(18,20,29,0.9); border: 1px solid var(--border-2);
      border-radius: 10px; color: var(--text-1); font-size: 15px;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      z-index: 100001; backdrop-filter: blur(12px);
    }
    .show-btn.visible { display: flex; }

    #codeSection, #buildSection, #assetsSection {
      position: fixed; top: 54px; left: 0; right: 0; bottom: 0;
      display: none;
      transition: top 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto; background: var(--bg-0);
    }
    #codeSection.active, #buildSection.active, #assetsSection.active { display: block; }
    body.bar-hidden #codeSection, body.bar-hidden #buildSection, body.bar-hidden #assetsSection { top: 0; }
    #limn-editor-mount { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
    #gameCanvas { display: none; }

    .panel-wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px 90px; }
    .panel-card {
      background: var(--bg-1); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px; margin-bottom: 16px;
    }
    .panel-card h2 { margin: 0 0 6px 0; font-size: 17px; font-weight: 700; }
    .panel-card .sub { margin: 0 0 18px 0; color: var(--text-2); font-size: 12.5px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-2); font-weight: 700; margin-bottom: 6px;
    }
    .field select, .field input[type="text"], .field textarea {
      width: 100%; padding: 12px 14px;
      background: var(--bg-0); color: var(--text-0);
      border: 1px solid var(--border-2); border-radius: 10px;
      font-size: 14px; font-family: inherit; outline: none;
    }
    .field textarea {
      resize: vertical; min-height: 100px;
      font-family: ui-monospace, monospace; font-size: 12.5px; line-height: 1.55;
    }
    .field select:focus, .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .swatch-field {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      background: var(--bg-0); border: 1px solid var(--border-2); border-radius: 10px;
    }
    .swatch-input { width: 44px; height: 44px; padding: 0; border: none; border-radius: 9px; cursor: pointer; flex-shrink: 0; }
    .swatch-hex {
      flex: 1; font-family: ui-monospace, monospace; font-size: 13px;
      color: var(--text-0); background: transparent; border: none; outline: none;
      text-transform: uppercase; min-width: 0;
    }
    .btn {
      padding: 12px 18px; border-radius: 10px;
      border: 1px solid var(--border-2); background: var(--bg-2); color: var(--text-0);
      font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6ea8fe, #a371f7);
      border: none; color: #fff;
      box-shadow: 0 4px 16px rgba(110,168,254,0.35); width: 100%;
    }

    .console-section {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 99800;
      display: none;
      padding: 0 8px 8px 8px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.5));
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    }
    body.console-open .console-section { display: block; }
    .console-window {
      background: #000;
      border: 1px solid var(--border-2);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.7);
      max-height: 50vh;
    }
    .console-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: #0a0a0a;
      border-bottom: 1px solid #1a1a1a;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--text-2);
    }
    .console-toolbar-btn {
      background: transparent;
      border: 1px solid #232936;
      color: var(--text-2);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .console-toolbar-btn.active {
      color: var(--accent);
      border-color: rgba(110,168,254,0.5);
      background: rgba(110,168,254,0.08);
    }
    #editor-console-logs {
      background: #000;
      font-family: ui-monospace, monospace;
      min-height: 100px;
      max-height: 40vh;
      padding: 10px 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
      flex: 1;
    }
    .log-line {
      padding: 2px 0;
      word-break: break-word;
      border-left: 2px solid transparent;
      padding-left: 8px;
      margin-left: -8px;
    }
    .log-line.log-info    { color: #94a3b8; border-left-color: #334155; }
    .log-line.log-log     { color: #cbd5e1; border-left-color: #475569; }
    .log-line.log-warn    { color: #fcd34d; border-left-color: #f59e0b; background: rgba(251,191,36,0.05); }
    .log-line.log-error   { color: #fca5a5; border-left-color: #dc2626; background: rgba(248,113,113,0.06); }
    .log-line.log-result  { color: #7dd3fc; border-left-color: #0ea5e9; }
    .log-line.log-input   { color: #a78bfa; border-left-color: #8b5cf6; }
    .log-line.log-success { color: #86efac; border-left-color: #16a34a; }
    .log-prefix {
      color: #64748b;
      margin-right: 6px;
      font-weight: 500;
      user-select: none;
    }
    .log-time {
      color: #475569;
      margin-right: 8px;
      font-size: 10.5px;
      user-select: none;
    }
    .console-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #0a0a0a;
      border-top: 1px solid #1a1a1a;
    }
    .console-chevron {
      color: #22c55e;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      font-weight: 700;
      user-select: none;
    }
    #consoleReplInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #cbd5e1;
      font-family: ui-monospace, monospace;
      font-size: 12.5px;
      padding: 4px 0;
    }
    #consoleReplInput::placeholder { color: #475569; }

    .toast-container {
      position: fixed;
      bottom: 90px; right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 99900;
      pointer-events: none;
    }
    .toast {
      padding: 11px 16px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      color: var(--text-0);
      font-size: 13px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      pointer-events: auto;
      max-width: 380px;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }

    dialog#runDialog {
      width: 100vw; height: 100vh;
      max-width: 100vw; max-height: 100vh;
      padding: 0; margin: 0; border: 0;
      background: #000; color: #fff;
      position: fixed; inset: 0;
      z-index: 99950;
      overflow: hidden;
    }
    dialog#runDialog::backdrop { background: #000; }
    .dialog-close {
      position: absolute; top: 16px; left: 16px; z-index: 99960;
      width: 40px; height: 40px; padding: 0;
      background: rgba(24,27,38,0.95); color: #fff;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
      cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .dialog-stage {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #000;
    }
    .dialog-frame-wrap {
      width: 100%; height: 100%;
      transform-origin: center center;
      transition: transform 0.15s ease;
    }
    .dialog-frame-wrap iframe {
      width: 100%; height: 100%; border: 0; display: block; background: #000;
    }
    .dialog-controls {
      position: absolute; bottom: 24px; right: 24px;
      display: flex; gap: 10px; z-index: 99960;
    }
    .dialog-controls button {
      width: 42px; height: 42px; padding: 0;
      background: rgba(24,27,38,0.95); color: var(--text-0);
      border: 1px solid var(--border-2); border-radius: 12px;
      cursor: pointer; font-size: 18px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .dialog-zoom-display {
      min-width: 68px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .topbar { padding: 12px 10px; gap: 8px; }
      .icon-btn { width: 32px; height: 32px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand">
    <div class="brand-mark">
      <img src="/editor/logo.png" alt="L" />
    </div>
  </div>
  <div class="tabswitch">
    <button id="tabCode" class="active" type="button">Code</button>
    <button id="tabBuild" type="button">Build</button>
    <button id="tabAssets" type="button">Assets</button>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="runBtn" type="button" title="Run">▶</button>
  <button class="icon-btn" id="consoleBtn" type="button" title="Console">▤</button>
  <button class="icon-btn" id="menuBtn" type="button" title="Menu">⋮</button>
  <button class="icon-btn" id="hideBtn" type="button" title="Hide bar">▲</button>
</div>

<button class="show-btn" id="showBtn" type="button" title="Show bar">▼</button>

<section id="codeSection" class="active">
  <div id="limn-editor-mount"></div>
</section>

<section id="buildSection">
  <div class="panel-wrap">
    <div class="panel-card">
      <h2>Build</h2>
      <p class="sub">Pick a template, customize colors, then tap Apply.</p>
      <div class="field">
        <label for="templateSelect">Template</label>
        <select id="templateSelect"></select>
      </div>
      <div id="templateFields"></div>
      <button class="btn btn-primary" id="buildApply" type="button">Apply to editor</button>
    </div>
  </div>
</section>

<section id="assetsSection">
  <div class="panel-wrap">
    <div class="panel-card">
      <h2>Head HTML</h2>
      <p class="sub">Raw tags injected inside &lt;head&gt;.</p>
      <textarea id="assetHead" placeholder="&lt;link rel=&quot;stylesheet&quot; href=&quot;...&quot;&gt;"></textarea>
    </div>
    <div class="panel-card">
      <h2>Extra CSS</h2>
      <p class="sub">Injected as a &lt;style&gt; block.</p>
      <textarea id="assetCss" placeholder="body { background: #000; }"></textarea>
    </div>
    <div class="panel-card">
      <h2>External Scripts</h2>
      <p class="sub">One URL per line.</p>
      <textarea id="assetScripts" placeholder="https://cdn.example.com/lib.js"></textarea>
    </div>
  </div>
</section>

<section class="console-section">
  <div class="console-window">
    <div class="console-toolbar">
      <span id="consoleCount">0 messages</span>
      <div style="display:flex;gap:6px;">
        <button class="console-toolbar-btn" id="consoleClearBtn" type="button">Clear</button>
        <button class="console-toolbar-btn active" id="consoleAutoscroll" type="button">Auto-scroll</button>
        <button class="console-toolbar-btn" id="consoleCloseBtn" type="button">✕</button>
      </div>
    </div>
    <div id="editor-console-logs"></div>
    <div class="console-input-row">
      <span class="console-chevron">&gt;</span>
      <input type="text" id="consoleReplInput" placeholder="evaluate in the running game" autocomplete="off" spellcheck="false" />
    </div>
  </div>
</section>

<dialog id="runDialog">
  <button class="dialog-close" id="dialogClose" type="button">✕</button>
  <div class="dialog-stage">
    <div class="dialog-frame-wrap" id="dialogFrameWrap">
      <iframe id="gameFrame" allowfullscreen srcdoc="<center style='padding-top:20vh;color:#8b949e;font-family:system-ui'><h1>Loading…</h1></center>"></iframe>
    </div>
  </div>
  <div class="dialog-controls">
    <button id="zoomOutBtn" type="button">−</button>
    <button id="zoomDisplay" class="dialog-zoom-display" type="button">100%</button>
    <button id="zoomInBtn" type="button">+</button>
    <button id="fsBtn" type="button">⛶</button>
  </div>
</dialog>

<div class="toast-container" id="toastContainer"></div>

<script src="/editor/templates.js"></script>
<script src="/editor/build.js"></script>

<script type="module">
  const supaMod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const createClient = supaMod.createClient;
  const bridgeMod = await import("/editor/limn-bridge.js");
  const LimnEditorComponent = bridgeMod.LimnEditorComponent;

  const SUPABASE_URL = "https://pjtpesdhjfvcidfkxord.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let component = null;

  function toast(msg, kind) {
    const c = document.getElementById("toastContainer");
    if (!c) return;
    const t = document.createElement("div");
    t.className = "toast " + (kind || "");
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => {
      t.style.transition = "opacity 0.3s";
      t.style.opacity = "0";
      setTimeout(() => t.remove(), 320);
    }, 2400);
  }

  function getCode() {
    return component ? component.getValue() : "";
  }

  function setCode(text) {
    if (!component) return;
    component.setValue(String(text == null ? "" : text));
  }

  function activeFileName() {
    if (!component || !component.editor) return "";
    const doc = component.editor.activeDoc;
    return doc ? doc.name : "";
  }

  function isHtmlFile() {
    const n = activeFileName().toLowerCase();
    return n.endsWith(".html") || n.endsWith(".htm");
  }

  function isMarkdownFile() {
    const n = activeFileName().toLowerCase();
    return n.endsWith(".md") || n.endsWith(".markdown");
  }

  async function bootLimn() {
    const mount = document.getElementById("limn-editor-mount");
    if (!mount) return;

    const dummy = document.createElement("canvas");
    dummy.id = "gameCanvas";
    dummy.style.display = "none";
    document.body.appendChild(dummy);

    component = new LimnEditorComponent({
      x: 0, y: 0,
      width: mount.clientWidth || window.innerWidth,
      height: mount.clientHeight || (window.innerHeight - 54),
      value: "// Limn Studio\n// Switch to Build to pick a template.\n",
      name: "main.js",
      fontSize: 14,
      tabSize: 2,
      supabase: supabase,
    });

    await component.attach({ canvas: dummy });

    function fit() {
      const w = mount.clientWidth || 0;
      const h = mount.clientHeight || 0;
      if (w > 0 && h > 0) component.resize(w, h);
    }
    fit();
    window.addEventListener("resize", fit);
    setTimeout(fit, 150);
    setTimeout(fit, 500);

    component.focus();

    (function loop() {
      if (!component) return;
      component.update();
      requestAnimationFrame(loop);
    })();

    window.__limnEditor = component;
    window.__editor = component;
  }

  function initTabs() {
    const tabCode = document.getElementById("tabCode");
    const tabBuild = document.getElementById("tabBuild");
    const tabAssets = document.getElementById("tabAssets");
    const codeSection = document.getElementById("codeSection");
    const buildSection = document.getElementById("buildSection");
    const assetsSection = document.getElementById("assetsSection");

    function show(which) {
      [tabCode, tabBuild, tabAssets].forEach(t => t.classList.remove("active"));
      [codeSection, buildSection, assetsSection].forEach(s => s.classList.remove("active"));

      if (which === "code") {
        tabCode.classList.add("active");
        codeSection.classList.add("active");
        setTimeout(() => window.dispatchEvent(new Event("resize")), 30);
      } else if (which === "build") {
        tabBuild.classList.add("active");
        buildSection.classList.add("active");
      } else if (which === "assets") {
        tabAssets.classList.add("active");
        assetsSection.classList.add("active");
      }
    }

    tabCode.addEventListener("click", () => show("code"));
    tabBuild.addEventListener("click", () => show("build"));
    tabAssets.addEventListener("click", () => show("assets"));
  }

  function initBarToggle() {
    const topbar = document.getElementById("topbar");
    const hideBtn = document.getElementById("hideBtn");
    const showBtn = document.getElementById("showBtn");
    if (!topbar || !hideBtn || !showBtn) return;

    hideBtn.addEventListener("click", () => {
      topbar.classList.add("hidden");
      document.body.classList.add("bar-hidden");
      showBtn.classList.add("visible");
      setTimeout(() => window.dispatchEvent(new Event("resize")), 300);
    });

    showBtn.addEventListener("click", () => {
      topbar.classList.remove("hidden");
      document.body.classList.remove("bar-hidden");
      showBtn.classList.remove("visible");
      setTimeout(() => window.dispatchEvent(new Event("resize")), 300);
    });
  }

  function initAssetsPanel() {
    const head = document.getElementById("assetHead");
    const css = document.getElementById("assetCss");
    const scripts = document.getElementById("assetScripts");
    if (!head || !css || !scripts) return;

    function ensure() {
      if (!window.currentConfig) window.currentConfig = {};
      if (!window.currentConfig.assets) {
        window.currentConfig.assets = { head: "", css: "", scripts: "" };
      }
      return window.currentConfig.assets;
    }

    function load() {
      const a = ensure();
      head.value = a.head || "";
      css.value = a.css || "";
      scripts.value = a.scripts || "";
    }

    function save() {
      const a = ensure();
      a.head = head.value;
      a.css = css.value;
      a.scripts = scripts.value;
    }

    head.addEventListener("input", save);
    css.addEventListener("input", save);
    scripts.addEventListener("input", save);

    window.getCurrentAssets = function () {
      const a = ensure();
      return { head: a.head, css: a.css, scripts: a.scripts };
    };

    load();
  }

  function initBuildPanel() {
    const fieldsEl = document.getElementById("templateFields");
    const selectEl = document.getElementById("templateSelect");
    const applyBtn = document.getElementById("buildApply");

    if (!fieldsEl || !selectEl || !applyBtn) return;

    const templates = window.LimnTemplates || {};
    const keys = Object.keys(templates);
    let currentKey = keys[0] || null;

    selectEl.innerHTML = "";
    if (keys.length === 0) {
      const o = document.createElement("option");
      o.textContent = "No templates loaded";
      selectEl.appendChild(o);
      return;
    }
    keys.forEach(k => {
      const o = document.createElement("option");
      o.value = k;
      o.textContent = templates[k].name || k;
      selectEl.appendChild(o);
    });
    selectEl.value = currentKey;

    const fieldRefs = {};

    function makeSwatch(f) {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const label = document.createElement("label");
      label.textContent = f.label;
      const swatch = document.createElement("div");
      swatch.className = "swatch-field";

      const colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.className = "swatch-input";
      colorInput.value = f.default;

      const hex = document.createElement("input");
      hex.type = "text";
      hex.className = "swatch-hex";
      hex.value = String(f.default).toUpperCase();
      hex.maxLength = 9;
      hex.spellcheck = false;

      colorInput.addEventListener("input", () => {
        hex.value = colorInput.value.toUpperCase();
      });
      hex.addEventListener("input", () => {
        const v = hex.value.trim();
        if (/^#[0-9a-fA-F]{6}$/.test(v)) {
          colorInput.value = v;
        }
      });
      hex.addEventListener("blur", () => {
        if (!/^#[0-9a-fA-F]{6}$/.test(hex.value.trim())) {
          hex.value = colorInput.value.toUpperCase();
        }
      });

      swatch.appendChild(colorInput);
      swatch.appendChild(hex);
      wrap.appendChild(label);
      wrap.appendChild(swatch);
      return { el: wrap, input: colorInput, hex };
    }

    function makeTextField(f) {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const label = document.createElement("label");
      label.textContent = f.label;
      const input = document.createElement("input");
      input.type = "text";
      input.value = f.default;
      input.spellcheck = false;
      wrap.appendChild(label);
      wrap.appendChild(input);
      return { el: wrap, input };
    }

    function renderFields() {
      const tpl = templates[currentKey];
      if (!tpl) return;
      fieldsEl.innerHTML = "";
      Object.keys(fieldRefs).forEach(k => delete fieldRefs[k]);

      tpl.fields.forEach(f => {
        const made = f.type === "color" ? makeSwatch(f) : makeTextField(f);
        fieldsEl.appendChild(made.el);
        fieldRefs[f.key] = made;
      });
    }

    function readValues() {
      const tpl = templates[currentKey];
      const cfg = {};
      if (!tpl) return cfg;
      tpl.fields.forEach(f => {
        const ref = fieldRefs[f.key];
        if (ref) cfg[f.key] = ref.input.value;
        else cfg[f.key] = f.default;
      });
      return cfg;
    }

    function apply() {
      const tpl = templates[currentKey];
      if (!tpl || !tpl.generate) {
        toast("No template selected", "warning");
        return;
      }
      const cfg = readValues();
      if (tpl.config) {
        try { window.currentConfig = tpl.config(cfg); } catch (e) {}
      }
      const code = tpl.generate(cfg);
      setCode(code);
      document.getElementById("tabCode").click();
      toast("Template applied", "success");
    }

    selectEl.addEventListener("change", () => {
      currentKey = selectEl.value;
      renderFields();
    });

    applyBtn.addEventListener("click", apply);

    renderFields();
  }

  function buildPreviewHtml() {
    const code = getCode();
    if (!code.trim()) return null;

    if (isHtmlFile()) {
      return code;
    }

    const engine = window.__v4t || "";
    if (!engine) return null;

    const assets = (window.getCurrentAssets && window.getCurrentAssets()) || { head: "", css: "", scripts: "" };
    return window.buildGameHTML(engine, code, assets);
  }

  function initRun() {
    const runBtn = document.getElementById("runBtn");
    const dialog = document.getElementById("runDialog");
    const dialogClose = document.getElementById("dialogClose");
    const frame = document.getElementById("gameFrame");
    const wrap = document.getElementById("dialogFrameWrap");
    const zoomDisplay = document.getElementById("zoomDisplay");
    if (!runBtn || !dialog) return;

    let zoom = 1;
    function applyZoom() {
      wrap.style.transform = zoom === 1 ? "" : "scale(" + zoom + ")";
      zoomDisplay.textContent = Math.round(zoom * 100) + "%";
    }
    document.getElementById("zoomInBtn").addEventListener("click", () => { zoom = Math.min(3, zoom + 0.1); applyZoom(); });
    document.getElementById("zoomOutBtn").addEventListener("click", () => { zoom = Math.max(0.3, zoom - 0.1); applyZoom(); });
    zoomDisplay.addEventListener("click", () => { zoom = 1; applyZoom(); });
    document.getElementById("fsBtn").addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
    });
    dialogClose.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      dialog.close();
      document.body.classList.remove("game-open");
    });

    dialog.addEventListener("close", () => {
      document.body.classList.remove("game-open");
    });

    function run() {
      const code = getCode();
      if (!code.trim()) {
        toast("Nothing to run", "warning");
        return;
      }
      const html = buildPreviewHtml();
      if (html === null) {
        toast("Engine still loading…", "warning");
        return;
      }
      if (!dialog.hasAttribute("open")) dialog.showModal();
      document.body.classList.add("game-open");
      frame.srcdoc = html;
    }

    runBtn.addEventListener("click", run);
  }

  function initMenu() {
    const menuBtn = document.getElementById("menuBtn");
    if (!menuBtn) return;
    menuBtn.addEventListener("click", () => {
      if (component && component._menu && typeof component._menu.toggle === "function") {
        component._menu.toggle();
      }
    });
  }

  function initConsole() {
    const logsEl = document.getElementById("editor-console-logs");
    const replInput = document.getElementById("consoleReplInput");
    const countEl = document.getElementById("consoleCount");
    const clearBtn = document.getElementById("consoleClearBtn");
    const autoscrollBtn = document.getElementById("consoleAutoscroll");
    const closeBtn = document.getElementById("consoleCloseBtn");
    const consoleBtn = document.getElementById("consoleBtn");
    if (!logsEl) return;

    let messageCount = 0;
    let autoscroll = true;

    function now() {
      const d = new Date();
      return String(d.getHours()).padStart(2, "0") + ":" +
             String(d.getMinutes()).padStart(2, "0") + ":" +
             String(d.getSeconds()).padStart(2, "0");
    }

    function formatValue(v) {
      if (v === undefined) return "undefined";
      if (v === null) return "null";
      if (typeof v === "string") return v;
      if (typeof v === "number" || typeof v === "boolean") return String(v);
      if (typeof v === "function") return "[Function " + (v.name || "anonymous") + "]";
      if (v instanceof Error) return v.name + ": " + v.message;
      try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); }
    }

    function appendLog(kind, args, stack) {
      const line = document.createElement("div");
      line.className = "log-line log-" + kind;
      const time = document.createElement("span");
      time.className = "log-time";
      time.textContent = now();
      line.appendChild(time);
      const prefix = document.createElement("span");
      prefix.className = "log-prefix";
      prefix.textContent = kind === "error" ? "✖" : kind === "warn" ? "⚠" : kind === "result" ? "←" : kind === "input" ? "›" : kind === "success" ? "✓" : "·";
      line.appendChild(prefix);
      const text = document.createElement("span");
      text.textContent = Array.prototype.map.call(args, formatValue).join(" ");
      line.appendChild(text);
      if (stack) {
        const s = document.createElement("span");
        s.className = "log-stack";
        s.style.cssText = "display:block;color:#9ca3af;font-size:11px;margin-top:4px;padding-left:8px;border-left:1px solid #334155;white-space:pre-wrap;";
        s.textContent = String(stack).split("\n").slice(0, 3).join("\n");
        line.appendChild(s);
      }
      logsEl.appendChild(line);
      while (logsEl.children.length > 500) logsEl.removeChild(logsEl.firstChild);
      messageCount++;
      if (countEl) countEl.textContent = messageCount + (messageCount === 1 ? " message" : " messages");
      if (autoscroll) logsEl.scrollTop = logsEl.scrollHeight;
    }

    function openConsole() {
      document.body.classList.add("console-open");
      setTimeout(() => { logsEl.scrollTop = logsEl.scrollHeight; }, 100);
    }
    function closeConsole() {
      document.body.classList.remove("console-open");
    }

    consoleBtn.addEventListener("click", () => {
      if (document.body.classList.contains("console-open")) closeConsole();
      else openConsole();
    });
    closeBtn.addEventListener("click", closeConsole);

    clearBtn.addEventListener("click", () => {
      logsEl.innerHTML = "";
      messageCount = 0;
      if (countEl) countEl.textContent = "0 messages";
    });

    autoscrollBtn.addEventListener("click", () => {
      autoscroll = !autoscroll;
      autoscrollBtn.classList.toggle("active", autoscroll);
    });

    function getFrame() {
      const f = document.getElementById("gameFrame");
      try { return f.contentWindow; } catch (e) { return null; }
    }

    function tryEval(code) {
      const win = getFrame();
      if (!win) {
        appendLog("error", ["No game running. Press ▶ first."]);
        return;
      }
      try {
        const r = win.eval(code);
        appendLog("result", [r]);
      } catch (e) {
        appendLog("error", [e.name + ": " + e.message]);
      }
    }

    replInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const code = replInput.value.trim();
        if (!code) return;
        replInput.value = "";
        appendLog("input", [code]);
        tryEval(code);
      }
    });

    window.addEventListener("message", (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "console") {
        appendLog(e.data.kind || "log", e.data.args || [], e.data.stack);
      } else if (e.data.type === "error") {
        appendLog("error", [e.data.message], e.data.stack);
      }
    });

    appendLog("info", ["Console ready. Press ▶ Run to start."]);
  }

  initTabs();
  initBarToggle();
  initAssetsPanel();
  initBuildPanel();
  initRun();
  initMenu();
  initConsole();

  await bootLimn();
</script>
