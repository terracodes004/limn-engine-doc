<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>Limn Studio</title>
  <link rel="stylesheet" href="/editor/ui/ui.css">
  <style>
    :root {
      --bg-0: #08090d;
      --bg-1: #0d0f16;
      --bg-2: #12141d;
      --bg-3: #181b26;
      --border: #242938;
      --border-2: #2f3547;
      --text-0: #f0f3f8;
      --text-1: #a3aac0;
      --text-2: #6e7589;
      --accent: #6ea8fe;
      --accent-2: #a371f7;
      --success: #4ade80;
      --warning: #fbbf24;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg-0);
      color: var(--text-0);
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      background: linear-gradient(180deg, rgba(18,20,29,0.98), rgba(13,15,22,0.98));
      border-bottom: 1px solid var(--border);
      z-index: 100000;
      padding-top: env(safe-area-inset-top, 0);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .topbar.hidden {
      transform: translateY(calc(-100% - env(safe-area-inset-top, 0px)));
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6ea8fe 0%, #a371f7 55%, #ec4899 100%);
      box-shadow: 0 0 16px rgba(110,168,254,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
    }
    .spacer { flex: 1; }
    .tabswitch {
      display: flex;
      gap: 3px;
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      flex-shrink: 0;
    }
    .tabswitch button {
      background: transparent;
      border: none;
      color: var(--text-1);
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      white-space: nowrap;
    }
    .tabswitch button.active {
      background: linear-gradient(135deg, #6ea8fe, #a371f7);
      color: #fff;
      box-shadow: 0 2px 10px rgba(110,168,254,0.4);
    }
    .icon-btn {
      width: 34px; height: 34px;
      padding: 0;
      background: transparent;
      border: 1px solid var(--border-2);
      border-radius: 10px;
      color: var(--text-1);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-btn:active { background: var(--bg-2); }

    .show-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      right: 8px;
      width: 34px; height: 34px;
      padding: 0;
      background: rgba(18,20,29,0.9);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      color: var(--text-1);
      font-size: 15px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100001;
      backdrop-filter: blur(12px);
    }
    .show-btn.visible { display: flex; }

    #codeSection, #buildSection, #assetsSection {
      position: fixed;
      top: 54px;
      left: 0; right: 0; bottom: 0;
      display: none;
      transition: top 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      background: var(--bg-0);
    }
    #codeSection.active, #buildSection.active, #assetsSection.active {
      display: block;
    }
    body.bar-hidden #codeSection,
    body.bar-hidden #buildSection,
    body.bar-hidden #assetsSection {
      top: 0;
    }

    #limn-editor-mount {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      background: #000;
    }
    #gameCanvas { display: none; }

    .panel-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 90px;
    }
    .panel-card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }
    .panel-card h2 {
      margin: 0 0 6px 0;
      font-size: 17px;
      font-weight: 700;
    }
    .panel-card .sub {
      margin: 0 0 18px 0;
      color: var(--text-2);
      font-size: 12.5px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-2);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .field select, .field input[type="text"], .field textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-0);
      color: var(--text-0);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .field textarea {
      resize: vertical;
      min-height: 100px;
      font-family: ui-monospace, monospace;
      font-size: 12.5px;
      line-height: 1.55;
    }
    .field select:focus, .field input:focus, .field textarea:focus {
      border-color: var(--accent);
    }
    .swatch-field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-0);
      border: 1px solid var(--border-2);
      border-radius: 10px;
    }
    .swatch-input {
      width: 44px; height: 44px;
      padding: 0; border: none;
      border-radius: 9px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .swatch-hex {
      flex: 1;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: var(--text-0);
      background: transparent;
      border: none;
      outline: none;
      text-transform: uppercase;
      min-width: 0;
    }
    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-2);
      background: var(--bg-2);
      color: var(--text-0);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6ea8fe, #a371f7);
      border: none;
      color: #fff;
      box-shadow: 0 4px 16px rgba(110,168,254,0.35);
      width: 100%;
    }

    .toast-container {
      position: fixed;
      bottom: 90px; right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9500;
      pointer-events: none;
    }
    .toast {
      padding: 11px 16px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      color: var(--text-0);
      font-size: 13px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      pointer-events: auto;
      max-width: 380px;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }

    dialog#runDialog {
      width: 100vw; height: 100vh;
      max-width: 100vw; max-height: 100vh;
      padding: 0; margin: 0; border: 0;
      background: #000; color: #fff;
      position: fixed; inset: 0;
      z-index: 9000;
      overflow: hidden;
    }
    dialog#runDialog::backdrop { background: #000; }
    .dialog-close {
      position: absolute; top: 16px; left: 16px; z-index: 9500;
      width: 40px; height: 40px; padding: 0;
      background: rgba(24,27,38,0.95);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
    }
    .dialog-stage {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #000;
    }
    .dialog-frame-wrap { width: 100%; height: 100%; transform-origin: center center; }
    .dialog-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    .dialog-controls {
      position: absolute; bottom: 20px; right: 20px;
      display: flex; gap: 8px; z-index: 9500;
    }
    .dialog-controls button {
      width: 42px; height: 42px; padding: 0;
      background: rgba(24,27,38,0.95);
      color: var(--text-0);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand">
    <div class="brand-mark">L</div>
  </div>
  <div class="tabswitch">
    <button id="tabCode" class="active" type="button">Code</button>
    <button id="tabBuild" type="button">Build</button>
    <button id="tabAssets" type="button">Assets</button>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="runBtn" type="button" title="Run">▶</button>
  <button class="icon-btn" id="menuBtn" type="button" title="Menu">⋮</button>
  <button class="icon-btn" id="hideBtn" type="button" title="Hide bar">▲</button>
</div>

<button class="show-btn" id="showBtn" type="button" title="Show bar">▼</button>

<section id="codeSection" class="active">
  <div id="limn-editor-mount"></div>
</section>

<section id="buildSection">
  <div class="panel-wrap">
    <div class="panel-card">
      <h2>Build</h2>
      <p class="sub">Pick a template, customize colors, then tap Apply.</p>

      <div class="field">
        <label for="templateSelect">Template</label>
        <select id="templateSelect"></select>
      </div>

      <div id="templateFields"></div>

      <button class="btn btn-primary" id="buildApply" type="button">Apply to editor</button>
    </div>
  </div>
</section>

<section id="assetsSection">
  <div class="panel-wrap">
    <div class="panel-card">
      <h2>Head HTML</h2>
      <p class="sub">Raw tags injected inside &lt;head&gt;.</p>
      <textarea id="assetHead" placeholder="&lt;link rel=&quot;stylesheet&quot; href=&quot;...&quot;&gt;"></textarea>
    </div>
    <div class="panel-card">
      <h2>Extra CSS</h2>
      <p class="sub">Injected as a &lt;style&gt; block.</p>
      <textarea id="assetCss" placeholder="body { background: #000; }"></textarea>
    </div>
    <div class="panel-card">
      <h2>External Scripts</h2>
      <p class="sub">One URL per line.</p>
      <textarea id="assetScripts" placeholder="https://cdn.example.com/lib.js"></textarea>
    </div>
  </div>
</section>

<dialog id="runDialog">
  <button class="dialog-close" id="dialogClose" type="button">✕</button>
  <div class="dialog-stage">
    <div class="dialog-frame-wrap" id="dialogFrameWrap">
      <iframe id="gameFrame" allowfullscreen srcdoc="<center style='padding-top:20vh;color:#8b949e;font-family:system-ui'><h1>Loading…</h1></center>"></iframe>
    </div>
  </div>
  <div class="dialog-controls">
    <button id="zoomOutBtn" type="button">−</button>
    <button id="zoomDisplay" type="button">100%</button>
    <button id="zoomInBtn" type="button">+</button>
    <button id="fsBtn" type="button">⛶</button>
  </div>
</dialog>

<div class="toast-container" id="toastContainer"></div>

<script src="/editor/build.js"></script>
<script src="/editor/templates.js"></script>
<script type="module" src="/editor/limn-studio.js"></script>
</body>
</html>
