<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ Account Settings — Limn Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 40px 20px;">

  <div style="max-width: 600px; margin: 0 auto;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; border-bottom: 1.5px solid var(--border); padding-bottom: 20px;">
      <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: #ffffff; letter-spacing: -1px;">
          ⚙️ Settings
        </h1>
        <p style="color: var(--muted); font-size: 0.95rem; margin-top: 4px;">Manage your profile, avatar, and preferences.</p>
      </div>
      <a href="index.html" class="btn-secondary" style="padding: 10px 20px; font-size: 13px; text-decoration: none; border-radius: 8px;">← Home</a>
    </div>

    <div style="background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 30px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);">

      <form id="settings-form" style="display: flex; flex-direction: column; gap: 20px;">

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--accent2); margin-bottom: 8px; font-family: 'Space Mono', monospace; text-transform: uppercase;">Avatar Image URL</label>
          <div style="display: flex; gap: 15px; align-items: center;">
            <img id="avatar-preview" src="" alt="Avatar" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; background: var(--code-bg);">
            <input type="url" id="avatar-input" placeholder="Paste image URL here" style="flex: 1; padding: 12px 16px; background: var(--code-bg); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none;">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--accent2); margin-bottom: 8px; font-family: 'Space Mono', monospace; text-transform: uppercase;">Username</label>
          <div style="position: relative;">
            <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600;">@</span>
            <input type="text" id="username-input" placeholder="Pick a username" readonly style="width: 100%; padding: 12px 16px 12px 32px; background: rgba(255,255,255,0.03); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; cursor: not-allowed;">
          </div>
          <p id="username-hint" style="font-size: 0.8rem; color: var(--muted); margin-top: 6px;">Your permanent @handle. Cannot be changed once set.</p>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--accent2); margin-bottom: 8px; font-family: 'Space Mono', monospace; text-transform: uppercase;">Display Name</label>
          <input type="text" id="display-name-input" placeholder="Enter your display name" required style="width: 100%; padding: 12px 16px; background: var(--code-bg); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none;">
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; font-family: 'Space Mono', monospace; text-transform: uppercase;">Email Address (Read-only)</label>
          <input type="email" id="email-input" disabled style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.02); border: 1.5px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 1rem; cursor: not-allowed;">
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px; width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;">Save Changes</button>
      </form>

      <div id="status-message" style="margin-top: 15px; text-align: center; font-size: 0.9rem; display: none;"></div>

    </div>

  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://pjtpesdhjfvcidfkxord.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqdHBlc2RoamZ2Y2lkZmt4b3JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDUyNDUsImV4cCI6MjEwMzcyMTI0NX0.110aDXEqJ4PxjKWNv1Z2YNR8frklg3WW1u0HePDoN38';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nameInput = document.getElementById('display-name-input');
    const usernameInput = document.getElementById('username-input');
    const usernameHint = document.getElementById('username-hint');
    const emailInput = document.getElementById('email-input');
    const avatarInput = document.getElementById('avatar-input');
    const avatarPreview = document.getElementById('avatar-preview');
    const form = document.getElementById('settings-form');
    const statusMsg = document.getElementById('status-message');

    let currentUserId = null;
    let usernameIsLocked = false;

    avatarInput.addEventListener('input', () => {
      avatarPreview.src = avatarInput.value || 'https://via.placeholder.com/50';
    });

    async function fetchUserData() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUserId = user.id;

      emailInput.value = user.email || '';

      nameInput.value = '';
      avatarInput.value = '';
      avatarPreview.src = 'https://via.placeholder.com/50';
      usernameInput.value = '';

      const { data } = await supabase
        .from('profiles')
        .select('display_name, username, avatar_url')
        .eq('user_id', user.id)
        .maybeSingle();

      if (data) {
        if (data.display_name) {
          nameInput.value = data.display_name;
          localStorage.setItem('limn_username', data.display_name);
        }
        if (data.avatar_url) {
          avatarInput.value = data.avatar_url;
          avatarPreview.src = data.avatar_url;
          localStorage.setItem('limn_avatar', data.avatar_url);
        }
        if (data.username) {
          usernameInput.value = data.username;
          usernameIsLocked = true;
          usernameInput.readOnly = true;
          usernameInput.style.cursor = 'not-allowed';
          usernameHint.textContent = 'Your permanent @handle. Cannot be changed.';
        } else {
          usernameIsLocked = false;
          usernameInput.readOnly = false;
          usernameInput.style.cursor = 'text';
          usernameHint.textContent = 'Pick a username. Once saved, it cannot be changed.';
        }
      } else {
        usernameIsLocked = false;
        usernameInput.readOnly = false;
        usernameInput.style.cursor = 'text';
        usernameHint.textContent = 'Pick a username. Once saved, it cannot be changed.';
      }
    }

    function validateUsername(u) {
      if (!u) return 'Username cannot be empty.';
      if (u.length < 3) return 'Username must be at least 3 characters.';
      if (u.length > 20) return 'Username must be 20 characters or less.';
      if (!/^[a-z0-9_]+$/.test(u)) return 'Only lowercase letters, numbers, and underscores.';
      return null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMsg.style.display = 'block';
      statusMsg.style.color = 'var(--accent2)';
      statusMsg.textContent = 'Saving changes...';

      const newName = nameInput.value.trim();
      const newAvatarUrl = avatarInput.value.trim();
      const rawUsername = usernameInput.value.trim().toLowerCase().replace(/^@/, '');

      const upsertData = {
        user_id: currentUserId,
        display_name: newName,
        avatar_url: newAvatarUrl
      };

      if (!usernameIsLocked) {
        const err = validateUsername(rawUsername);
        if (err) {
          statusMsg.style.color = '#f87171';
          statusMsg.textContent = '⚠️ ' + err;
          return;
        }

        const { data: existing } = await supabase
          .from('profiles')
          .select('user_id')
          .eq('username', rawUsername)
          .neq('user_id', currentUserId)
          .maybeSingle();

        if (existing) {
          statusMsg.style.color = '#f87171';
          statusMsg.textContent = '⚠️ That username is already taken.';
          return;
        }

        upsertData.username = rawUsername;
      }

      const { error } = await supabase
        .from('profiles')
        .upsert(upsertData, { onConflict: 'user_id' });

      if (error) {
        statusMsg.style.color = '#f87171';
        statusMsg.textContent = '⚠️ ' + error.message;
        return;
      }

      localStorage.setItem('limn_username', newName);
      if (newAvatarUrl) {
        localStorage.setItem('limn_avatar', newAvatarUrl);
      }

      if (!usernameIsLocked && upsertData.username) {
        usernameInput.value = upsertData.username;
        usernameIsLocked = true;
        usernameInput.readOnly = true;
        usernameInput.style.cursor = 'not-allowed';
        usernameHint.textContent = 'Your permanent @handle. Cannot be changed.';
      }

      statusMsg.style.color = 'var(--accent2)';
      statusMsg.textContent = '✨ Settings updated successfully!';
      setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
    });

    fetchUserData();
  </script>
</body>
  </html>
